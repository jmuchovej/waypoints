#:tombi toml-version = "v1.1.0"
#:schema https://raw.githubusercontent.com/crate-ci/typos/master/config.schema.json

[files]
  ignore-files   = true
  ignore-hidden  = false
  ignore-vcs     = true
  ignore-dot     = true
  extend-exclude = [
    ".mailmap",
    ".config/treefmt.toml",
    ".config/mise*.toml",
    "*.sops.yaml",
    "*.edn",
    "*.png",
    "*.icns",
    "*.ico",
  ]

[default]
  extend-ignore-re = [
    # PNG is a file format, not a typo
    "PNG",
    "doas",
    # macOS version
    "Big Sur",
    # Stripped version of reserved keyword `type`
    "typ",
    # `image` crate method: Delay::from_numer_denom_ms
    "numer",
    # Abbreviation for foreignObject in mermaid SVG processing
    "fo",
    ".*\\.edn$",
    "\\$?nin",
  ]
  check-filename   = true

  [default.extend-words]
    writeable = "writeable"

[type.storyboard]
  extend-glob      = [ "*.storyboard", "*.xib" ]
  extend-ignore-re = [ '\b[A-Za-z0-9]{3}-[A-Za-z0-9]{2}-[A-Za-z0-9]{3}\b' ]
