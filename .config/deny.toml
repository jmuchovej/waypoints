#:tombi toml-version = "v1.1.0"

[graph]
  all-features        = false
  no-default-features = false
  # features            = []
  targets             = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-linux-android",
    "x86_64-linux-android",
  ]

[output]
  feature-depth = 1

[advisories]
  ignore = [
    {
      id     = "RUSTSEC-2026-0206",
      reason = "rustybuzz via usvg; waiting on upstream migration to harfrust"
    },
    {
      id     = "RUSTSEC-2026-0192",
      reason = "ttf-parser via usvg; waiting on upstream migration to skrifa"
    },
    {
      id     = "RUSTSEC-2024-0370",
      reason = "proc-macro-error, compile-time only, transitive"
    },
    {
      id     = "RUSTSEC-2024-0436",
      reason = "paste via specta/rav1e/pulp, compile-time only"
    },
    {
      id     = "RUSTSEC-2026-0173",
      reason = "proc-macro-error2, compile-time only, transitive"
    },
    {
      id     = "RUSTSEC-2026-0367",
      reason = "zip via tauri-plugin-updater, Windows targets only; blocked on tauri bumping zip to 9, and the updater verifies the archive signature before extracting"
    },
    {
      id     = "RUSTSEC-2026-0368",
      reason = "zip via tauri-plugin-updater, Windows targets only; blocked on tauri bumping zip to 9, and the updater verifies the archive signature before extracting"
    },
    {
      id     = "RUSTSEC-2026-0369",
      reason = "zip via tauri-plugin-updater, Windows targets only; blocked on tauri bumping zip to 9, and the updater verifies the archive signature before extracting"
    },
    {
      id     = "RUSTSEC-2026-0370",
      reason = "zvariant via zbus 5 via tauri-plugin-notification/single-instance on Linux; blocked on tauri moving to zbus 6"
    },
    {
      id     = "RUSTSEC-2026-0371",
      reason = "zbus_names via zbus 5 via tauri-plugin-notification/single-instance on Linux; blocked on tauri moving to zbus 6"
    },
    {
      id     = "RUSTSEC-2026-0372",
      reason = "zvariant_derive via zbus 5 via tauri-plugin-notification/single-instance on Linux; blocked on tauri moving to zbus 6"
    },
  ]

[licenses]
  confidence-threshold = 0.8
  allow                = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
  ]

  [[licenses.clarify]]
    crate         = "cfg_block"
    expression    = "Apache-2.0"
    license-files = [ { path = "LICENSE", hash = 0xc9663a1e } ]

  [licenses.private]
    ignore = true

[bans]
  multiple-versions          = "warn"
  wildcards                  = "allow"
  highlight                  = "all"
  workspace-default-features = "allow"
  external-default-features  = "allow"
  allow-workspace            = false

[sources]
  unknown-registry = "deny"
  unknown-git      = "deny"
  allow-registry   = [ "https://github.com/rust-lang/crates.io-index" ]
  allow-git        = []

  [sources.allow-org]
    github    = []
    gitlab    = []
    bitbucket = []
