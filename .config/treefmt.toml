#:tombi toml-version = "v1.1.0"
#:schema https://www.schemastore.org/treefmt.json

allow-missing-formatter = true
excludes                = [
  "*.lock",
  "*.patch",
  "go.mod",
  "go.sum",
  ".gitattributes",
  ".gitignore",
  ".gitmodules",
  ".hgignore",
  ".svnignore",
  "LICENSE",
  "vendor/*",
  "*.{gif,ico}",
  "*.{properties,gradle}",
  "*.{pbxproj,xcconfig}",
  "*mise.toml"
]
on-unmatched            = "info"
verbose                 = 1

[formatter.nixfmt]
  command  = "nixfmt"
  includes = [ "*.nix" ]

[formatter.keep-sorted]
  command  = "keep-sorted"
  includes = [ "*" ]

[formatter.nixf-diagnose]
  command  = "nixf-diagnose"
  options  = [
    "--auto-fix",
    "--ignore=sema-unused-def-lambda-witharg-formal",
    "--ignore=sema-unused-def-lambda-noarg-formal",
    "--ignore=sema-primop-overridden"
  ]
  includes = [ "*.nix" ]

[formatter.clang-format]
  command  = "clang-format"
  options  = [ "-i" ]
  includes = [
    "*.c",
    "*.cc",
    "*.cpp",
    "*.h",
    "*.hh",
    "*.hpp",
    "*.glsl",
    "*.vert",
    ".tesc",
    ".tese",
    ".geom",
    ".frag",
    ".comp"
  ]

[formatter.deadnix]
  command  = "deadnix"
  options  = [ "--edit" ]
  includes = [ "*.nix" ]

[formatter.just]
  command  = "treefmt-just"
  includes = [
    "[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]",
    "*/[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]",
    ".[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]",
    "*/.[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]",
    "*.[Jj][Uu][Ss][Tt]",
    "*.[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]"
  ]

[formatter.ktfmt]
  command  = "ktfmt"
  includes = [ "*.kt", "*.kts" ]

[formatter.oxfmt]
  command  = "oxfmt"
  options  = [ "-c", ".config/oxfmtrc.jsonc" ]
  excludes = [ "website/*.md" ]
  includes = [
    "*.cjs",
    "*.css",
    "*.graphql",
    "*.hbs",
    "*.html",
    "*.js",
    "*.json",
    "*.json5",
    "*.jsonc",
    "*.jsx",
    "*.md",
    "*.mdx",
    "*.mjs",
    "*.mustache",
    "*.scss",
    "*.ts",
    "*.tsx",
    "*.vue",
    "*.yaml",
    "*.yml"
  ]

[formatter.oxipng]
  command  = "oxipng"
  options  = [ "--opt", "2" ]
  includes = [ "*.png" ]

[formatter.rufo]
  command  = "rufo"
  options  = [ "-x" ]
  includes = [ "*.rb", "**/Podfile", "*.podspec" ]

[formatter.rustfmt]
  command  = "rustfmt"
  options  = [ "--config", "skip_children=true", "--edition", "2024" ]
  includes = [ "*.rs" ]

[formatter.statix]
  command  = "treefmt-statix"
  includes = [ "*.nix" ]

[formatter.swift-format]
  command  = "swift-format"
  options  = [ "-i" ]
  includes = [ "*.swift" ]

[formatter.tombi]
  command  = "tombi"
  options  = [ "format" ]
  includes = [ "*.toml" ]

[formatter.typos]
  command  = "typos"
  options  = [ "--write-changes", "--force-exclude", "-c", ".config/typos.toml" ]
  includes = [ "*" ]

[formatter.xmllint]
  command  = "treefmt-xml"
  includes = [
    "*.xml",
    "*.svg",
    "*.xhtml",
    "*.xsl",
    "*.xslt",
    "*.dtd",
    "*.xsd",
    "*.entitlements",
    "*.manifest",
    "*.plist",
    "*.storyboard",
    "*.xc{scheme,settings,workspacedata}"
  ]

[formatter.zizmor]
  command  = "zizmor"
  includes = [
    ".github/workflows/*.yml",
    ".github/workflows/*.yaml",
    ".github/actions/**/*.yml",
    ".github/actions/**/*.yaml"
  ]
