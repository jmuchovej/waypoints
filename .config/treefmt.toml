#:tombi toml-version = "v1.1.0"
#:schema https://www.schemastore.org/treefmt.json

allow-missing-formatter = true
excludes                = [
  "*.lock",
  "*.patch",
  ".git{attributes,ignore,modules}",
  "LICENSE",
  "vendor/*",
  "*.{gif,ico}",
  "*.{properties,gradle}",
  "*.{pbxproj,xcconfig}",
  # generated by devenv; tombi would reformat what devenv writes and
  # check-generated would never converge.
  "mise.toml",
  "*/mise.toml",
  "mise.*.toml",
  "*/mise.*.toml",
  "libs.versions.toml",
  "*/libs.versions.toml",
]
on-unmatched            = "info"
verbose                 = 1

[formatter.nixfmt]
  command  = "nixfmt"
  includes = [ "*.nix" ]

[formatter.keep-sorted]
  command  = "keep-sorted"
  includes = [ "*" ]

[formatter.clang-format]
  command  = "clang-format"
  options  = [ "-i" ]
  includes = [
    "*.{c,cc,cpp}",
    "*.{h,hh,hpp}",
  ]

[formatter.just]
  command  = "treefmt-just"
  includes = [
    "[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]",
    "*/[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]",
  ]

[formatter.ktfmt]
  command  = "ktfmt"
  includes = [ "*.kt", "*.kts" ]

[formatter.oxfmt]
  command  = "oxfmt"
  options  = [ "-c", ".config/oxfmtrc.jsonc" ]
  excludes = [ "website/*.md" ]
  includes = [
    "*.{css,scss}",
    "*.graphql",
    "*.html",
    "*.{cjs,mjs,js,jsx}",
    "*.{json,json5,jsonc}",
    "*.{md,mdx}",
    "*.{hbs,mustache}",
    "*.{ts,tsx}",
    "*.vue",
    "*.{yaml,yml}",
  ]

[formatter.oxipng]
  command  = "oxipng"
  options  = [ "--opt", "2" ]
  includes = [ "*.png" ]

[formatter.rufo]
  command  = "rufo"
  options  = [ "-x" ]
  includes = [ "*.rb", "**/Podfile", "*.podspec" ]

[formatter.rustfmt]
  command  = "rustfmt"
  options  = [ "--config", "skip_children=true", "--edition", "2024" ]
  includes = [ "*.rs" ]

[formatter.swift-format]
  command  = "swift-format"
  options  = [ "-i" ]
  includes = [ "*.swift" ]

[formatter.tombi]
  command  = "tombi"
  options  = [ "format" ]
  includes = [ "*.toml" ]

[formatter.typos]
  command  = "typos"
  options  = [ "--write-changes", "--force-exclude", "-c", ".config/typos.toml" ]
  includes = [ "*" ]

[formatter.xml]
  command  = "treefmt-xml"
  includes = [
    "*.xml",
    "*.svg",
    "*.entitlements",
    "*.manifest",
    "*.plist",
    "*.storyboard",
    "*.xc{scheme,settings,workspacedata}"
  ]
