min_version = "2026.8.6"

[[env]]
PROJECT_ROOT = "{{ config_root }}"

[[env]]
PROJECT_CONFIG_PATH = "{{ env.PROJECT_ROOT }}/.config"

[[env]]

[env._]
path = ["tooling/bin"]

[[env]]
CLIPPY_CONF_DIR = "{{ env.PROJECT_CONFIG_PATH }}"
JJ_HOOKS_RUNNER = "hk"
TAURI_ANDROID_PROJECT_PATH = "{{ env.PROJECT_ROOT }}/src-tauri/gen/android"
TAURI_APP_PATH = "{{ env.PROJECT_ROOT }}/src-tauri"
TAURI_FRONTEND_PATH = "{{ env.PROJECT_ROOT }}/src"
TAURI_IOS_PROJECT_PATH = "{{ env.PROJECT_ROOT }}/src-tauri/gen/apple"
TREEFMT_CONFIG = "{{ env.PROJECT_CONFIG_PATH }}/treefmt.toml"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust", "pnpm"]
lockfile = true

[tools]
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:FiloSottile/age" = "1.3.1"
"aqua:cachix/secretspec" = "0.19.1"
"aqua:casey/just" = "1.58.0"
"aqua:crate-ci/typos" = "1.49.0"
"aqua:getsops/sops" = "3.13.3"
"aqua:google/keep-sorted" = "0.9.0"
"aqua:jdx/hk" = "1.55.0"
"aqua:lycheeverse/lychee" = "0.24.2"
"aqua:mic92/nixfmt-rs" = "0.4.1"
"aqua:mikefarah/yq" = "4.53.3"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.143"
"aqua:nushell/nushell" = "0.115.0"
"aqua:orhun/git-cliff" = "2.13.1"
"aqua:oxipng/oxipng" = "10.1.1"
"aqua:tauri-apps/tauri/cargo-tauri" = "2.11.4"
"aqua:tombi-toml/tombi" = "1.4.0"
"aqua:zizmorcore/zizmor" = "1.29.0"
"core:deno" = "2.9.4"
"core:node" = "24.19.0"
"core:ruby" = "3.4.9"
"core:swift" = "5.10.1"
"gem:rufo" = "0.18.1"
"github:JetBrains/kotlin" = "2.4.10"
"github:facebook/ktfmt" = "0.63"
"npm:oxfmt" = "0.61.0"
"npm:wrangler" = "4.94.0"

[tools."aqua:numtide/treefmt"]
os = ["linux", "macos"]
version = "2.5.0"

[tools."aqua:yonaskolb/XcodeGen"]
os = ["macos"]
version = "2.44.1"

[tools."gem:fastlane"]
os = ["linux", "macos"]
version = "2.232.2"

[vars]
WAYPOINTS_FORMATTERS = "aqua:crate-ci/typos,aqua:google/keep-sorted,aqua:mic92/nixfmt-rs,aqua:numtide/treefmt,aqua:oxipng/oxipng,aqua:tombi-toml/tombi,aqua:zizmorcore/zizmor,gem:rufo,github:facebook/ktfmt,npm:oxfmt"
