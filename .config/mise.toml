min_version = "2026.8.6"

[env]
PROJECT_ROOT = "{{ config_root }}"

[env._.file]
expand = true
path = ".env"

[tools]
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:FiloSottile/age" = "1.3.1"
"aqua:cachix/secretspec" = "0.19.1"
"aqua:casey/just" = "1.58.0"
"aqua:crate-ci/typos" = "1.49.0"
"aqua:google/keep-sorted" = "0.9.0"
"aqua:jdx/hk" = "1.55.0"
"aqua:lycheeverse/lychee" = "0.24.2"
"aqua:mikefarah/yq" = "4.53.3"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.143"
"aqua:nushell/nushell" = "0.115.0"
"aqua:orhun/git-cliff" = "2.13.1"
"aqua:oxipng/oxipng" = "10.1.1"
"aqua:pnpm/pnpm" = "11.21.0"
"aqua:tauri-apps/tauri/cargo-tauri" = "2.11.4"
"aqua:tombi-toml/tombi" = "1.4.0"
"aqua:zizmorcore/zizmor" = "1.29.0"
"core:deno" = "2.9.4"
"core:node" = "24.19.0"
"core:ruby" = "3.4.9"
"core:swift" = "5.10.1"
"github:JetBrains/kotlin" = "2.4.10"
"github:Mic92/nixfmt-rs" = "0.4.1"
"github:facebook/ktfmt" = "0.63"

[tools."aqua:numtide/treefmt"]
os = ["linux", "macos"]
version = "2.5.0"

[tools."aqua:yonaskolb/XcodeGen"]
os = ["macos"]
version = "2.44.1"

[tools."gem:fastlane"]
depends = ["ruby"]
os = ["linux", "macos"]
version = "2.232.2"

[tools."gem:rufo"]
depends = ["ruby"]
version = "0.18.1"

[tools."github:getsops/sops"]
slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0"
slsa_signer_issuer = "https://token.actions.githubusercontent.com"
version = "3.13.3"

[tools."npm:oxfmt"]
depends = ["node"]
version = "0.61.0"

[tools."npm:wrangler"]
depends = ["node"]
version = "4.94.0"

[vars]
WAYPOINTS_FORMATTERS = "aqua:crate-ci/typos,aqua:google/keep-sorted,aqua:numtide/treefmt,aqua:oxipng/oxipng,aqua:tombi-toml/tombi,aqua:zizmorcore/zizmor,gem:rufo,github:Mic92/nixfmt-rs,github:facebook/ktfmt,npm:oxfmt"
