#:tombi toml-version = "v1.1.0"
# mise configuration that should be hand-maintained rather than projected from devenv.

[env]
  PROJECT_ROOT = "{{ config_root }}"
  _.file       = { expand = true, path = ".env" }
  _.path       = [ "{{ config_root }}/tooling/bin", "{{ env.CARGO_TARGET_DIR }}/debug" ]

[settings]
  experimental = true

  idiomatic_version_file_enable_tools = [
    "rust"                                 # load from `rust-toolchain`
    # "pnpm" # expressly omitted because we explicitly pin it in `mise.toml`
  ]

  lockfile                 = true
  locked                   = true
  locked_verify_provenance = true

  # let a fresh release age before this repo installs it.
  minimum_release_age          = "7d"
  minimum_release_age_excludes = []

  # `safe` is only respected by mise in its global config
