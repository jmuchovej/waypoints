[profile.default]
  slow-timeout = { period = "60s", terminate-after = 1 }

  # trybuild spawns a real cargo build per case, so a cold CI runner needs
  # minutes here, not seconds.
  [[profile.default.overrides]]
    filter       = "test(=compile_fail)"
    slow-timeout = { period = "300s", terminate-after = 2 }

  # since outpost::readiness seeds hundreds of holds through real registration
  # before watching the binary scan them – give some grace to CI runners.
  [[profile.default.overrides]]
    filter       = "binary(readiness)"
    slow-timeout = { period = "60s", terminate-after = 5 }

  # the fixture plugin's module tests each run a nested release build for
  # wasm32-unknown-unknown into their own target directory; cold, a CI runner
  # needs minutes, and two at once only block each other on cargo's locks.
  [[profile.default.overrides]]
    filter       = "binary_id(plain-markdown::module)"
    slow-timeout = { period = "120s", terminate-after = 5 }
    test-group   = "wasm-module"

[test-groups.wasm-module]
  max-threads = 1
