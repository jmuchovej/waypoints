#:tombi toml-version = "v1.1.0"
# SPDX-FileCopyrightText: 2026 John Muchovej
# SPDX-License-Identifier: AGPL-3.0-or-later

# Mirrors `.config/deny.toml`: the same allowlist and the same targets, so the
# notices are the same whichever machine generates them.
accepted                = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unlicense",
  "0BSD",
  "BSL-1.0",
  "NCSA",
  "CDLA-Permissive-2.0",
]
targets                 = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "x86_64-linux-android",
]
ignore-dev-dependencies = true
private                 = { ignore = true }

# The app crate is first-party but has no `publish = false`; see `.config/deny.toml`.
[Waypoints]
  accepted = [ "AGPL-3.0-or-later" ]
