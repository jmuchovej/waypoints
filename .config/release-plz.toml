#:schema https://github.com/MarcoIeni/release-plz/raw/main/.schema/latest.json
# SPDX-FileCopyrightText: 2026 John Muchovej
# SPDX-License-Identifier: AGPL-3.0-or-later

[workspace]
  git_release_enable = true
  git_tag_enable     = false
  semver_check       = true
  allow_dirty        = false
  changelog_update   = true
  changelog_config   = ".config/cliff.toml"

[[package]]
  name               = "Waypoints"
  git_tag_name       = "v{{ version.major }}.{{ version.minor }}.x"
  git_tag_enable     = true
  git_release_enable = true
