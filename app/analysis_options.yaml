include: package:flutter_lints/flutter.yaml
analyzer:
  errors:
    avoid_redundant_argument_values: ignore
    constant_identifier_names: ignore
    unnecessary_brace_in_string_interps: ignore
    invalid_annotation_target: ignore
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
    avoid_print: error
  enable-experiment:
    - dot-shorthands
  plugins:
    - custom_lint
custom_lint:
  enable_all_lint_rules: true
linter:
  rules:
    # avoid_print: true
    require_trailing_commas: true
    prefer_collection_literals: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    prefer_final_locals: true
    sized_box_for_whitespace: true
    use_decorated_box: true
    unnecessary_parenthesis: true
    unnecessary_await_in_return: true
    unnecessary_raw_strings: true
    avoid_unnecessary_containers: true
    avoid_redundant_argument_values: false
    avoid_unused_constructor_parameters: true
    always_declare_return_types: true
    sort_constructors_first: true
    unawaited_futures: true
    avoid_relative_lib_imports: true
    prefer_relative_imports: true
dart_code_metrics:
  extends:
    - package:dart_code_metrics_presets/recommended.yaml
    - package:dart_code_metrics_presets/metrics_recommended.yaml
  metrics-exclude:
    - test/**
  rules-exclude:
    - test/**
  rules:
    # avoid-collection-mutating-methods: true
    newline-before-return: true
    avoid-importing-entrypoint-exports:
      only-in-src: true
    prefer-match-file-name: false
    avoid-suspicious-super-overrides: false
    prefer-overriding-parent-equality: false
    prefer-correct-callback-field-name: false
    prefer-single-widget-per-file: false
    match-getter-setter-field-names: false
    prefer-dedicated-media-query-methods: false
    avoid-shadowing: false
    enum-constants-ordering: false
    avoid-unsafe-collection-methods: false
    prefer-prefixed-global-constants: false
    avoid-returning-widgets: false
    avoid-unnecessary-overrides: false
    arguments-ordering:
      first:
        - key
        - spec
      last:
        - child
        - children
    avoid-nested-conditional-expressions:
      acceptable-level: 3
    member-ordering:
      order:
        - public-fields
        - private-fields
        - constructors
        - static-methods
        - private-methods
        - private-getters
        - private-setters
        - public-getters
        - public-setters
        - public-methods
        - overridden-public-methods
        - overridden-public-getters
        - build-method
    prefer-named-boolean-parameters:
      ignore-single: true
