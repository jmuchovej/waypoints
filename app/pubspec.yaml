name: waypoints
description: "Insights into how you spend your energy and time."
publish_to: "none"
homepage: "https://waypoints.so/"
documentation: "https://waypoints.so/docs/"
repository: https://github.com/waypoints-hq/waypoints
issue_tracker: https://github.com/waypoints-hq/waypoints/issues
resolution: workspace

version: 0.0.1+1

environment:
  sdk: ^3.9.0

dependencies:
  cartograph:
    path: rust_builder
  flutter:
    sdk: flutter

  objectbox: ^5.0.0
  objectbox_flutter_libs: any
  flutter_rust_bridge: 2.11.1
  freezed_annotation: ^3.1.0
  go_router: ^17.0.0
  intl: ^0.20.2
  jiffy: ^6.4.3
  uuid: ^4.5.1
  attributed_text: ^0.4.5
  super_editor: ^0.3.0-dev.34
  google_fonts: ^6.3.2
  phosphor_flutter: ^2.1.0
  riverpod: ^3.0.1
  hooks_riverpod: ^3.0.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^3.0.1
  mix: ^2.0.0-dev.5
  remix: ^0.1.0-beta.1
  collection: ^1.19.1
  logger: ^2.6.2
  path: ^1.9.1
  follow_the_leader: 0.5.2
  logging: ^1.3.0
  universal_platform: ^1.1.0
  universal_html: ^2.3.0
  meta: ^1.16.0
  equatable: ^2.0.7
  super_text_layout: ^0.1.19

  path_provider: any
  flutter_riverpod: any
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

  build_runner: 2.7.1
  freezed: ^3.1.0
  custom_lint: 0.8.0
  riverpod_generator: ^3.0.1
  riverpod_lint: ^3.0.3
  objectbox_generator: any
  flutter_flavorizr: ^2.4.0
  lean_builder: ^0.1.0-alpha.5

flutter:
  uses-material-design: true
  generate: true

  assets: []

objectbox:
  output_dir: src/objectbox
