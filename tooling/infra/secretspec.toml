[project]
  name     = "infra"
  revision = "1.0"

[providers]
  op = { uri = "onepassword://waypoints.so" }

[profiles.default]
  TOFU_STATE_PASSPHRASE = {
    description = "OpenTofu's state-encryption password",
    refs        = { op = { item = "OpenTofu", field = "password" } }
  }
  PGHOST                = {
    description = "Postgres database host",
    refs        = { op = { item = "infra.db", field = "server" } },
  }
  PGPORT                = {
    description = "Postgres database port",
    refs        = { op = { item = "infra.db", field = "port" } }
  }
  PGDATABASE            = {
    description = "Postgres database name",
    refs        = { op = { item = "infra.db", field = "database" } }
  }
  PGUSER                = {
    description = "Postgres database user",
    refs        = { op = { item = "infra.db", field = "username" } }
  }
  PGPASSWORD            = {
    description = "Postgres database password",
    refs        = { op = { item = "infra.db", field = "password" } }
  }

  [profiles.default.defaults]
    required  = true
    providers = [ "op" ]

[scopes.tofu-backend]
  secrets = [
    "PGHOST",
    "PGPORT",
    "PGDATABASE",
    "PGUSER",
    "PGPASSWORD",
  ]
