  #     ref: "2.0.0"
  #     path: "flutter_color_models"
  flutter_localizations:
    sdk: flutter
  intl: any
  logger: ^2.5.0
  collection: ^1.19.1
  path: ^1.9.1
  follow_the_leader: 0.5.2
  logging: ^1.3.0
  universal_platform: ^1.1.0
  universal_html: ^2.2.4
  google_fonts: ^6.3.2
  # drift: ^2.26.1
  # drift_flutter: ^0.2.4
  meta: ^1.16.0
  jiffy: ^6.3.2
  go_router: ^17.0.0
  # Let `SuperEditor` drive dependency selection for SuperEditor-related tools
  super_editor: ^0.3.0-dev.24
