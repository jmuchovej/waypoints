[workspace]
resolver = "3"
members = ["crates/domain", "crates/store", "src-tauri", "crates/editor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Oh the places we'll go on this non-linear thought journey!"
documentation = "https://docs.waypoints.so"
readme = ".github/README.md"
homepage = "https://waypoints.so"
repository = "https://github.com/waypoints-hq/waypoints"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
chrono = { version = "0.4.42", default-features = false, features = ["serde"] }
chrono-tz = { version = "0.10.4", default-features = false, features = [
  "serde",
] }
derive_more = "2.0.1"
eyre = "0.6.12"
fake = { version = "4.4.0", default-features = false }
geo = { version = "0.30.0", features = ["use-serde"] }
iana-time-zone = "0.1.64"
indexmap = { version = "2.0", features = ["serde"] }
open-location-code = { git = "https://github.com/google/open-location-code", version = "0.2.0" }
paste = "1.0.15"
pest = "2.8.3"
pest_derive = "2.8.3"
pulldown-cmark = { version = "0.13", default-features = false }
pretty_assertions = "1.4.1"
rand = "0.8"
regex = "1.11.1"
rstest = "0.26.1"
sea-orm = { version = "1.1.16", default-features = false, features = [
  "macros",
  "runtime-tokio",
  "sqlx-sqlite",
  "with-chrono",
  "with-json",
  "with-uuid",
] }
sea-orm-migration = { version = "1.1.16", default-features = false, features = [
  "cli",
  "runtime-tokio",
  "sqlx-sqlite",
  "with-chrono",
  "with-json",
  "with-uuid",
] }
sea-query = { version = "0.32.7", default-features = false, features = [
  "backend-sqlite",
  "derive",
  "sea-query-derive",
  "with-chrono",
  "with-json",
  "with-uuid",
] }
serde = { version = "1.0.224", features = ["derive"] }
serde_json = { version = "1.0.145", features = [
  "indexmap",
  "preserve_order",
  "raw_value",
] }
thiserror = "2.0.15"
tokio = { version = "1.47.1", features = ["sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
typed-builder = "0.23.2"
uuid = { version = "1.18.1", features = ["js", "serde", "v4"] }

# keep-sorted start
domain = { path = "crates/domain" }
editor = { path = "crates/editor" }
store = { path = "crates/store" }
Waypoints = { path = "src-tauri" }
# keep-sorted end

tauri-plugin-shell = "2.3.4"
tauri-plugin-notification = "2.3.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-store = "2.4.2"
tauri = { version = "2.10.3", features = ["unstable"] }
tauri-build = { version = "2.5.6", features = ["config-toml"] }
wry = { version = "0.54.4", features = [
  "os-webview",
  "protocol",
  "drag-drop",
  "tracing",
  "serde",
] }

typst = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }
typst-library = "0.14"
typst-svg = "0.14"
typst-syntax = "0.14"
typst-utils = "0.14"

specta = { version = "=2.0.0-rc.22", features = [
  "derive",
  "chrono",
  "function",
  "indexmap",
  "serde_json",
  "uuid",
] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["typescript"] }

objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSView",
  "NSScrollView",
] }

[workspace.lints.clippy]
blocks_in_conditions = "allow"
comparison_chain = "allow"
dbg_macro = "deny"
iter_over_hash_type = "warn"
manual_range_contains = "allow"
mutable_key_type = "allow"
todo = "deny"
uninlined_format_args = "warn"
wildcard_in_or_patterns = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
# TODO: figure out how to _only_ allow this in development!
unused = { level = "allow", priority = -1 }
