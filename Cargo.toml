[workspace]
resolver = "2"
members = [
  "crates/moments",
  "crates/flux",
  "crates/flux/migration",
  # "services/transcription/backend",
  # "services/bricks/backend",
]

[workspace.package]
name = "tempo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
categories = ["Task Management", "PKM", "Personal Knowledge-Management", "Energy Management"]
keywords = ["Task Management", "PKM", "Personal Knowledge-Management", "Energy Management"]
description = "Tempo: Life, at your pace, on your terms."
repository = "https://github.com/tempo-do/tempo"
homepage = "https://tempo.do"
license = "AGPL-3.0-or-later"
authors = ["John Muchovej"]

[workspace.dependencies]
tempo-flux = { path = "services/flux/backend" }

# Shared Dependencies
uuid        = { version = "1.11.0", features = ["v4", "macro-diagnostics"] }
chrono      = { version = "0.4.39", features = [ "serde" ] }
chrono-tz   = { version = "0.10.0", features = [ "serde" ] }
serde       = { version = "1.0.219", features = [ "derive" ] }
serde_json  = { version = "1.0.140" }
tokio       = { version = "1.42.0", features = [ "full" ] }
tracing     = { version = "0.1.41", features = [ "log" ] }
derive_more = { version = "1.0.0", features = [
  "add", "add_assign",
  "display",
]}

# Native building
flutter_rust_bridge         = "2.9.0"
cbindgen                    = "0.28.0"
flutter_rust_bridge_codegen = "2.9.0"

# Dependencies for `chopper-core`
ulid      = { version = "1.1.3", features = [ "serde" ] }

# Dependencies for time-based tools
getset        = "0.1.3"
humantime     = "2.1.0"
thiserror     = "2.0.9"
displaydoc    = "0.2.5"
typed-builder = "0.20.0"
clap          = { version = "4.5.23", features = [ "env", "wrap_help", "derive" ]}

# Dependencies for data models
async-std         = { version = "1", features = ["attributes", "tokio1"] }
sea-orm           = { version = "1.1.3", features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "with-chrono", "with-json", "with-uuid",
  "mock",
]}
sea-orm-migration = { version = "1.1.3", features = [
  "runtime-tokio-rustls",
  #! Pending Turso/libSQL support!
  #!   https://github.com/launchbadge/sqlx/issues/2674
  "sqlx-sqlite",
  "with-chrono", "with-json", "with-uuid",
] }

# Testing Dependencies
eyre    = { version = "0.6.12" }
rstest  = { version = "0.23.0" }

[workspace.lints.rust]
unsafe_code                   = "forbid"
# missing_docs                  = "warn"
rust_2018_idioms              = "warn"
trivial_casts                 = "warn"
# unused_lifetimes              = "warn"
unused_qualifications         = "warn"
bad_style                     = "warn"
dead_code                     = "allow" # TODO: "warn"
improper_ctypes               = "warn"
# missing_copy_implementations  = "warn"
# missing_debug_implementations = "warn"
non_shorthand_field_patterns  = "warn"
no_mangle_generic_items       = "warn"
overflowing_literals          = "warn"
path_statements               = "warn"
patterns_in_fns_without_body  = "warn"
trivial_numeric_casts         = "warn"
unused_results                = "warn"
unused_extern_crates          = "warn"
unused_import_braces          = "warn"
unconditional_recursion       = "warn"
unused                        = "warn"
unused_allocation             = "warn"
unused_comparisons            = "warn"
unused_parens                 = "warn"
while_true                    = "warn"

[workspace.lints.clippy]
pedantic                      = "warn"
nursery                       = "warn"
expect_used                   = "warn"
unwrap_used                   = "warn"
enum_glob_use                 = "warn"
correctness                   = "warn"
suspicious                    = "warn"
complexity                    = "warn"
perf                          = "warn"
cast_lossless                 = "warn"
default_trait_access          = "warn"
doc_markdown                  = "warn"
manual_string_new             = "warn"
match_same_arms               = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref    = "warn"
module_name_repetitions       = "allow"
