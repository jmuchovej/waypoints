# $schema=https://github.com/zizmorcore/zizmor/raw/refs/heads/main/support/zizmor.schema.json
rules:
  cache-poisoning:
    # Once a job declares an `environment:`, zizmor treats the whole workflow as
    # publishing and flags every cache in it. In these two the only caches are
    # on the test jobs, which publish nothing and whose cache is written from
    # `main` alone; the build jobs that do publish carry no cache. The generator
    # asserts that last part (`environments_follow_the_vault_credential`), so
    # this ignore cannot hide a cache creeping into a publishing job.
    ignore:
      - release-preview.yaml
      - release-stable.yaml
