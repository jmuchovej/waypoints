# $schema=https://github.com/zizmorcore/zizmor/raw/refs/heads/main/support/zizmor.schema.json
rules:
  cache-poisoning:
    # Once a job declares an `environment:`, zizmor treats the whole workflow as
    # publishing and flags every cache in it. The caches here are ones a
    # publishing job can trust. The test jobs restore `rust-cache`, written from
    # `main` alone, and publish nothing. The build jobs touch two kinds: mise's
    # own install cache, which GitHub's default rules let only trusted triggers
    # write and whose contents `mise.lock` pins; and the R2-backed compiler and
    # directory caches, whose write credential lives in the job's environment
    # and is handed only to the processes that contact the store — never to
    # the build, the job environment, or a third-party action. The generator
    # asserts all of that (`environments_follow_the_vault_credential`), so this
    # ignore cannot hide a cache creeping in that those checks would not allow.
    ignore:
      - release-preview.yaml
      - release-stable.yaml
