# $schema: https://www.schemastore.org/github-action.json
name: setup-mise
description: "Sets up the mise toolchain: frees the runner's disk as asked, installs the mise release the lockfile was written by, and restores the compiled Rust dependencies for a job that publishes nothing"
inputs:
  mise-version:
    description: "The mise release to install: the one that writes `.config/mise/mise.lock`"
    required: true
  cache:
    description: Keep mise's own install cache between runs
    default: "false"
  free-disk:
    description: "Reclaim the runner image's unused toolchains first: `none`, `all`, or `keep-android` for a job that builds for Android"
    default: none
  rust-cache:
    description: Restore the compiled registry dependencies, written only from `main`; never for a job that publishes
    default: "false"
runs:
  using: composite
  steps:
    - id: free-disk
      name: Free runner disk space
      if: inputs.free-disk != 'none'
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
      with:
        android: ${{ inputs.free-disk == 'all' }}
        dotnet: "true"
        haskell: "true"
        large-packages: "true"
        docker-images: "true"
        preinstalled-runtimes: "false"
        swap-storage: "false"
    - id: setup-mise # zizmor: ignore[cache-poisoning] mise's install cache under GitHub's default write rules, tools pinned by mise.lock
      name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        version: ${{ inputs.mise-version }}
        cache: ${{ inputs.cache }}
    - id: rust-cache # zizmor: ignore[cache-poisoning] written only from main (save-if), restored by test jobs that publish nothing
      name: Cache Rust dependencies
      if: inputs.rust-cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
