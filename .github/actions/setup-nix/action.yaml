# $schema: https://www.schemastore.org/github-action.json
name: setup-nix
description: "Sets up Nix for a job entered through the devenv shell: frees the runner's disk, installs Nix with the devenv binary cache, and installs the profile packages the job's first command needs"
inputs:
  packages:
    description: The nixpkgs attributes to install into the ambient profile, space-separated
    default: devenv
  extra-nix-config:
    description: Lines appended to `nix.conf`
    default: ""
runs:
  using: composite
  steps:
    - id: free-disk
      name: Free runner disk space
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
      with:
        android: "true"
        dotnet: "true"
        haskell: "true"
        large-packages: "true"
        docker-images: "true"
        preinstalled-runtimes: "false"
        swap-storage: "false"
    - id: setup-nix
      name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: ${{ inputs.extra-nix-config }}
    - id: setup-devenv-cachix
      name: Use the devenv binary cache
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
      with:
        name: devenv
    - id: setup-nix-profile
      name: Install the profile packages
      run: |-
        refs=()
        for package in ${PACKAGES}; do refs+=("nixpkgs#${package}"); done
        nix profile install "${refs[@]}"
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
