# Generated from xtask::workflows::devenv_update
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: update devenv inputs
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SECRETSPEC_PROVIDER: sops
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}
permissions: {}
jobs:
  devenv-update:
    name: refresh devenv.lock and everything generated from it
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - id: setup-nix
        name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - id: setup-devenv-cachix
        name: Use the devenv binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: devenv
      - id: setup-nix-profile
        name: Install devenv and secretspec
        run: "nix profile install nixpkgs#devenv nixpkgs#secretspec"
        shell: bash
      - id: devenv-update
        name: Update devenv inputs
        run: |-
          devenv update
          devenv shell cargo xtask workflows
        shell: bash
        env:
          SECRETSPEC_REASON: devenv update refreshes locked inputs and regenerates devenv- and xtask-managed files; no secret values are read
      - name: Resolve the automation secrets
        run: secretspec export --profile automation --format gha
        shell: bash
        env:
          SECRETSPEC_PROVIDER: sops
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SECRETSPEC_REASON: CI resolves the automation profile to authenticate as the app it names
      - id: app-token
        name: Mint a wp-botswain token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ env.WP_BOTSWAIN_APP_ID }}
          private-key: ${{ env.WP_BOTSWAIN_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - id: create-pull-request
        name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: devenv/update
          delete-branch: "true"
          sign-commits: "true"
          title: "chore(devenv): update locked inputs"
          body: |-
            Ran `devenv update`, then regenerated everything that derives from the lockfile — devenv's `files."..."` outputs, `mise.lock`, and the workflows under `.github/workflows`.

            Opened by the weekly schedule in `xtask::workflows::devenv_update`. Review the toolchain moves before merging; `check-generated` proves only that the tree is self-consistent, not that the new versions work.
          commit-message: "chore(devenv): update locked inputs"
          add-paths: |-
            devenv.lock
            .github/workflows
            .config/mise.lock
            .config/mise.toml
            .config/treefmt.toml
            .pre-commit-config.yaml
concurrency:
  group: devenv-update
  cancel-in-progress: false
