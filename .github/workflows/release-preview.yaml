        name: Prepare the store listings
        run: devenv shell -- xfastlane prepare preview
        shell: bash
        env:
          SECRETSPEC_REASON: xfastlane prepare renders store assets; no secret values are read
      - id: upload-to-store
        name: Upload to the release store
        run: devenv shell -- cargo xtask release-upload --from release --tag "${TAG}"
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          SECRETSPEC_REASON: release-upload derives a short-lived, channel-scoped store credential
