# Generated from xtask::workflows::release
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: Preview
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+-pre.[0-9]+
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: All
        options:
          - All
          - Desktop
          - macOS
          - Linux
          - Windows
          - Mobile
          - Android
          - iOS
      tag:
        description: Release tag (leave empty for build-only, no release)
        type: string
        default: ""
permissions: {}
jobs:
  test-macos:
    name: Test macOS
    runs-on: macos-26
    permissions:
      contents: read
    env:
      MISE_ENV: test
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.11
          cache: "false"
      - id: rust-cache # zizmor: ignore[cache-poisoning] written only from main (save-if), restored by test jobs that publish nothing
        name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: test-plan
        name: cargo xtask test-plan
        run: cargo xtask test-plan  --release
        shell: bash
      - id: nextest
        name: Run release tests
        if: steps.test-plan.outputs.filterset != ''
        run: cargo nextest run --workspace --no-fail-fast -E "${FILTER_EXPR}"
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          FILTER_EXPR: ${{ steps.test-plan.outputs.filterset }}
  test-windows:
    name: Test Windows
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      MISE_ENV: test
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.11
          cache: "false"
      - id: rust-cache # zizmor: ignore[cache-poisoning] written only from main (save-if), restored by test jobs that publish nothing
        name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: test-plan
        name: cargo xtask test-plan
        run: cargo xtask test-plan  --release
        shell: bash
      - id: nextest
        name: Run release tests
        if: steps.test-plan.outputs.filterset != ''
        run: cargo nextest run --workspace --no-fail-fast -E "${FILTER_EXPR}"
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          FILTER_EXPR: ${{ steps.test-plan.outputs.filterset }}
  test-linux:
    name: Test Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      MISE_ENV: test
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - id: free-disk
        name: Free runner disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          android: "true"
          dotnet: "true"
          haskell: "true"
          large-packages: "true"
          docker-images: "true"
          preinstalled-runtimes: "false"
          swap-storage: "false"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.11
          cache: "false"
      - id: rust-cache # zizmor: ignore[cache-poisoning] written only from main (save-if), restored by test jobs that publish nothing
        name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: linux-deps
        name: Install system deps (Linux)
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        shell: bash
      - id: test-plan
        name: cargo xtask test-plan
        run: cargo xtask test-plan  --release
        shell: bash
      - id: nextest
        name: Run release tests
        if: steps.test-plan.outputs.filterset != ''
        run: cargo nextest run --workspace --no-fail-fast -E "${FILTER_EXPR}"
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          FILTER_EXPR: ${{ steps.test-plan.outputs.filterset }}
  create-release:
    needs:
      - test-macos
      - test-windows
      - test-linux
    name: Draft the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      MISE_ENV: xtask
    steps:
      - id: checkout
        name: Checkout
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
          fetch-tags: "true"
      - name: Setup mise
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.11
          cache: "false"
      - id: gen-release-notes
        name: Generate release notes
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        run: git-cliff --latest --output "${RUNNER_TEMP}/notes.md"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: draft-release
        name: Create the draft
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        run: |-
          gh release view "${TAG}" >/dev/null 2>&1 \
          || gh release create "${TAG}" --draft --verify-tag --notes-file "${RUNNER_TEMP}/notes.md" --prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  guard-dispatch:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.platforms != 'All'
    name: Guard the dispatch inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - id: reject-contradiction
        name: Reject a tag with a platforms subset
        run: echo "::error::A release tag cannot be combined with a platforms subset — a subset can never satisfy every required target, so the run would build without ever publishing. Dispatch again with platforms left at All, or leave tag empty for a build-only run." && exit 1
        shell: bash
  build-macos:
    needs:
      - test-macos
      - test-windows
      - test-linux
      - create-release
      - guard-dispatch
    if: github.event_name == 'push' || contains(fromJson('["All","Desktop","macOS"]'), inputs.platforms)
    name: Build macOS
    runs-on: macos-26
    permissions:
      contents: write
    environment:
      name: App Release
    outputs:
      target: ${{ steps.record-target.outputs.target }}
    env:
      MISE_ENV: build-desktop
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - id: setup-mise # zizmor: ignore[cache-poisoning] mise's install cache under GitHub's default write rules, tools pinned by mise.lock
        name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.11
          cache: "true"
      - id: pnpm-store-dir
        name: Pin the pnpm store
        run: |-
          case "${RUNNER_OS}" in
            macOS) dir="${HOME}/Library/Preferences/pnpm" ;;
            Linux) dir="${XDG_CONFIG_HOME:-${HOME}/.config}/pnpm" ;;
            Windows) dir="${LOCALAPPDATA}/pnpm/config" ;;
            *) echo "::error::no pnpm config path for ${RUNNER_OS}"; exit 1 ;;
          esac
          mkdir -p "${dir}"
          printf 'storeDir: %s\n' "${RUNNER_TEMP}/pnpm-store" >> "${dir}/config.yaml"
          echo "pnpm store pinned to ${RUNNER_TEMP}/pnpm-store in ${dir}/config.yaml"
        shell: bash
      - id: cache-restore-pnpm-store
        name: Restore pnpm-store
        run: xcache restore "${CACHE_KEY}" "${RUNNER_TEMP}/pnpm-store"
        shell: bash
        env:
          CACHE_KEY: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          SECRETSPEC_REASON: restoring the pnpm-store snapshot from the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: pnpm-install
        name: Install JS deps
        run: pnpm install --frozen-lockfile
        shell: bash
      - id: cache-save-pnpm-store
        name: Save pnpm-store
        if: "!cancelled() && steps.cache-restore-pnpm-store.outputs.hit != 'true'"
        run: xcache save "${CACHE_KEY}" "${RUNNER_TEMP}/pnpm-store"
        shell: bash
        env:
          CACHE_KEY: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          SECRETSPEC_REASON: saving the pnpm-store snapshot to the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: cache-restore-cargo-registry
        name: Restore cargo-registry
        run: xcache restore "${CACHE_KEY}" "${CARGO_HOME}/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: restoring the cargo-registry snapshot from the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: sccache-start
        name: Start the compiler cache
        run: secretspec run --profile ci --scope cache -- sccache --start-server || echo '::warning::sccache server failed to start; this build compiles without the remote cache'
        shell: bash
        env:
          SECRETSPEC_REASON: the compiler cache server reads and writes the ci-cache bucket for the length of the job; it alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCCACHE_BUCKET: ci-cache
          SCCACHE_S3_KEY_PREFIX: sccache/
          SCCACHE_REGION: auto
          SCCACHE_IDLE_TIMEOUT: "0"
      - id: build-recipe
        name: Build macOS
        run: just tauri::build macos preview
        shell: bash
        env:
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CARGO_BUILD_RUSTC_WRAPPER: sccache
      - id: sccache-stats
        name: Report the compiler cache
        if: always()
        run: |-
          sccache --show-stats
          sccache --stop-server
        shell: bash
      - id: cache-save-cargo-registry
        name: Save cargo-registry
        if: "!cancelled() && steps.cache-restore-cargo-registry.outputs.hit != 'true'"
        run: xcache save "${CACHE_KEY}" "${CARGO_HOME}/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: saving the cargo-registry snapshot to the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: stage-release
        name: Stage the release artifacts
        run: cargo xtask release-stage --platform macos ${TAG:+--tag "${TAG}"}
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - id: upload-artifacts
        name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waypoints-macos-preview
          path: release
          if-no-files-found: error
      - id: record-target
        name: Record the completed target
        run: echo "target=macos" >> "$GITHUB_OUTPUT"
        shell: bash
