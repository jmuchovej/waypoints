      - id: setup-nix
        name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - id: setup-devenv-cachix
        name: Use the devenv binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: devenv
      - id: setup-nix-profile
        name: Install devenv
        run: nix profile install nixpkgs#devenv
        shell: bash
      - id: discard-release
        name: Discard the drafted release
        run: gh release delete "${TAG}" --yes || true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - id: withdraw-from-store
        name: Withdraw uploaded artifacts
        run: devenv shell -- cargo xtask release-withdraw --tag "${TAG}"
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          SECRETSPEC_REASON: release-withdraw derives a short-lived, channel-scoped store credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
