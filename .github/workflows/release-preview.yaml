# Generated from xtask::workflows::release
# Rebuild with `cargo xtask workflows`. Do not edit this file.
# $schema: https://www.schemastore.org/github-workflow.json
name: Preview
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+-pre.[0-9]+
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (leave empty for build-only, no release)
        type: string
        default: ""
      platforms:
        description: Platforms to build
        type: choice
        default: All
        options:
          - All
          - Desktop
          - macOS
          - Linux
          - Windows
          - Android
          - iOS
jobs:
  test-macos:
    name: Test macOS
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: plan
        name: Plan
        run: |
          filterset="$(cargo xtask test-plan --release)"
          echo "filterset=${filterset}" >> "$GITHUB_OUTPUT"
          if [ -n "${filterset}" ]; then
            echo "Testing: ${filterset}"
          else
            echo "No Rust crates affected."
          fi

      - name: Run release tests
        if: steps.plan.outputs.filterset != ''
        run: cargo nextest run --workspace --no-fail-fast -E "${{ steps.plan.outputs.filterset }}"
  test-windows:
    name: Test Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: plan
        name: Plan
        run: |
          filterset="$(cargo xtask test-plan --release)"
          echo "filterset=${filterset}" >> "$GITHUB_OUTPUT"
          if [ -n "${filterset}" ]; then
            echo "Testing: ${filterset}"
          else
            echo "No Rust crates affected."
          fi

      - name: Run release tests
        if: steps.plan.outputs.filterset != ''
        run: cargo nextest run --workspace --no-fail-fast -E "${{ steps.plan.outputs.filterset }}"
  test-linux:
    name: Test Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system deps (Linux)
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - id: plan
        name: Plan
        run: |
          filterset="$(cargo xtask test-plan --release)"
          echo "filterset=${filterset}" >> "$GITHUB_OUTPUT"
          if [ -n "${filterset}" ]; then
            echo "Testing: ${filterset}"
          else
            echo "No Rust crates affected."
          fi

      - name: Run release tests
        if: steps.plan.outputs.filterset != ''
        run: cargo nextest run --workspace --no-fail-fast -E "${{ steps.plan.outputs.filterset }}"
  macos:
    needs:
      - test-macos
      - test-windows
      - test-linux
    if: github.event_name == 'push' || contains(fromJson('["All","Desktop","macOS"]'), inputs.platforms)
    name: Build macOS desktop
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Decrypt Apple signing secrets
        run: |-
          secrets=$(sops -d .secrets/apple.sops.yaml)

          APPLE_API_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          echo "${secrets}" | yq '.developer-id.key-prv' > "${APPLE_API_KEY_PATH}"
          echo "APPLE_API_KEY_PATH=${APPLE_API_KEY_PATH}" >> "$GITHUB_ENV"

          APPLE_API_ISSUER=$(echo "${secrets}" | yq '.developer-id.issuer-id')
          echo "::add-mask::${APPLE_API_ISSUER}"
          echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}" >> "$GITHUB_ENV"

          APPLE_API_KEY=$(echo "${secrets}" | yq '.developer-id.key-id')
          echo "::add-mask::${APPLE_API_KEY}"
          echo "APPLE_API_KEY=${APPLE_API_KEY}" >> "$GITHUB_ENV"

          APPLE_CERTIFICATE=$(echo "${secrets}" | yq '.developer-id.certificate')
          echo "::add-mask::${APPLE_CERTIFICATE}"
          echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE}" >> "$GITHUB_ENV"

          APPLE_CERTIFICATE_PASSWORD=$(echo "${secrets}" | yq '.developer-id.password')
          echo "::add-mask::${APPLE_CERTIFICATE_PASSWORD}"
          echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}" >> "$GITHUB_ENV"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Decrypt updater signing key
        run: |-
          secrets=$(sops -d .secrets/updater.sops.yaml)

          TAURI_SIGNING_PRIVATE_KEY=$(echo "${secrets}" | yq '.private-key')
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::${line}"
          done <<< "${TAURI_SIGNING_PRIVATE_KEY}"
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<SECRET_EOF'
            echo "${TAURI_SIGNING_PRIVATE_KEY}"
            echo 'SECRET_EOF'
          } >> "$GITHUB_ENV"

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(echo "${secrets}" | yq '.password')
          echo "::add-mask::${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" >> "$GITHUB_ENV"
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Generate icons
        run: "just icons::preview"
        working-directory: waypoints/src-tauri
      - name: Build
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: ./waypoints
          args: "--features preview --config src-tauri/Tauri.flavor=preview.toml"
          tagName: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          releaseName: Waypoints ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          prerelease: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-macos-preview
          path: |-
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: error
  linux:
    needs:
      - test-macos
      - test-windows
      - test-linux
    if: github.event_name == 'push' || contains(fromJson('["All","Desktop","Linux"]'), inputs.platforms)
    name: Build Linux desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - name: Install system deps (Linux)
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Decrypt updater signing key
        run: |-
          secrets=$(sops -d .secrets/updater.sops.yaml)

          TAURI_SIGNING_PRIVATE_KEY=$(echo "${secrets}" | yq '.private-key')
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::${line}"
          done <<< "${TAURI_SIGNING_PRIVATE_KEY}"
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<SECRET_EOF'
            echo "${TAURI_SIGNING_PRIVATE_KEY}"
            echo 'SECRET_EOF'
          } >> "$GITHUB_ENV"

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(echo "${secrets}" | yq '.password')
          echo "::add-mask::${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" >> "$GITHUB_ENV"
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Generate icons
        run: "just icons::preview"
        working-directory: waypoints/src-tauri
      - name: Build
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: ./waypoints
          args: "--features preview --config src-tauri/Tauri.flavor=preview.toml"
          tagName: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          releaseName: Waypoints ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          prerelease: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-linux-preview
          path: |-
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.tar.gz
            target/release/bundle/appimage/*.AppImage.tar.gz.sig
            target/release/bundle/deb/*.deb
          if-no-files-found: error
  windows:
    needs:
      - test-macos
      - test-windows
      - test-linux
    if: github.event_name == 'push' || contains(fromJson('["All","Desktop","Windows"]'), inputs.platforms)
    name: Build Windows desktop
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Decrypt updater signing key
        run: |-
          secrets=$(sops -d .secrets/updater.sops.yaml)

          TAURI_SIGNING_PRIVATE_KEY=$(echo "${secrets}" | yq '.private-key')
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::${line}"
          done <<< "${TAURI_SIGNING_PRIVATE_KEY}"
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<SECRET_EOF'
            echo "${TAURI_SIGNING_PRIVATE_KEY}"
            echo 'SECRET_EOF'
          } >> "$GITHUB_ENV"

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(echo "${secrets}" | yq '.password')
          echo "::add-mask::${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" >> "$GITHUB_ENV"
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Generate icons
        run: "just icons::preview"
        working-directory: waypoints/src-tauri
      - name: Build
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: ./waypoints
          args: "--features preview --config src-tauri/Tauri.flavor=preview.toml"
          tagName: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          releaseName: Waypoints ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          prerelease: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-windows-preview
          path: |-
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.nsis.zip
            target/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: error
  android:
    needs:
      - test-macos
      - test-windows
      - test-linux
    if: github.event_name == 'push' || contains(fromJson('["All","Android"]'), inputs.platforms)
    name: Build Android
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Decrypt Android signing secrets
        run: |-
          secrets=$(sops -d .secrets/android.sops.yaml)

          keystore_path="${RUNNER_TEMP}/waypoints.jks"
          echo "${secrets}" | yq '.keystore' | base64 -d > "${keystore_path}"

          key_alias=$(echo "${secrets}" | yq '.key-alias')
          echo "::add-mask::${key_alias}"

          password=$(echo "${secrets}" | yq '.password')
          echo "::add-mask::${password}"

          cat > waypoints/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=${keystore_path}
          keyAlias=${key_alias}
          password=${password}
          EOF
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Generate icons
        run: "just icons::preview"
        working-directory: waypoints/src-tauri
      - name: Build Android
        run: tauri android build --features preview --target aarch64 x86_64 --apk --aab
        env:
          WAYPOINTS_FLAVOR: preview
          WAYPOINTS_BUILD: "1"
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        working-directory: waypoints
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-android-preview
          path: |-
            waypoints/src-tauri/gen/android/app/build/outputs/apk/*Release/*.apk
            waypoints/src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab
          if-no-files-found: error
      - name: Upload to GitHub Release
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          prerelease: "true"
          files: |-
            waypoints/src-tauri/gen/android/app/build/outputs/apk/*Release/*.apk
            waypoints/src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab
      - name: Decrypt Play Store credentials
        run: |-
          secrets=$(sops -d .secrets/android.sops.yaml)

          GOOGLE_PLAY_JSON_KEY_PATH="${RUNNER_TEMP}/play-store-key.json"
          echo "${secrets}" | yq '.play-store.json-key' | base64 -d > "${GOOGLE_PLAY_JSON_KEY_PATH}"

          echo "GOOGLE_PLAY_JSON_KEY_PATH=${GOOGLE_PLAY_JSON_KEY_PATH}" >> "$GITHUB_ENV"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Publish to Play Store
        run: fastlane android preview
  ios:
    needs:
      - test-macos
      - test-windows
      - test-linux
    if: github.event_name == 'push' || contains(fromJson('["All","iOS"]'), inputs.platforms)
    name: Build iOS
    runs-on: macos-15
    permissions:
      contents: write
    env:
      MISE_ENV: ios
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Decrypt Apple signing secrets
        run: |-
          secrets=$(sops -d .secrets/apple.sops.yaml)

          cert_path="${RUNNER_TEMP}/distribution.p12"
          echo "${secrets}" | yq '.distribution.certificate' | base64 -d > "${cert_path}"

          cert_password=$(echo "${secrets}" | yq '.distribution.password')
          echo "::add-mask::${cert_password}"

          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::${keychain_password}"

          keychain_path="${RUNNER_TEMP}/build.keychain-db"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" -P "${cert_password}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain

          profile_tmp="${RUNNER_TEMP}/waypoints.mobileprovision"
          echo "${secrets}" | yq '.distribution.profile' | base64 -d > "${profile_tmp}"

          # A profile must be named by its UUID for Xcode to find it
          profile_path="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "${profile_path}"
          profile_uuid=$(security cms -D -i "${profile_tmp}" | plutil -extract UUID raw -)
          profile_name=$(security cms -D -i "${profile_tmp}" | plutil -extract Name raw -)
          cp "${profile_tmp}" "${profile_path}/${profile_uuid}.mobileprovision"
          echo "Installed profile: ${profile_name} (${profile_uuid})"

          ASC_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          echo "${secrets}" | yq '.developer-id.key-prv' > "${ASC_KEY_PATH}"
          echo "ASC_KEY_PATH=${ASC_KEY_PATH}" >> "$GITHUB_ENV"

          ASC_KEY_ID=$(echo "${secrets}" | yq '.developer-id.key-id')
          echo "::add-mask::${ASC_KEY_ID}"
          echo "ASC_KEY_ID=${ASC_KEY_ID}" >> "$GITHUB_ENV"

          ASC_ISSUER_ID=$(echo "${secrets}" | yq '.developer-id.issuer-id')
          echo "::add-mask::${ASC_ISSUER_ID}"
          echo "ASC_ISSUER_ID=${ASC_ISSUER_ID}" >> "$GITHUB_ENV"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Generate icons
        run: "just icons::preview"
        working-directory: waypoints/src-tauri
      - name: Regenerate Xcode project
        run: |-
          mkdir -p Externals/arm64 assets
          xcodegen generate
        working-directory: waypoints/src-tauri/gen/apple
      - name: Build iOS
        run: tauri ios build --features preview --export-method app-store-connect
        working-directory: waypoints
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-ios-preview
          path: waypoints/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
      - name: Upload to GitHub Release
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          prerelease: "true"
          files: waypoints/src-tauri/gen/apple/build/**/*.ipa
      - name: Publish to TestFlight
        run: fastlane ios preview
