        env:
          SECRETSPEC_REASON: fastlane submits the iOS build to its store with the iOS release scope
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: write-manifest
        name: Write the channel manifest
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        run: devenv shell -- cargo xtask release-manifest --tag "${TAG}"
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          SECRETSPEC_REASON: release-manifest derives a short-lived, channel-scoped store credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CARGO_BUILD_RUSTC_WRAPPER: sccache
