# Generated from xtask::workflows::release
# Rebuild with `cargo xtask generate workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: Release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  push:
    tags:
      - v*
  workflow_call:
    inputs:
      tag:
        description: The existing tag to publish; a dry run left blank describes the day's nightly
        type: string
        default: ""
      dry_run:
        description: "Rehearse: build as asked, write only to the run's artifacts, publish nothing"
        type: boolean
        default: "true"
      build:
        description: Run the test and build stages; off, the run only guards and reports
        type: boolean
        default: "true"
      platforms:
        description: Platforms to build
        type: string
        default: All
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish; a dry run left blank describes the day's nightly
        type: string
        default: ""
      dry_run:
        description: "Rehearse: build as asked, write only to the run's artifacts, publish nothing"
        type: boolean
        default: "true"
      build:
        description: Run the test and build stages; off, the run only guards and reports
        type: boolean
        default: "true"
      platforms:
        description: Platforms to build
        type: choice
        default: All
        options:
          - All
          - Desktop
          - macOS
          - Linux
          - Windows
          - Mobile
          - Android
          - iOS
permissions: {}
jobs:
  guard:
    name: Guard the run
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      dry_run: ${{ steps.rehearsal.outputs.dry_run }}
    steps:
      - id: rehearsal
        name: Read the rehearsal flag
        run: echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
        shell: bash
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      - id: reject-untagged-run
        name: Refuse a real run without a tag
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.tag == ''
        run: echo '::error::A real run names the tag it publishes. Dispatch again with `tag`, or as a dry run.' && exit 1
        shell: bash
      - id: reject-contradiction
        name: Refuse a tag with a platforms subset
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.tag != '' && inputs.platforms != 'All'
        run: echo '::error::A release tag cannot be combined with a platforms subset — a subset can never satisfy every required target, so the run would build without ever publishing. Dispatch again with platforms left at All, or as a dry run.' && exit 1
        shell: bash
      - id: reject-no-build
        name: Refuse no build without a dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.build && !inputs.dry_run
        run: echo '::error::A run that does not build can only be a dry run — a tag with no artifacts behind it must not be published. Dispatch again with `dry_run`, or with `build`.' && exit 1
        shell: bash
  build:
    needs:
      - guard
    if: github.event_name != 'workflow_dispatch' || inputs.build
    name: Build
    permissions:
      contents: write
    uses: $/.github/workflows/build-distributables.yaml
    secrets: inherit # zizmor: ignore[secrets-inherit] the vault credential the builds resolve is an environment secret, which reaches a called workflow only by inheritance and the called job's own environment
    with:
      ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.sha }}
      platforms: ${{ inputs.platforms || 'All' }}
  create-release:
    needs:
      - build
      - guard
    name: Draft the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      MISE_ENV: xtask
    steps:
      - id: checkout
        name: Checkout
        if: needs.build.outputs.tag != '' && needs.guard.outputs.dry_run != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.sha }}
          fetch-depth: "0"
          fetch-tags: "true"
      - id: setup-mise
        name: Set up mise
        if: needs.build.outputs.tag != '' && needs.guard.outputs.dry_run != 'true'
        uses: $/.github/actions/setup-mise
        with:
          mise-version: 2026.10.3
      - id: gen-release-notes
        name: Generate release notes
        if: needs.build.outputs.tag != '' && needs.guard.outputs.dry_run != 'true'
        run: git-cliff --latest --output "${RUNNER_TEMP}/notes.md"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: draft-release
        name: Create the draft
        if: needs.build.outputs.tag != '' && needs.guard.outputs.dry_run != 'true'
        run: |-
          gh release view "${TAG}" >/dev/null 2>&1 \
          || gh release create "${TAG}" --draft --verify-tag --notes-file "${RUNNER_TEMP}/notes.md" ${PRERELEASE}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.channel != 'stable' && '--prerelease' || '' }}
  publish:
    needs:
      - build
      - guard
      - create-release
    if: (needs.build.outputs.macos == 'macos' && needs.build.outputs.windows == 'windows' && needs.build.outputs.linux == 'linux' && needs.build.outputs.ios == 'ios' && needs.build.outputs.android == 'android') && (needs.build.outputs.tag != '')
    name: Publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: App Release
    outputs:
      submitted: ${{ steps.mark-submitted.outputs.submitted }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.sha }}
          fetch-depth: "0"
          fetch-tags: "true"
      - id: setup-nix
        name: Set up Nix
        uses: $/.github/actions/setup-nix
      - id: cache-restore-cargo-registry
        name: Restore cargo-registry
        run: devenv shell -- xcache restore "${CACHE_KEY}" "${HOME}/.cargo/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: restoring the cargo-registry snapshot from the ci-cache bucket; the store client alone holds the credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: sccache-start
        name: Start the compiler cache
        run: devenv shell -- secretspec run --profile ci --provider op --scope cache -- sccache --start-server || echo '::warning::sccache server failed to start; this build compiles without the remote cache'
        shell: bash
        env:
          SECRETSPEC_REASON: the compiler cache server reads and writes the ci-cache bucket for the length of the job; it alone holds the credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCCACHE_BUCKET: ci-cache
          SCCACHE_S3_KEY_PREFIX: sccache/
          SCCACHE_REGION: auto
          SCCACHE_IDLE_TIMEOUT: "0"
      - id: build-xtask
        name: Build xtask
        run: devenv shell -- cargo build --package xtask
        shell: bash
        env:
          SECRETSPEC_REASON: compiles xtask; no secret values are read
          CARGO_BUILD_RUSTC_WRAPPER: sccache
      - id: sccache-stats
        name: Report the compiler cache
        if: always()
        run: |-
          devenv shell -- sccache --show-stats
          devenv shell -- sccache --stop-server
        shell: bash
      - id: cache-save-cargo-registry
        name: Save cargo-registry
        if: "!cancelled() && steps.cache-restore-cargo-registry.outputs.hit != 'true'"
        run: devenv shell -- xcache save "${CACHE_KEY}" "${HOME}/.cargo/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: saving the cargo-registry snapshot to the ci-cache bucket; the store client alone holds the credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: download-staged
        name: Download the staged release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: waypoints-*-${{ needs.build.outputs.channel }}
          merge-multiple: "true"
          path: release
      - id: prepare-listing
        name: Prepare the store listings
        run: devenv shell -- xfastlane prepare "${FLAVOR}"
        shell: bash
        env:
          FLAVOR: ${{ needs.build.outputs.flavor }}
          SECRETSPEC_REASON: xfastlane prepare renders store assets; no secret values are read
      - id: upload-to-store
        name: Upload the distributables
        if: needs.guard.outputs.dry_run != 'true'
        run: devenv shell -- cargo ci-task release distributables upload --from release --tag "${TAG}"
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SECRETSPEC_REASON: release distributables upload derives a short-lived, channel-scoped store credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CARGO_BUILD_RUSTC_WRAPPER: sccache
      - id: publish-release
        name: Publish the release
        if: needs.guard.outputs.dry_run != 'true'
        run: gh release edit "${TAG}" --draft=false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
      - id: mark-submitted
        name: Mark the point of no return
        if: needs.guard.outputs.dry_run != 'true'
        run: echo "submitted=true" >> "$GITHUB_OUTPUT"
        shell: bash
      - id: submit-android
        name: Submit to the Play Store
        if: needs.guard.outputs.dry_run != 'true'
        run: devenv shell -- secretspec run --profile release --provider op --scope android -- xfastlane publish android "${FLAVOR}" --from release
        shell: bash
        env:
          SECRETSPEC_REASON: fastlane submits the Android build to its store with the Android release scope
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          FLAVOR: ${{ needs.build.outputs.flavor }}
      - id: submit-ios
        name: Submit to the App Store
        if: needs.guard.outputs.dry_run != 'true'
        run: devenv shell -- secretspec run --profile release --provider op --scope ios -- xfastlane publish ios "${FLAVOR}" --from release
        shell: bash
        env:
          SECRETSPEC_REASON: fastlane submits the iOS build to its store with the iOS release scope
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          FLAVOR: ${{ needs.build.outputs.flavor }}
      - id: write-manifest
        name: Commit the channel manifest
        if: needs.build.outputs.tag != '' && needs.guard.outputs.dry_run != 'true'
        run: devenv shell -- cargo ci-task release distributables commit --tag "${TAG}"
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SECRETSPEC_REASON: release distributables commit derives a short-lived, channel-scoped store credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CARGO_BUILD_RUSTC_WRAPPER: sccache
      - id: dry-notes
        name: Render the release notes (dry run)
        if: needs.guard.outputs.dry_run == 'true'
        run: |-
          mkdir -p "${RUNNER_TEMP}/dry-run"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            devenv shell -- git-cliff --latest --output "${RUNNER_TEMP}/dry-run/notes.md"
          else
            devenv shell -- git-cliff --unreleased --tag "${TAG}" --output "${RUNNER_TEMP}/dry-run/notes.md"
          fi
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRETSPEC_REASON: git-cliff renders the notes a dry run would have published; no secret values are read
      - id: dry-manifest
        name: Render the channel manifest (dry run)
        if: needs.guard.outputs.dry_run == 'true'
        run: devenv shell -- cargo ci-task release distributables commit --tag "${TAG}" --dry-run --into "${RUNNER_TEMP}/dry-run"
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SECRETSPEC_REASON: release distributables commit renders the manifest a dry run would have written; no secret values are read
          CARGO_BUILD_RUSTC_WRAPPER: sccache
      - id: dry-index
        name: Render the index entry (dry run)
        if: needs.guard.outputs.dry_run == 'true'
        run: devenv shell -- cargo ci-task release record --tag "${TAG}" --rev "${REV}" --dry-run --into "${RUNNER_TEMP}/dry-run"
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REV: ${{ github.sha }}
          SECRETSPEC_REASON: release record renders the entry a dry run would have recorded; no secret values are read
          CARGO_BUILD_RUSTC_WRAPPER: sccache
      - id: upload-dry-run
        name: Upload the dry run
        if: needs.guard.outputs.dry_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dry-run-${{ needs.build.outputs.channel }}
          path: ${{ runner.temp }}/dry-run
          if-no-files-found: error
          retention-days: "7"
  record:
    needs:
      - publish
      - guard
    if: needs.guard.outputs.dry_run != 'true'
    name: Record the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: CI
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          ref: main
          fetch-tags: "true"
      - id: setup-nix
        name: Set up Nix
        uses: $/.github/actions/setup-nix
      - id: cache-restore-cargo-registry
        name: Restore cargo-registry
        run: devenv shell -- xcache restore "${CACHE_KEY}" "${HOME}/.cargo/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: restoring the cargo-registry snapshot from the ci-cache bucket; the store client alone holds the credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: sccache-start
        name: Start the compiler cache
        run: devenv shell -- secretspec run --profile ci --provider op --scope cache -- sccache --start-server || echo '::warning::sccache server failed to start; this build compiles without the remote cache'
        shell: bash
        env:
          SECRETSPEC_REASON: the compiler cache server reads and writes the ci-cache bucket for the length of the job; it alone holds the credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCCACHE_BUCKET: ci-cache
          SCCACHE_S3_KEY_PREFIX: sccache/
          SCCACHE_REGION: auto
          SCCACHE_IDLE_TIMEOUT: "0"
      - id: record
        name: cargo ci-task release record
        run: devenv shell -- cargo ci-task release record --tag "$TAG"
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SECRETSPEC_REASON: release record records a published tag in nix/releases; no secret values are read
          CARGO_BUILD_RUSTC_WRAPPER: sccache
      - id: sccache-stats
        name: Report the compiler cache
        if: always()
        run: |-
          devenv shell -- sccache --show-stats
          devenv shell -- sccache --stop-server
        shell: bash
      - id: cache-save-cargo-registry
        name: Save cargo-registry
        if: "!cancelled() && steps.cache-restore-cargo-registry.outputs.hit != 'true'"
        run: devenv shell -- xcache save "${CACHE_KEY}" "${HOME}/.cargo/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: saving the cargo-registry snapshot to the ci-cache bucket; the store client alone holds the credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - name: Resolve the botswain secrets
        if: steps.record.outputs.title != ''
        run: devenv shell -- secretspec export --profile ci --provider op --scope botswain --format gha
        shell: bash
        env:
          SECRETSPEC_REASON: CI resolves the ci profile's botswain scope to authenticate as the App it names
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: app-token
        name: Mint a wp-botswain token
        if: steps.record.outputs.title != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ env.WP_BOTSWAIN_APP_ID }}
          private-key: ${{ env.WP_BOTSWAIN_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: index-pull-request
        name: Open a pull request
        if: steps.record.outputs.title != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.record.outputs.head }}
          delete-branch: "true"
          sign-commits: "true"
          title: ${{ steps.record.outputs.title }}
          body: Written by `cargo xtask release record`; merges when its checks pass.
          commit-message: ${{ steps.record.outputs.title }}
          add-paths: ${{ steps.record.outputs.paths }}
      - name: cargo ci-task release merge
        if: steps.index-pull-request.outputs.pull-request-number != ''
        run: devenv shell -- cargo ci-task release merge --pull-request "${PULL_REQUEST}" --no-wait
        shell: bash
        env:
          SECRETSPEC_REASON: release merge drives a pull request through the GitHub API; no secret values are read
          PULL_REQUEST: ${{ steps.index-pull-request.outputs.pull-request-number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
  withdraw-release:
    needs:
      - build
      - guard
      - create-release
      - publish
    if: ((github.event_name == 'push' && github.ref_name || inputs.tag) != '') && (needs.guard.outputs.dry_run != 'true') && (failure() || !(needs.build.outputs.macos == 'macos' && needs.build.outputs.windows == 'windows' && needs.build.outputs.linux == 'linux' && needs.build.outputs.ios == 'ios' && needs.build.outputs.android == 'android')) && needs.publish.outputs.submitted != 'true'
    name: Withdraw the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: App Release
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
          fetch-tags: "true"
      - id: setup-nix
        name: Set up Nix
        uses: $/.github/actions/setup-nix
      - id: discard-release
        name: Discard the drafted release
        run: gh release delete "${TAG}" --yes || true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - id: withdraw-from-store
        name: Withdraw the distributables
        run: devenv shell -- cargo ci-task release distributables withdraw --tag "${TAG}"
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          SECRETSPEC_REASON: release distributables withdraw derives a short-lived, channel-scoped store credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: delete-tag
        name: Delete the tag
        if: github.event_name == 'push'
        run: gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - id: undo
        name: cargo ci-task release undo
        if: github.event_name == 'push'
        run: devenv shell -- cargo ci-task release undo --tag "${TAG}" --commit "${COMMIT}"
        shell: bash
        env:
          SECRETSPEC_REASON: release undo drives a pull request through the GitHub API; no secret values are read
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the botswain secrets
        if: github.event_name == 'push'
        run: devenv shell -- secretspec export --profile ci --provider op --scope botswain --format gha
        shell: bash
        env:
          SECRETSPEC_REASON: CI resolves the ci profile's botswain scope to authenticate as the App it names
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: app-token
        name: Mint a wp-botswain token
        if: github.event_name == 'push'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ env.WP_BOTSWAIN_APP_ID }}
          private-key: ${{ env.WP_BOTSWAIN_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: revert-pull-request
        name: Open a pull request
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.undo.outputs.head }}
          delete-branch: "true"
          sign-commits: "true"
          title: ${{ steps.undo.outputs.title }}
          body-path: ${{ steps.undo.outputs.body_path }}
          commit-message: ${{ steps.undo.outputs.title }}
          add-paths: ${{ steps.undo.outputs.paths }}
      - id: merge-revert
        name: cargo ci-task release merge
        if: steps.revert-pull-request.outputs.pull-request-number != ''
        run: devenv shell -- cargo ci-task release merge --pull-request "${PULL_REQUEST}"
        shell: bash
        env:
          SECRETSPEC_REASON: release merge drives a pull request through the GitHub API; no secret values are read
          PULL_REQUEST: ${{ steps.revert-pull-request.outputs.pull-request-number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
concurrency:
  group: release-cycle
  cancel-in-progress: false
