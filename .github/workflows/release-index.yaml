# Generated from xtask::workflows::release_index
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: record a published release in the index
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to record
        required: true
        type: string
      dry_run:
        description: Compute and print the entry without committing it
        type: boolean
        default: "false"
permissions: {}
jobs:
  release-index:
    name: record the release in the index
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: CI
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          ref: main
          fetch-tags: "true"
      - id: free-disk
        name: Free runner disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          android: "true"
          dotnet: "true"
          haskell: "true"
          large-packages: "true"
          docker-images: "true"
          preinstalled-runtimes: "false"
          swap-storage: "false"
      - id: setup-nix
        name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - id: setup-devenv-cachix
        name: Use the devenv binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: devenv
      - id: setup-nix-profile
        name: Install devenv
        run: nix profile install nixpkgs#devenv
        shell: bash
      - id: cache-restore-cargo-registry
        name: Restore cargo-registry
        run: devenv shell -- xcache restore "${CACHE_KEY}" "${HOME}/.cargo/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: restoring the cargo-registry snapshot from the ci-cache bucket; the store client alone holds the credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: sccache-start
        name: Start the compiler cache
        run: devenv shell -- secretspec run --profile ci --provider op --scope cache -- sccache --start-server || echo '::warning::sccache server failed to start; this build compiles without the remote cache'
        shell: bash
        env:
          SECRETSPEC_REASON: the compiler cache server reads and writes the ci-cache bucket for the length of the job; it alone holds the credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCCACHE_BUCKET: ci-cache
          SCCACHE_S3_KEY_PREFIX: sccache/
          SCCACHE_REGION: auto
          SCCACHE_IDLE_TIMEOUT: "0"
      - id: release-index
        name: cargo xtask release-index
        run: devenv shell -- cargo xtask release-index --tag "$TAG" ${{ inputs.dry_run == true && '--dry-run' || '' }}
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          SECRETSPEC_REASON: release-index records a published tag in nix/releases; no secret values are read
          CARGO_BUILD_RUSTC_WRAPPER: sccache
      - id: sccache-stats
        name: Report the compiler cache
        if: always()
        run: |-
          devenv shell -- sccache --show-stats
          devenv shell -- sccache --stop-server
        shell: bash
      - id: cache-save-cargo-registry
        name: Save cargo-registry
        if: "!cancelled() && steps.cache-restore-cargo-registry.outputs.hit != 'true'"
        run: devenv shell -- xcache save "${CACHE_KEY}" "${HOME}/.cargo/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: saving the cargo-registry snapshot to the ci-cache bucket; the store client alone holds the credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - name: Resolve the botswain secrets
        if: steps.release-index.outputs.title != ''
        run: devenv shell -- secretspec export --profile ci --provider op --scope botswain --format gha
        shell: bash
        env:
          SECRETSPEC_REASON: CI resolves the ci profile's botswain scope to authenticate as the App it names
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: app-token
        name: Mint a wp-botswain token
        if: steps.release-index.outputs.title != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ env.WP_BOTSWAIN_APP_ID }}
          private-key: ${{ env.WP_BOTSWAIN_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: index-pull-request
        name: Open a pull request
        if: steps.release-index.outputs.title != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.release-index.outputs.head }}
          delete-branch: "true"
          sign-commits: "true"
          title: ${{ steps.release-index.outputs.title }}
          body: Written by `cargo xtask release-index`; merges when its checks pass.
          commit-message: ${{ steps.release-index.outputs.title }}
          add-paths: ${{ steps.release-index.outputs.paths }}
      - name: cargo xtask release-land auto-merge
        if: steps.index-pull-request.outputs.pull-request-number != ''
        run: devenv shell -- cargo xtask release-land auto-merge --pull-request "${PULL_REQUEST}"
        shell: bash
        env:
          SECRETSPEC_REASON: release-land drives a pull request through the GitHub API; no secret values are read
          PULL_REQUEST: ${{ steps.index-pull-request.outputs.pull-request-number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
concurrency:
  group: release-index
  cancel-in-progress: false
