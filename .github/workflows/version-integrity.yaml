# Generated from xtask::workflows::version_integrity
# Rebuild with `cargo xtask generate workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: check what a pull request claims about versions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - "**"
permissions: {}
jobs:
  version-integrity:
    name: version-integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: xtask
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - id: setup-mise
        name: Set up mise
        uses: $/.github/actions/setup-mise
        with:
          mise-version: 2026.10.3
      - id: version-integrity
        name: cargo ci-task check version-integrity
        run: cargo ci-task check version-integrity
        shell: bash
  semver:
    name: semver
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: xtask
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
          fetch-tags: "true"
      - id: setup-mise
        name: Set up mise
        uses: $/.github/actions/setup-mise
        with:
          mise-version: 2026.10.3
      - id: semver-check
        name: cargo ci-task check semver
        run: cargo ci-task check semver
        shell: bash
concurrency:
  group: version-integrity-${{ github.ref }}
  cancel-in-progress: true
