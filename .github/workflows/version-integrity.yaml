# Generated from xtask::workflows::version_integrity
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: check what a pull request claims about versions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - "**"
permissions: {}
jobs:
  version-integrity:
    name: version-integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: xtask
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.3
          cache: "false"
      - id: version-integrity
        name: cargo xtask version-integrity
        run: cargo xtask version-integrity
        shell: bash
concurrency:
  group: version-integrity-${{ github.ref }}
  cancel-in-progress: true
