name: Build Desktop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      flavor:
        required: true
        type: string
        description: "Build flavor — matches icons recipe and feature flag (preview,
          stable)"
      features:
        required: true
        type: string
        description: "Cargo feature flags to enable"
      config:
        required: false
        type: string
        default: ""
        description: "Tauri config override file (e.g. Tauri.flavor=preview.toml); empty
          for stable"
      tag:
        required: false
        type: string
        default: ""
        description: "Release tag name (e.g. v1.2.3)"
      prerelease:
        required: false
        type: boolean
        default: false
      os-filter:
        required: false
        type: string
        default: "all"
        description: "Which desktop OSes to build (all | macos | linux | windows)"
    secrets:
      SOPS_AGE_KEY:
        required: true
        description: "Age private key for decrypting .secrets/*.sops.yaml"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          mac='{"platform":"macos","runner":"macos-15"}'
          lnx='{"platform":"linux","runner":"ubuntu-22.04"}'
          win='{"platform":"windows","runner":"windows-latest"}'
          case "${{ inputs.os-filter }}" in
            macOS)   m="$mac" ;;
            Linux)   m="$lnx" ;;
            Windows) m="$win" ;;
            *)       m="$mac,$lnx,$win" ;;
          esac
          echo "matrix={\"include\":[$m]}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup mise (bun, just, sops, age, yq)
        uses: jdx/mise-action@v2

      - name: Install JS deps
        run: bun install

      - name: Decrypt Apple signing secrets
        if: matrix.platform == 'macos'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          secrets=$(sops -d .secrets/apple.sops.yaml)
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          echo "${secrets}" | yq '.developer-id.key-prv' > "${key_path}"

          issuer=$(echo "${secrets}" | yq '.developer-id.issuer-id')
          key_id=$(echo "${secrets}" | yq '.developer-id.key-id')
          cert=$(echo "${secrets}" | yq '.developer-id.certificate')
          cert_pw=$(echo "${secrets}" | yq '.developer-id.password')

          echo "::add-mask::${issuer}"
          echo "::add-mask::${key_id}"
          echo "::add-mask::${cert}"
          echo "::add-mask::${cert_pw}"

          echo "APPLE_API_KEY_PATH=${key_path}" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${issuer}" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=${key_id}" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE=${cert}" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=${cert_pw}" >> "$GITHUB_ENV"

      - name: Decrypt updater signing key
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          secrets=$(sops -d .secrets/updater.sops.yaml)
          priv=$(echo "${secrets}" | yq '.private-key')
          priv_pw=$(echo "${secrets}" | yq '.password')

          # Multi-line value: mask each line, since add-mask only matches exact strings
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::${line}"
          done <<< "${priv}"
          echo "::add-mask::${priv_pw}"

          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<UPDATER_EOF'
            echo "${priv}"
            echo 'UPDATER_EOF'
          } >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${priv_pw}" >> "$GITHUB_ENV"

      - name: Generate icons
        run: just icons::${{ inputs.flavor }}
        working-directory: waypoints/src-tauri

      - name: Build
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./waypoints
          args: >-
            --features ${{ inputs.features }} ${{ inputs.config != '' &&
            format('--config src-tauri/{0}', inputs.config) || '' }}
          tagName: ${{ inputs.tag }}
          releaseName: "Waypoints ${{ inputs.tag }}"
          prerelease: ${{ inputs.prerelease }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-${{ matrix.platform }}-${{ inputs.flavor }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.tar.gz.sig
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.tar.gz
            target/release/bundle/appimage/*.AppImage.tar.gz.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.nsis.zip
            target/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: ignore
