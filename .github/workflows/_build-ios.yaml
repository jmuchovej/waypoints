name: Build iOS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      flavor:
        required: true
        type: string
        description: "Build flavor (preview, stable)"
      features:
        required: true
        type: string
        description: "Cargo feature flags to enable"
      tag:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
    secrets:
      SOPS_AGE_KEY:
        required: true
        description: "Age private key for decrypting .secrets/*.sops.yaml"

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup mise (bun, just, sops, age, yq)
        uses: jdx/mise-action@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install JS deps
        run: bun install

      - name: Decrypt Apple signing secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          secrets=$(sops -d .secrets/apple.sops.yaml)

          # Distribution certificate → keychain
          cert_path="${RUNNER_TEMP}/distribution.p12"
          echo "${secrets}" | yq '.distribution.certificate' | base64 -d > "${cert_path}"
          cert_password=$(echo "${secrets}" | yq '.distribution.password')
          keychain_password=$(openssl rand -base64 32)

          echo "::add-mask::${cert_password}"
          echo "::add-mask::${keychain_password}"

          keychain_path="${RUNNER_TEMP}/build.keychain-db"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" -P "${cert_password}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain

          # Provisioning profile
          profile_path="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "${profile_path}"
          echo "${secrets}" | yq '.distribution.profile' | base64 -d > "${profile_path}/waypoints.mobileprovision"

          # App Store Connect API key (for fastlane)
          asc_key_path="${RUNNER_TEMP}/AuthKey.p8"
          echo "${secrets}" | yq '.developer-id.key-prv' > "${asc_key_path}"
          asc_key_id=$(echo "${secrets}" | yq '.developer-id.key-id')
          asc_issuer=$(echo "${secrets}" | yq '.developer-id.issuer-id')

          echo "::add-mask::${asc_key_id}"
          echo "::add-mask::${asc_issuer}"

          echo "ASC_KEY_ID=${asc_key_id}" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=${asc_issuer}" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=${asc_key_path}" >> "$GITHUB_ENV"

      - name: Build iOS
        run: cargo tauri ios build --features ${{ inputs.features }} --export-method
          app-store-connect

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-ios-${{ inputs.flavor }}
          path: waypoints/src-tauri/gen/apple/build/**/*.ipa

      - name: Upload to GitHub Release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: waypoints/src-tauri/gen/apple/build/**/*.ipa

      - name: Setup Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Publish to TestFlight
        run: fastlane ios ${{ inputs.flavor }}
