# Generated from xtask::workflows::distribution
# Rebuild with `cargo xtask generate workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: Distribution
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  pull_request:
    branches:
      - "**"
    paths:
      - distribution/**
      - src-tauri/res/configs/flavors/**
      - tooling/xtask/**
      - .github/workflows/distribution.yaml
  push:
    branches:
      - main
    paths:
      - distribution/**
      - src-tauri/res/configs/flavors/**
      - tooling/xtask/**
      - .github/workflows/distribution.yaml
permissions: {}
jobs:
  dist:
    name: Check the package manifests
    runs-on: macos-26
    permissions:
      contents: read
    env:
      MISE_ENV: devtools
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - id: setup-mise
        name: Set up mise
        uses: $/.github/actions/setup-mise
        with:
          mise-version: 2026.10.3
          rust-cache: "true"
      - id: check-all
        name: just dist::check-all
        run: just dist::check-all
        shell: bash
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true
