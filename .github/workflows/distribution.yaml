# Generated from xtask::workflows::distribution
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: Distribution
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  pull_request:
    branches:
      - "**"
    paths:
      - distribution/**
      - src-tauri/res/configs/flavors/**
      - tooling/xtask/**
      - .github/workflows/distribution.yaml
  push:
    branches:
      - main
    paths:
      - distribution/**
      - src-tauri/res/configs/flavors/**
      - tooling/xtask/**
      - .github/workflows/distribution.yaml
permissions: {}
jobs:
  dist:
    name: Check the package manifests
    runs-on: macos-26
    permissions:
      contents: read
    env:
      MISE_ENV: devtools
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.3
          cache: "false"
      - id: rust-cache # zizmor: ignore[cache-poisoning] written only from main (save-if), restored by test jobs that publish nothing
        name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: check-all
        name: just dist::check-all
        run: just dist::check-all
        shell: bash
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true
