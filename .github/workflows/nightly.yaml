# $schema: https://www.schemastore.org/github-workflow.json
name: Nightly

on:
  schedule:
    # 07:00 UTC daily (~03:00 US Eastern). `schedule` only runs on the default
    # branch, which is what we want a nightly to track.
    - cron: "0 7 * * *"
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+-nightly.[0-9]{8}"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for build-only, no release)"
        required: false
        default: ""
      platforms:
        description: "Platforms to build"
        type: choice
        options:
          - All
          - Desktop
          - macOS
          - Linux
          - Windows
          - Android
        default: All

permissions:
  contents: write

# Never let a scheduled run and a manual/tag run build concurrently.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      should_build: ${{ steps.plan.outputs.should-build }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        uses: ./.github/actions/nightly-plan
        with:
          dispatch-tag: ${{ inputs.tag }}

  desktop:
    needs: prepare
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       contains(fromJson('["All","Desktop","macOS","Linux","Windows"]'), inputs.platforms))
    uses: ./.github/workflows/_build-desktop.yaml
    with:
      flavor: nightly
      features: nightly
      config: Tauri.flavor=nightly.toml
      tag: ${{ needs.prepare.outputs.tag }}
      prerelease: true
      os-filter: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'All' }}
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  android:
    needs: prepare
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       contains(fromJson('["All","Android"]'), inputs.platforms))
    uses: ./.github/workflows/_build-android.yaml
    with:
      flavor: nightly
      features: nightly
      tag: ${{ needs.prepare.outputs.tag }}
      prerelease: true
      version-code: ${{ github.run_number }}
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
