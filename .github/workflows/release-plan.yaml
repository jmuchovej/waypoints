# Generated from xtask::workflows::release_plan
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: mint the refs for a release-cycle transition
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SECRETSPEC_PROVIDER: sops
on:
  workflow_dispatch:
    inputs:
      transition:
        description: Which release-cycle transition to perform
        required: true
        type: choice
        options:
          - cut
          - advance
          - promote
          - patch
permissions: {}
jobs:
  release-plan:
    name: plan the transition
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MISE_ENV: xtask
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-tags: "true"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.8.6"
          cache: "false"
      - id: release-plan
        name: cargo xtask release-plan
        run: cargo xtask release-plan ${{ inputs.transition }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
concurrency:
  group: release-plan
  cancel-in-progress: false
