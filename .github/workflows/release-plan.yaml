# Generated from xtask::workflows::release_plan
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: mint the refs for a release-cycle transition
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  workflow_dispatch:
    inputs:
      transition:
        description: Which release-cycle transition to perform
        required: true
        type: choice
        options:
          - cut
          - advance
          - promote
          - patch
permissions: {}
jobs:
  release-plan:
    name: plan the transition
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: CI
    env:
      MISE_ENV: xtask
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
          fetch-tags: "true"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.3
          cache: "false"
      - id: cache-restore-cargo-registry
        name: Restore cargo-registry
        run: xcache restore "${CACHE_KEY}" "${CARGO_HOME}/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: restoring the cargo-registry snapshot from the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: sccache-start
        name: Start the compiler cache
        run: secretspec run --profile ci --scope cache -- sccache --start-server || echo '::warning::sccache server failed to start; this build compiles without the remote cache'
        shell: bash
        env:
          SECRETSPEC_REASON: the compiler cache server reads and writes the ci-cache bucket for the length of the job; it alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCCACHE_BUCKET: ci-cache
          SCCACHE_S3_KEY_PREFIX: sccache/
          SCCACHE_REGION: auto
          SCCACHE_IDLE_TIMEOUT: "0"
      - name: Resolve the botswain secrets
        run: secretspec export --profile ci --scope botswain --format gha
        shell: bash
        env:
          SECRETSPEC_REASON: CI resolves the ci profile's botswain scope to authenticate as the App it names
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: app-token
        name: Mint a wp-botswain token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ env.WP_BOTSWAIN_APP_ID }}
          private-key: ${{ env.WP_BOTSWAIN_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release-plan
        name: cargo xtask release-plan
        run: cargo xtask release-plan ${{ inputs.transition }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_BUILD_RUSTC_WRAPPER: sccache
      - id: sccache-stats
        name: Report the compiler cache
        if: always()
        run: |-
          sccache --show-stats
          sccache --stop-server
        shell: bash
      - id: cache-save-cargo-registry
        name: Save cargo-registry
        if: "!cancelled() && steps.cache-restore-cargo-registry.outputs.hit != 'true'"
        run: xcache save "${CACHE_KEY}" "${CARGO_HOME}/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: saving the cargo-registry snapshot to the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: series-pull-request
        name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.release-plan.outputs.head }}
          delete-branch: "true"
          sign-commits: "true"
          title: ${{ steps.release-plan.outputs.title }}
          body: Written by `cargo xtask release-plan`; merges when its checks pass.
          commit-message: ${{ steps.release-plan.outputs.title }}
          add-paths: ${{ steps.release-plan.outputs.paths }}
      - name: cargo xtask release-land auto-merge
        if: steps.series-pull-request.outputs.pull-request-number != ''
        run: cargo xtask release-land auto-merge --pull-request "${PULL_REQUEST}"
        shell: bash
        env:
          PULL_REQUEST: ${{ steps.series-pull-request.outputs.pull-request-number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - id: bump-main
        name: cargo xtask release-land bump-main
        if: steps.release-plan.outputs.next_main_version != ''
        run: cargo xtask release-land bump-main --version "${VERSION}"
        shell: bash
        env:
          VERSION: ${{ steps.release-plan.outputs.next_main_version }}
      - id: main-pull-request
        name: Open a pull request
        if: steps.release-plan.outputs.next_main_version != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.bump-main.outputs.head }}
          delete-branch: "true"
          sign-commits: "true"
          title: ${{ steps.bump-main.outputs.title }}
          body: Written by `cargo xtask release-plan`; merges when its checks pass.
          commit-message: ${{ steps.bump-main.outputs.title }}
          add-paths: ${{ steps.bump-main.outputs.paths }}
      - name: cargo xtask release-land auto-merge
        if: steps.main-pull-request.outputs.pull-request-number != ''
        run: cargo xtask release-land auto-merge --pull-request "${PULL_REQUEST}"
        shell: bash
        env:
          PULL_REQUEST: ${{ steps.main-pull-request.outputs.pull-request-number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - id: wait-for-merge
        name: cargo xtask release-land wait
        run: cargo xtask release-land wait --pull-request "${PULL_REQUEST}"
        shell: bash
        env:
          PULL_REQUEST: ${{ steps.series-pull-request.outputs.pull-request-number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag-token
        name: Mint a wp-botswain token for the tag
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ env.WP_BOTSWAIN_APP_ID }}
          private-key: ${{ env.WP_BOTSWAIN_PRIVATE_KEY }}
          permission-contents: write
      - name: cargo xtask release-land tag
        run: cargo xtask release-land tag --tag "${TAG}" --commit "${COMMIT}"
        shell: bash
        env:
          TAG: ${{ steps.release-plan.outputs.tag }}
          COMMIT: ${{ steps.wait-for-merge.outputs.merge_commit }}
          GH_TOKEN: ${{ steps.tag-token.outputs.token }}
concurrency:
  group: release-plan
  cancel-in-progress: false
