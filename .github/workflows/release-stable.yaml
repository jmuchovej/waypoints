        shell: bash
        env:
          CACHE_KEY: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          SECRETSPEC_REASON: saving the pnpm-store snapshot to the ci-cache bucket; the store client alone holds the credential
