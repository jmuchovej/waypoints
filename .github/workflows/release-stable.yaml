          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: sccache-start
        name: Start the compiler cache
        run: "secretspec run --profile ci --scope cache -- sccache --start-server || echo '::warning::sccache server failed to start; this build compiles without the remote cache'"
        shell: bash
        env:
          SECRETSPEC_REASON: the compiler cache server reads and writes the ci-cache bucket for the length of the job; it alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCCACHE_BUCKET: ci-cache
          SCCACHE_S3_KEY_PREFIX: sccache/
          SCCACHE_REGION: auto
          SCCACHE_IDLE_TIMEOUT: "0"
      - id: build-recipe
        name: Build Android
        run: "just tauri::build android stable"
        shell: bash
        env:
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CARGO_BUILD_RUSTC_WRAPPER: sccache
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16138531
      - id: sccache-stats
        name: Report the compiler cache
        if: always()
        run: |-
          sccache --show-stats
          sccache --stop-server
        shell: bash
      - id: cache-save-cargo-registry
        name: Save cargo-registry
        if: "!cancelled() && steps.cache-restore-cargo-registry.outputs.hit != 'true'"
        run: |-
          path="${CARGO_HOME:-$HOME/.cargo}/registry"
          if [ ! -d "${path}" ]; then
            echo "nothing at ${path} to save"
            exit 0
          fi
          archive="${RUNNER_TEMP}/${CACHE_KEY}.tar.gz"
          remote=":s3,provider=Cloudflare,env_auth=true:ci-cache/dirs/${CACHE_KEY}.tar.gz"
          if (cd "$(dirname "${path}")" && tar -czf - "$(basename "${path}")") > "${archive}" \
            && secretspec run --profile ci --scope cache -- bash -c 'RCLONE_S3_ENDPOINT="$SCCACHE_ENDPOINT" exec rclone copyto --s3-no-check-bucket "$@"' rclone --ignore-existing "${archive}" "${remote}"; then
            echo "saved ${CACHE_KEY}"
          else
            echo "::warning::could not save ${CACHE_KEY}"
          fi
          rm -f "${archive}"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: saving the cargo-registry snapshot to the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: cache-save-gradle
        name: Save gradle
        if: "!cancelled() && steps.cache-restore-gradle.outputs.hit != 'true'"
        run: |-
          path="${HOME}/.gradle/caches/modules-2"
          if [ ! -d "${path}" ]; then
            echo "nothing at ${path} to save"
            exit 0
          fi
          archive="${RUNNER_TEMP}/${CACHE_KEY}.tar.gz"
          remote=":s3,provider=Cloudflare,env_auth=true:ci-cache/dirs/${CACHE_KEY}.tar.gz"
          if (cd "$(dirname "${path}")" && tar -czf - "$(basename "${path}")") > "${archive}" \
            && secretspec run --profile ci --scope cache -- bash -c 'RCLONE_S3_ENDPOINT="$SCCACHE_ENDPOINT" exec rclone copyto --s3-no-check-bucket "$@"' rclone --ignore-existing "${archive}" "${remote}"; then
            echo "saved ${CACHE_KEY}"
          else
            echo "::warning::could not save ${CACHE_KEY}"
          fi
          rm -f "${archive}"
        shell: bash
        env:
          CACHE_KEY: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/gen/android/gradle/verification-metadata.xml', 'src-tauri/gen/android/gradle/libs.versions.toml', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/gen/android/settings.gradle', 'src-tauri/gen/android/build.gradle.kts', 'src-tauri/gen/android/app/build.gradle.kts') }}
          SECRETSPEC_REASON: saving the gradle snapshot to the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: cache-save-android-ndk
        name: Save android-ndk
        if: "!cancelled() && steps.cache-restore-android-ndk.outputs.hit != 'true'"
        run: |-
          path="${ANDROID_HOME}/ndk/30.0.16138531"
          if [ ! -d "${path}" ]; then
            echo "nothing at ${path} to save"
            exit 0
          fi
          archive="${RUNNER_TEMP}/${CACHE_KEY}.tar.gz"
          remote=":s3,provider=Cloudflare,env_auth=true:ci-cache/dirs/${CACHE_KEY}.tar.gz"
          if (cd "$(dirname "${path}")" && tar -czf - "$(basename "${path}")") > "${archive}" \
            && secretspec run --profile ci --scope cache -- bash -c 'RCLONE_S3_ENDPOINT="$SCCACHE_ENDPOINT" exec rclone copyto --s3-no-check-bucket "$@"' rclone --ignore-existing "${archive}" "${remote}"; then
            echo "saved ${CACHE_KEY}"
          else
            echo "::warning::could not save ${CACHE_KEY}"
          fi
          rm -f "${archive}"
        shell: bash
        env:
          CACHE_KEY: android-ndk-${{ runner.os }}-${{ runner.arch }}-30.0.16138531
          SECRETSPEC_REASON: saving the android-ndk snapshot to the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: upload-artifacts
        name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waypoints-android-stable
          path: |-
            src-tauri/gen/android/app/build/outputs/apk/*Release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab
          if-no-files-found: error
      - id: upload-release
        name: Upload to GitHub Release
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        run: gh release upload "${TAG}" src-tauri/gen/android/app/build/outputs/apk/*Release/*.apk src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - id: publish-mobile-app
        name: Upload to the Play Store
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        run: secretspec run --profile release --scope android -- fastlane android stable
        shell: bash
        env:
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
  publish-release:
    needs:
      - build-macos
      - build-windows
      - build-linux
      - build-ios
      - build-android
      - create-release
    if: "!failure() && !cancelled() && ((github.event_name == 'push' && github.ref_name || inputs.tag) != '')"
    name: Publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: publish-release
        name: Publish the release
        run: gh release edit "${TAG}" --draft=false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
