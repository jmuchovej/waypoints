  create-release:
    needs:
      - test-macos
      - test-windows
      - test-linux
    name: Draft the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
          fetch-tags: "true"
      - name: Setup mise
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.8.6"
          cache: "false"
      - id: gen-release-notes
        name: Generate release notes
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        run: git-cliff --latest --output "${RUNNER_TEMP}/notes.md"
        shell: bash
      - id: draft-release
        name: Create the draft
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        run: |-
          gh release view "${TAG}" >/dev/null 2>&1 \
          || gh release create "${TAG}" --draft --verify-tag --notes-files "${RUNNER_TEMP}/notes.md"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  build-macos:
    needs:
      - test-macos
      - test-windows
      - test-linux
      - create-release
    if: github.event_name == 'push' || contains(fromJson('["All","Desktop","macOS"]'), inputs.platforms)
    name: Build macOS
    runs-on: macos-15
    permissions:
      contents: write
    env:
      MISE_DISABLE_TOOLS: "aqua:crate-ci/typos,aqua:google/keep-sorted,aqua:numtide/treefmt,aqua:oxipng/oxipng,aqua:tombi-toml/tombi,aqua:zizmorcore/zizmor,gem:rufo,github:Mic92/nixfmt-rs,github:facebook/ktfmt,npm:oxfmt"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
