      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.8.6"
          cache: "false"
      - id: pnpm-install
        name: Install JS deps
        run: pnpm install --frozen-lockfile
        shell: bash
      - id: build-recipe
        name: Build macOS
        run: "just tauri::macos::build"
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - id: upload-artifacts
        name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waypoints-macos-stable
          path: |-
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: error
      - id: upload-release
        name: Upload to GitHub Release
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        run: gh release upload "${TAG}" target/release/bundle/dmg/*.dmg target/release/bundle/macos/*.tar.gz target/release/bundle/macos/*.tar.gz.sig --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  build-windows:
    needs:
      - test-macos
      - test-windows
      - test-linux
      - create-release
    if: github.event_name == 'push' || contains(fromJson('["All","Desktop","Windows"]'), inputs.platforms)
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      MISE_DISABLE_TOOLS: "aqua:crate-ci/typos,aqua:google/keep-sorted,aqua:numtide/treefmt,aqua:oxipng/oxipng,aqua:tombi-toml/tombi,aqua:zizmorcore/zizmor,gem:rufo,github:Mic92/nixfmt-rs,github:facebook/ktfmt,npm:oxfmt"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.8.6"
          cache: "false"
      - id: pnpm-install
        name: Install JS deps
        run: pnpm install --frozen-lockfile
        shell: bash
      - id: build-recipe
        name: Build Windows
        run: "just tauri::windows::build"
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - id: upload-artifacts
        name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waypoints-windows-stable
          path: |-
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.nsis.zip
            target/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: error
      - id: upload-release
        name: Upload to GitHub Release
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        run: gh release upload "${TAG}" target/release/bundle/nsis/*.exe target/release/bundle/nsis/*.nsis.zip target/release/bundle/nsis/*.nsis.zip.sig --clobber
