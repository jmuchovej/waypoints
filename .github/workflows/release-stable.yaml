# Generated from xtask::workflows::release
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: Stable
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SECRETSPEC_PROVIDER: sops
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: All
        options:
          - All
          - Desktop
          - macOS
          - Linux
          - Windows
          - Mobile
          - Android
          - iOS
      tag:
        description: Release tag (leave empty for build-only, no release)
        type: string
        default: ""
permissions: {}
jobs:
  test-macos:
    name: Test macOS
    runs-on: macos-15
    permissions:
      contents: read
    env:
      MISE_DISABLE_TOOLS: "aqua:crate-ci/typos,aqua:google/keep-sorted,aqua:numtide/treefmt,aqua:oxipng/oxipng,aqua:tombi-toml/tombi,aqua:zizmorcore/zizmor,gem:rufo,github:Mic92/nixfmt-rs,github:facebook/ktfmt,npm:oxfmt"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.8.6"
          cache: "false"
      - id: test-plan
        name: cargo xtask test-plan
        run: cargo xtask test-plan  --release
        shell: bash
      - id: nextest
        name: Run release tests
        run: cargo nextest run --workspace --no-fail-fast -E "${FILTER_EXPR}"
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          FILTER_EXPR: ${{ steps.test-plan.outputs.filterset }}
  test-windows:
    name: Test Windows
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      MISE_DISABLE_TOOLS: "aqua:crate-ci/typos,aqua:google/keep-sorted,aqua:numtide/treefmt,aqua:oxipng/oxipng,aqua:tombi-toml/tombi,aqua:zizmorcore/zizmor,gem:rufo,github:Mic92/nixfmt-rs,github:facebook/ktfmt,npm:oxfmt"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.8.6"
          cache: "false"
      - id: test-plan
        name: cargo xtask test-plan
        run: cargo xtask test-plan  --release
        shell: bash
      - id: nextest
        name: Run release tests
        run: cargo nextest run --workspace --no-fail-fast -E "${FILTER_EXPR}"
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          FILTER_EXPR: ${{ steps.test-plan.outputs.filterset }}
  test-linux:
    name: Test Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      MISE_DISABLE_TOOLS: "aqua:crate-ci/typos,aqua:google/keep-sorted,aqua:numtide/treefmt,aqua:oxipng/oxipng,aqua:tombi-toml/tombi,aqua:zizmorcore/zizmor,gem:rufo,github:Mic92/nixfmt-rs,github:facebook/ktfmt,npm:oxfmt"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - id: free-disk
        name: Free runner disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          android: "true"
          dotnet: "true"
          haskell: "true"
          large-packages: "true"
          docker-images: "true"
          preinstalled-runtimes: "false"
          swap-storage: "false"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.8.6"
          cache: "false"
      - id: linux-deps
        name: Install system deps (Linux)
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        shell: bash
      - id: test-plan
        name: cargo xtask test-plan
        run: cargo xtask test-plan  --release
        shell: bash
      - id: nextest
        name: Run release tests
        run: cargo nextest run --workspace --no-fail-fast -E "${FILTER_EXPR}"
