          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: upload-artifacts
        name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waypoints-macos-stable
          path: |-
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: error
      - id: upload-release
        name: Upload to GitHub Release
        if: (github.event_name == 'push' && github.ref_name || inputs.tag) != ''
        run: gh release upload "${TAG}" target/release/bundle/dmg/*.dmg target/release/bundle/macos/*.tar.gz target/release/bundle/macos/*.tar.gz.sig --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - id: record-target
        name: Record the completed target
        run: echo "target=macos" >> "$GITHUB_OUTPUT"
        shell: bash
