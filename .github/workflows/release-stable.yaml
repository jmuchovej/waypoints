        run: gh release upload "${TAG}" target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.tar.gz target/release/bundle/appimage/*.AppImage.tar.gz.sig target/release/bundle/deb/*.deb --clobber
