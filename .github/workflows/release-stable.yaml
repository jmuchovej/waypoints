  publish-release:
    needs:
      - build-macos
      - build-windows
      - build-linux
      - build-ios
      - build-android
      - create-release
    if: "!failure() && !cancelled() && ((github.event_name == 'push' && github.ref_name || inputs.tag) != '')"
