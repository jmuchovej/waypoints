          cache: "true"
      - id: cache-restore-pnpm-store
        name: Restore pnpm-store
        run: |-
          path="${RUNNER_TEMP}/pnpm-store"
          archive="${RUNNER_TEMP}/${CACHE_KEY}.tar.gz"
          remote=":s3,provider=Cloudflare,env_auth=true:ci-cache/dirs/${CACHE_KEY}.tar.gz"
          if secretspec run --profile ci --scope cache -- bash -c 'RCLONE_S3_ENDPOINT="$SCCACHE_ENDPOINT" exec rclone copyto --s3-no-check-bucket "$@"' rclone "${remote}" "${archive}" \
            && mkdir -p "$(dirname "${path}")" \
            && (cd "$(dirname "${path}")" && tar -xzf -) < "${archive}"; then
            echo "hit=true" >> "${GITHUB_OUTPUT}"
            echo "restored ${CACHE_KEY} into ${path}"
          else
            echo "hit=false" >> "${GITHUB_OUTPUT}"
            echo "no entry for ${CACHE_KEY}; ${path} will be fetched"
          fi
          rm -f "${archive}"
        shell: bash
        env:
          CACHE_KEY: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          SECRETSPEC_REASON: restoring the pnpm-store snapshot from the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: pnpm-install
        name: Install JS deps
        run: pnpm install --frozen-lockfile --store-dir "${RUNNER_TEMP}/pnpm-store"
        shell: bash
      - id: cache-save-pnpm-store
        name: Save pnpm-store
        if: "!cancelled() && steps.cache-restore-pnpm-store.outputs.hit != 'true'"
        run: |-
          path="${RUNNER_TEMP}/pnpm-store"
          if [ ! -d "${path}" ]; then
            echo "nothing at ${path} to save"
            exit 0
          fi
          archive="${RUNNER_TEMP}/${CACHE_KEY}.tar.gz"
          remote=":s3,provider=Cloudflare,env_auth=true:ci-cache/dirs/${CACHE_KEY}.tar.gz"
          if (cd "$(dirname "${path}")" && tar -czf - "$(basename "${path}")") > "${archive}" \
