# Generated from xtask::workflows::bump
# Rebuild with `cargo xtask generate workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: bump the release cycle
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  schedule:
    - cron: 0 7 * * *
  workflow_dispatch:
    inputs:
      target:
        description: "What to bump: a channel, whose transition the planner infers from the open series, or one library group"
        type: choice
        default: nightly
        options:
          - nightly
          - preview
          - stable
          - bedrock
          - domain
          - outpost
          - transload
      major:
        description: Cut toward the app's next major; refused where the bump would not cut
        type: boolean
        default: "false"
      floor:
        description: The least a group bump moves its version by; never lowers it
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major
      dry_run:
        description: "Rehearse: plan, render the writes and refs as an artifact, and mint nothing; a nightly dispatch always does"
        type: boolean
        default: "true"
permissions: {}
jobs:
  bump:
    name: bump the release cycle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: CI
    env:
      MISE_ENV: xtask
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
          fetch-tags: "true"
      - id: setup-mise
        name: Set up mise
        uses: $/.github/actions/setup-mise
        with:
          mise-version: 2026.10.3
      - id: cache-restore-cargo-registry
        name: Restore cargo-registry
        run: xcache restore "${CACHE_KEY}" "${CARGO_HOME}/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: restoring the cargo-registry snapshot from the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: sccache-start
        name: Start the compiler cache
        run: secretspec run --profile ci --scope cache -- sccache --start-server || echo '::warning::sccache server failed to start; this build compiles without the remote cache'
        shell: bash
        env:
          SECRETSPEC_REASON: the compiler cache server reads and writes the ci-cache bucket for the length of the job; it alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCCACHE_BUCKET: ci-cache
          SCCACHE_S3_KEY_PREFIX: sccache/
          SCCACHE_REGION: auto
          SCCACHE_IDLE_TIMEOUT: "0"
      - name: Resolve the botswain secrets
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly'))"
        run: secretspec export --profile ci --scope botswain --format gha
        shell: bash
        env:
          SECRETSPEC_REASON: CI resolves the ci profile's botswain scope to authenticate as the App it names
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: app-token
        name: Mint a wp-botswain token
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly'))"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ env.WP_BOTSWAIN_APP_ID }}
          private-key: ${{ env.WP_BOTSWAIN_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: bump
        name: cargo ci-task release bump
        run: cargo ci-task release bump ${{ (github.event_name == 'schedule' || contains(fromJson('["nightly","preview","stable"]'), inputs.target)) && '--channel' || '--group' }} "$TARGET" ${{ inputs.major && '--major' || '' }} ${FLOOR:+--floor "$FLOOR"} ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly') && '--dry-run --into "${RUNNER_TEMP}/dry-run"' || '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ github.event_name == 'schedule' && 'nightly' || inputs.target }}
          FLOOR: ${{ inputs.floor != 'none' && inputs.floor || '' }}
          CARGO_BUILD_RUSTC_WRAPPER: sccache
      - id: sccache-stats
        name: Report the compiler cache
        if: always()
        run: |-
          sccache --show-stats
          sccache --stop-server
        shell: bash
      - id: cache-save-cargo-registry
        name: Save cargo-registry
        if: "!cancelled() && steps.cache-restore-cargo-registry.outputs.hit != 'true'"
        run: xcache save "${CACHE_KEY}" "${CARGO_HOME}/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: saving the cargo-registry snapshot to the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - id: upload-dry-run
        name: Upload the dry run
        if: github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dry-run-bump
          path: ${{ runner.temp }}/dry-run
          if-no-files-found: error
          retention-days: "7"
      - id: main-pull-request
        name: Open a pull request
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly')) && steps.bump.outputs.transition == 'cut'"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.bump.outputs.head }}
          delete-branch: "true"
          sign-commits: "true"
          title: ${{ steps.bump.outputs.title }}
          body-path: ${{ steps.bump.outputs.body_path }}
          commit-message: ${{ steps.bump.outputs.title }}
          add-paths: ${{ steps.bump.outputs.paths }}
      - id: merge-main
        name: cargo ci-task release merge
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly')) && steps.bump.outputs.transition == 'cut' && steps.main-pull-request.outputs.pull-request-number != ''"
        run: cargo ci-task release merge --pull-request "${PULL_REQUEST}"
        shell: bash
        env:
          PULL_REQUEST: ${{ steps.main-pull-request.outputs.pull-request-number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: series-token
        name: Mint a wp-botswain token for the series
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly'))"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ env.WP_BOTSWAIN_APP_ID }}
          private-key: ${{ env.WP_BOTSWAIN_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: tag-groups
        name: cargo ci-task release tag
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly')) && steps.bump.outputs.transition == 'cut' && steps.bump.outputs.group_tags != ''"
        run: cargo ci-task release tag --tags "${TAGS}" --commit "${COMMIT}"
        shell: bash
        env:
          TAGS: ${{ steps.bump.outputs.group_tags }}
          COMMIT: ${{ steps.merge-main.outputs.merge_commit }}
          GH_TOKEN: ${{ steps.series-token.outputs.token }}
      - id: open-series
        name: cargo ci-task release open-series
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly')) && steps.bump.outputs.transition == 'cut' && steps.bump.outputs.tag != ''"
        run: cargo ci-task release open-series --version "${VERSION}" --commit "${COMMIT}"
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          COMMIT: ${{ steps.merge-main.outputs.merge_commit }}
          GH_TOKEN: ${{ steps.series-token.outputs.token }}
      - id: series-pull-request
        name: Open a pull request
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly')) && steps.bump.outputs.tag != ''"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.series-token.outputs.token }}
          branch: ${{ steps.open-series.outputs.head || steps.bump.outputs.head }}
          delete-branch: "true"
          sign-commits: "true"
          title: ${{ steps.open-series.outputs.title || steps.bump.outputs.title }}
          body: Written by `cargo xtask release bump`; merges when its checks pass.
          commit-message: ${{ steps.open-series.outputs.title || steps.bump.outputs.title }}
          add-paths: ${{ steps.open-series.outputs.paths || steps.bump.outputs.paths }}
      - id: merge-series
        name: cargo ci-task release merge
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly')) && steps.series-pull-request.outputs.pull-request-number != ''"
        run: cargo ci-task release merge --pull-request "${PULL_REQUEST}"
        shell: bash
        env:
          PULL_REQUEST: ${{ steps.series-pull-request.outputs.pull-request-number }}
          GH_TOKEN: ${{ steps.series-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag-token
        name: Mint a wp-botswain token for the tag
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly')) && steps.bump.outputs.tag != ''"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ env.WP_BOTSWAIN_APP_ID }}
          private-key: ${{ env.WP_BOTSWAIN_PRIVATE_KEY }}
          permission-contents: write
      - id: tag-release
        name: cargo ci-task release tag
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.target == 'nightly')) && steps.bump.outputs.tag != ''"
        run: cargo ci-task release tag --tags "${TAGS}" --commit "${COMMIT}"
        shell: bash
        env:
          TAGS: ${{ steps.bump.outputs.tag }}
          COMMIT: ${{ steps.merge-series.outputs.merge_commit }}
          GH_TOKEN: ${{ steps.tag-token.outputs.token }}
concurrency:
  group: release-cycle
  cancel-in-progress: false
