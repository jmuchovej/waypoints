name: build the distributables of a ref
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  workflow_call:
    inputs:
      ref:
        description: "The ref to test and build: a tag, or any commit for the build its tree would make"
        required: true
        type: string
      platforms:
        description: "The platforms to build: All, Desktop, Mobile, or one platform"
        type: string
        default: All
    outputs:
      tag:
        description: "The tag the build is for: the ref, or the one its tree would be tagged as"
        value: ${{ jobs.describe.outputs.tag }}
      version:
        description: The version the build stamps
        value: ${{ jobs.describe.outputs.version }}
      channel:
        description: The channel the version names
        value: ${{ jobs.describe.outputs.channel }}
      flavor:
        description: The flavor the build was made under
        value: ${{ jobs.describe.outputs.flavor }}
      macos:
        description: "`macos` once the macOS build recorded in"
        value: ${{ jobs.build-macos.outputs.target }}
      windows:
        description: "`windows` once the Windows build recorded in"
        value: ${{ jobs.build-windows.outputs.target }}
      linux:
        description: "`linux` once the Linux build recorded in"
        value: ${{ jobs.build-linux.outputs.target }}
      ios:
        description: "`ios` once the iOS build recorded in"
        value: ${{ jobs.build-ios.outputs.target }}
      android:
        description: "`android` once the Android build recorded in"
        value: ${{ jobs.build-android.outputs.target }}
