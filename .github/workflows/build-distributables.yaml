      version: ${{ steps.describe.outputs.version }}
      channel: ${{ steps.describe.outputs.channel }}
      flavor: ${{ steps.describe.outputs.flavor }}
      version_code: ${{ steps.describe.outputs.version_code }}
      bundle_version: ${{ steps.describe.outputs.bundle_version }}
    env:
      MISE_ENV: xtask
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          ref: ${{ inputs.ref }}
          fetch-depth: "0"
          fetch-tags: "true"
      - id: setup-mise
        name: Set up mise
        uses: $/.github/actions/setup-mise
        with:
          mise-version: 2026.10.3
      - id: cache-restore-cargo-registry
        name: Restore cargo-registry
        run: xcache restore "${CACHE_KEY}" "${CARGO_HOME}/registry"
        shell: bash
        env:
          CACHE_KEY: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          SECRETSPEC_REASON: restoring the cargo-registry snapshot from the ci-cache bucket; the store client alone holds the credential
          SECRETSPEC_PROVIDER: op
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
