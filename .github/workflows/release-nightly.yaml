# Generated from xtask::workflows::release
# Rebuild with `cargo xtask workflows`. Do not edit this file.
# $schema: https://www.schemastore.org/github-workflow.json
name: Nightly
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+-nightly.[0-9]{8}
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (leave empty for build-only, no release)
        type: string
        default: ""
      platforms:
        description: Platforms to build
        type: choice
        default: All
        options:
          - All
          - Desktop
          - macOS
          - Linux
          - Windows
          - Android
permissions:
  contents: write
jobs:
  prepare:
    name: Plan the nightly
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      should_build: ${{ steps.plan.outputs.should-build }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v2
      - id: plan
        name: cargo xtask nightly-plan
        run: cargo xtask nightly-plan --dispatch-tag "${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  macos:
    needs:
      - prepare
    if: needs.prepare.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJson('["All","Desktop","macOS"]'), inputs.platforms))
    name: Build macOS desktop
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Decrypt Apple signing secrets
        run: |-
          secrets=$(sops -d .secrets/apple.sops.yaml)

          APPLE_API_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          echo "${secrets}" | yq '.developer-id.key-prv' > "${APPLE_API_KEY_PATH}"
          echo "APPLE_API_KEY_PATH=${APPLE_API_KEY_PATH}" >> "$GITHUB_ENV"

          APPLE_API_ISSUER=$(echo "${secrets}" | yq '.developer-id.issuer-id')
          echo "::add-mask::${APPLE_API_ISSUER}"
          echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}" >> "$GITHUB_ENV"

          APPLE_API_KEY=$(echo "${secrets}" | yq '.developer-id.key-id')
          echo "::add-mask::${APPLE_API_KEY}"
          echo "APPLE_API_KEY=${APPLE_API_KEY}" >> "$GITHUB_ENV"

          APPLE_CERTIFICATE=$(echo "${secrets}" | yq '.developer-id.certificate')
          echo "::add-mask::${APPLE_CERTIFICATE}"
          echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE}" >> "$GITHUB_ENV"

          APPLE_CERTIFICATE_PASSWORD=$(echo "${secrets}" | yq '.developer-id.password')
          echo "::add-mask::${APPLE_CERTIFICATE_PASSWORD}"
          echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}" >> "$GITHUB_ENV"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Decrypt updater signing key
        run: |-
          secrets=$(sops -d .secrets/updater.sops.yaml)

          TAURI_SIGNING_PRIVATE_KEY=$(echo "${secrets}" | yq '.private-key')
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::${line}"
          done <<< "${TAURI_SIGNING_PRIVATE_KEY}"
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<SECRET_EOF'
            echo "${TAURI_SIGNING_PRIVATE_KEY}"
            echo 'SECRET_EOF'
          } >> "$GITHUB_ENV"

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(echo "${secrets}" | yq '.password')
          echo "::add-mask::${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" >> "$GITHUB_ENV"
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Generate icons
        run: "just icons::nightly"
        working-directory: waypoints/src-tauri
      - name: Build
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: ./waypoints
          args: "--features nightly --config src-tauri/Tauri.flavor=nightly.toml"
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Waypoints ${{ needs.prepare.outputs.tag }}
          prerelease: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-macos-nightly
          path: |-
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: error
  linux:
    needs:
      - prepare
    if: needs.prepare.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJson('["All","Desktop","Linux"]'), inputs.platforms))
    name: Build Linux desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - name: Install system deps (Linux)
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Decrypt updater signing key
        run: |-
          secrets=$(sops -d .secrets/updater.sops.yaml)

          TAURI_SIGNING_PRIVATE_KEY=$(echo "${secrets}" | yq '.private-key')
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::${line}"
          done <<< "${TAURI_SIGNING_PRIVATE_KEY}"
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<SECRET_EOF'
            echo "${TAURI_SIGNING_PRIVATE_KEY}"
            echo 'SECRET_EOF'
          } >> "$GITHUB_ENV"

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(echo "${secrets}" | yq '.password')
          echo "::add-mask::${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" >> "$GITHUB_ENV"
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Generate icons
        run: "just icons::nightly"
        working-directory: waypoints/src-tauri
      - name: Build
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: ./waypoints
          args: "--features nightly --config src-tauri/Tauri.flavor=nightly.toml"
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Waypoints ${{ needs.prepare.outputs.tag }}
          prerelease: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-linux-nightly
          path: |-
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.tar.gz
            target/release/bundle/appimage/*.AppImage.tar.gz.sig
            target/release/bundle/deb/*.deb
          if-no-files-found: error
  windows:
    needs:
      - prepare
    if: needs.prepare.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJson('["All","Desktop","Windows"]'), inputs.platforms))
    name: Build Windows desktop
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Decrypt updater signing key
        run: |-
          secrets=$(sops -d .secrets/updater.sops.yaml)

          TAURI_SIGNING_PRIVATE_KEY=$(echo "${secrets}" | yq '.private-key')
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::${line}"
          done <<< "${TAURI_SIGNING_PRIVATE_KEY}"
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<SECRET_EOF'
            echo "${TAURI_SIGNING_PRIVATE_KEY}"
            echo 'SECRET_EOF'
          } >> "$GITHUB_ENV"

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(echo "${secrets}" | yq '.password')
          echo "::add-mask::${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" >> "$GITHUB_ENV"
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Generate icons
        run: "just icons::nightly"
        working-directory: waypoints/src-tauri
      - name: Build
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: ./waypoints
          args: "--features nightly --config src-tauri/Tauri.flavor=nightly.toml"
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Waypoints ${{ needs.prepare.outputs.tag }}
          prerelease: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-windows-nightly
          path: |-
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.nsis.zip
            target/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: error
  android:
    needs:
      - prepare
    if: needs.prepare.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJson('["All","Android"]'), inputs.platforms))
    name: Build Android
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Decrypt Android signing secrets
        run: |-
          secrets=$(sops -d .secrets/android.sops.yaml)

          keystore_path="${RUNNER_TEMP}/waypoints.jks"
          echo "${secrets}" | yq '.keystore' | base64 -d > "${keystore_path}"

          key_alias=$(echo "${secrets}" | yq '.key-alias')
          echo "::add-mask::${key_alias}"

          password=$(echo "${secrets}" | yq '.password')
          echo "::add-mask::${password}"

          cat > waypoints/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=${keystore_path}
          keyAlias=${key_alias}
          password=${password}
          EOF
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Generate icons
        run: "just icons::nightly"
        working-directory: waypoints/src-tauri
      - name: Build Android
        run: tauri android build --features nightly --target aarch64 x86_64 --apk --aab
        env:
          WAYPOINTS_FLAVOR: nightly
          WAYPOINTS_BUILD: "1"
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          WAYPOINTS_VERSION_CODE: ${{ github.run_number }}
        working-directory: waypoints
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-android-nightly
          path: |-
            waypoints/src-tauri/gen/android/app/build/outputs/apk/*Release/*.apk
            waypoints/src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab
          if-no-files-found: error
      - name: Upload to GitHub Release
        if: needs.prepare.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: "true"
          files: |-
            waypoints/src-tauri/gen/android/app/build/outputs/apk/*Release/*.apk
            waypoints/src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab
      - name: Decrypt Play Store credentials
        run: |-
          secrets=$(sops -d .secrets/android.sops.yaml)

          GOOGLE_PLAY_JSON_KEY_PATH="${RUNNER_TEMP}/play-store-key.json"
          echo "${secrets}" | yq '.play-store.json-key' | base64 -d > "${GOOGLE_PLAY_JSON_KEY_PATH}"

          echo "GOOGLE_PLAY_JSON_KEY_PATH=${GOOGLE_PLAY_JSON_KEY_PATH}" >> "$GITHUB_ENV"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Publish to Play Store
        run: fastlane android nightly
concurrency:
  group: nightly
  cancel-in-progress: false
