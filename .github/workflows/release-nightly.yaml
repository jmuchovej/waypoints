# Generated from xtask::workflows::release
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: Nightly
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SECRETSPEC_PROVIDER: sops
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: All
        options:
          - All
          - Desktop
          - macOS
          - Linux
          - Windows
          - Mobile
          - Android
          - iOS
permissions:
  contents: write
jobs:
  prepare:
    name: Plan the nightly
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.nightly-plan.outputs.tag }}
      should_build: ${{ steps.nightly-plan.outputs.should_build }}
      version_code: ${{ steps.nightly-plan.outputs.version_code }}
      bundle_version: ${{ steps.nightly-plan.outputs.bundle_version }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: "false"
          fetch-tags: "true"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - id: nightly-plan
        name: cargo xtask nightly-plan
        run: cargo xtask nightly-plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test-macos:
    needs:
      - prepare
    if: needs.prepare.outputs.should_build == 'true'
    name: Test macOS
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: test-plan
        name: cargo xtask test-plan
        run: cargo xtask test-plan  --release
      - name: Run release tests
        run: cargo nextest run --workspace --no-fail-fast -E "${FILTER_EXPR}"
        env:
          FILTER_EXPR: ${{ steps.test-plan.outputs.filterset }}
  test-windows:
    needs:
      - prepare
    if: needs.prepare.outputs.should_build == 'true'
    name: Test Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: test-plan
        name: cargo xtask test-plan
        run: cargo xtask test-plan  --release
      - name: Run release tests
        run: cargo nextest run --workspace --no-fail-fast -E "${FILTER_EXPR}"
        env:
          FILTER_EXPR: ${{ steps.test-plan.outputs.filterset }}
  test-linux:
    needs:
      - prepare
    if: needs.prepare.outputs.should_build == 'true'
    name: Test Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system deps (Linux)
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - id: test-plan
        name: cargo xtask test-plan
        run: cargo xtask test-plan  --release
      - name: Run release tests
        run: cargo nextest run --workspace --no-fail-fast -E "${FILTER_EXPR}"
        env:
          FILTER_EXPR: ${{ steps.test-plan.outputs.filterset }}
  build-macos:
    needs:
      - prepare
      - test-macos
      - test-windows
      - test-linux
    if: needs.prepare.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJson('["All","Desktop","macOS"]'), inputs.platforms))
    name: Build macOS
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: "false"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Build macOS
        run: "just tauri::macos::build-nightly"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-macos-nightly
          path: |-
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: error
      - name: Upload to GitHub Release
        if: needs.prepare.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: "true"
          files: |-
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.tar.gz.sig
  build-windows:
    needs:
      - prepare
      - test-macos
      - test-windows
      - test-linux
    if: needs.prepare.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJson('["All","Desktop","Windows"]'), inputs.platforms))
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: "false"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Build Windows
        run: "just tauri::windows::build-nightly"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-windows-nightly
          path: |-
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.nsis.zip
            target/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: error
      - name: Upload to GitHub Release
        if: needs.prepare.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: "true"
          files: |-
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.nsis.zip
            target/release/bundle/nsis/*.nsis.zip.sig
  build-linux:
    needs:
      - prepare
      - test-macos
      - test-windows
      - test-linux
    if: needs.prepare.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJson('["All","Desktop","Linux"]'), inputs.platforms))
    name: Build Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: "false"
      - name: Install system deps (Linux)
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Build Linux
        run: "just tauri::linux::build-nightly"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-linux-nightly
          path: |-
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.tar.gz
            target/release/bundle/appimage/*.AppImage.tar.gz.sig
            target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Upload to GitHub Release
        if: needs.prepare.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: "true"
          files: |-
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.tar.gz
            target/release/bundle/appimage/*.AppImage.tar.gz.sig
            target/release/bundle/deb/*.deb
  build-ios:
    needs:
      - prepare
      - test-macos
      - test-windows
      - test-linux
    if: needs.prepare.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJson('["All","Mobile","iOS"]'), inputs.platforms))
    name: Build iOS
    runs-on: macos-15
    permissions:
      contents: write
    env:
      MISE_ENV: ios
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: "false"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Build iOS
        run: "just tauri::ios::build-nightly"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          WAYPOINTS_BUILD_CODE: ${{ needs.prepare.outputs.bundle_version }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-ios-nightly
          path: waypoints/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
      - name: Upload to GitHub Release
        if: needs.prepare.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: "true"
          files: waypoints/src-tauri/gen/apple/build/**/*.ipa
      - name: Upload to the App Store
        run: secretspec run --profile release --scope ios -- fastlane ios nightly
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
  build-android:
    needs:
      - prepare
      - test-macos
      - test-windows
      - test-linux
    if: needs.prepare.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJson('["All","Mobile","Android"]'), inputs.platforms))
    name: Build Android
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: "false"
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Build Android
        run: "just tauri::android::build-nightly"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          WAYPOINTS_BUILD_CODE: ${{ needs.prepare.outputs.version_code }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-android-nightly
          path: |-
            waypoints/src-tauri/gen/android/app/build/outputs/apk/*Release/*.apk
            waypoints/src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab
          if-no-files-found: error
      - name: Upload to GitHub Release
        if: needs.prepare.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: "true"
          files: |-
            waypoints/src-tauri/gen/android/app/build/outputs/apk/*Release/*.apk
            waypoints/src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab
      - name: Upload to the Play Store
        run: secretspec run --profile release --scope android -- fastlane android nightly
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
concurrency:
  group: nightly
  cancel-in-progress: false
