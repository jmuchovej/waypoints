# Generated from xtask::workflows::check_generated
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: assert generated files remain in lockstep
on:
  pull_request:
    paths:
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - tooling/xtask/**
      - .github/workflows/**
      - .config/mise.lock
      - .config/mise.toml
      - .config/treefmt.toml
      - .pre-commit-config.yaml
  push:
    branches:
      - main
    paths:
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - tooling/xtask/**
      - .github/workflows/**
      - .config/mise.lock
      - .config/mise.toml
      - .config/treefmt.toml
      - .pre-commit-config.yaml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check-generated:
    name: check generated files match their sources
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - id: setup-nix
        name: Install Nix
        uses: cachix/install-nix-action@v31
      - id: setup-devenv-cachix
        name: Use the devenv binary cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv
      - id: setup-nix-profile
        name: Install devenv and just
        run: "nix profile install nixpkgs#devenv nixpkgs#just"
      - id: check-generated
        name: Check generated files
        run: just check-generated
concurrency:
  group: generated-${{ github.ref }}
  cancel-in-progress: true
