  workflow_dispatch: {}
permissions: {}
jobs:
  check-generated:
    name: check generated files match their sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - id: free-disk
        name: Free runner disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          android: "true"
          dotnet: "true"
          haskell: "true"
          large-packages: "true"
          docker-images: "true"
          preinstalled-runtimes: "false"
          swap-storage: "false"
      - id: setup-nix
        name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - id: setup-devenv-cachix
        name: Use the devenv binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: devenv
      - id: setup-nix-profile
        name: Install devenv and just
        run: nix profile install nixpkgs#devenv nixpkgs#just
        shell: bash
      - id: check-generated
        name: Check generated files
        run: devenv shell -- just check-generated
        shell: bash
concurrency:
  group: generated-${{ github.ref }}
  cancel-in-progress: true
