      - .config/mise.test.lock
      - .config/mise.test.toml
      - .config/mise.toml
      - .config/mise.website.lock
      - .config/mise.website.toml
      - .config/mise.xtask.lock
      - .config/mise.xtask.toml
      - src-tauri/gen/android/gradle/libs.versions.toml
      - src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
      - src-tauri/gen/android/local.properties
  push:
    branches:
