name: Build Android

on:
  workflow_call:
    inputs:
      flavor:
        required: true
        type: string
        description: "Build flavor (preview, stable)"
      features:
        required: true
        type: string
        description: "Cargo feature flags to enable"
      tag:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
    secrets:
      SOPS_AGE_KEY:
        required: true
        description: "Age private key for decrypting .secrets/*.sops.yaml"

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y sops age yq

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - name: Decrypt Android signing secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          secrets=$(sops -d .secrets/android.sops.yaml)
          keystore_path="${RUNNER_TEMP}/waypoints.jks"
          echo "${secrets}" | yq '.keystore' | base64 -d > "${keystore_path}"
          key_alias=$(echo "${secrets}" | yq '.key-alias')
          password=$(echo "${secrets}" | yq '.password')
          cat > waypoints/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=${keystore_path}
          keyAlias=${key_alias}
          password=${password}
          EOF

      - name: Build Android
        env:
          WAYPOINTS_FLAVOR: ${{ inputs.flavor }}
          WAYPOINTS_BUILD: "1"
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: cargo tauri android build --features ${{ inputs.features }} --aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: waypoints-android-${{ inputs.flavor }}
          path: waypoints/src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab

      - name: Upload to GitHub Release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: waypoints/src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab

      - name: Setup Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Decrypt Play Store credentials
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops -d .secrets/android.sops.yaml | yq '.play-store.json-key' | base64 -d > "${RUNNER_TEMP}/play-store-key.json"
          echo "GOOGLE_PLAY_JSON_KEY_PATH=${RUNNER_TEMP}/play-store-key.json" >> "$GITHUB_ENV"

      - name: Publish to Play Store
        run: fastlane android ${{ inputs.flavor }}
