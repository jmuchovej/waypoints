name: Preview

on:
  push:
    tags: ["v*-pre.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for build-only, no release)"
        required: false
        default: ""

jobs:
  desktop:
    uses: ./.github/workflows/_build-desktop.yaml
    with:
      flavor: preview
      features: preview
      config: Tauri.flavor=preview.toml
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      prerelease: true
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  android:
    uses: ./.github/workflows/_build-android.yaml
    with:
      flavor: preview
      features: preview
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      prerelease: true
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  ios:
    uses: ./.github/workflows/_build-ios.yaml
    with:
      flavor: preview
      features: preview
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      prerelease: true
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
