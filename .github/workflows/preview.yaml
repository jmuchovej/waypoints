name: Preview

on:
  push:
    tags: ["v*-pre.*"]
  workflow_dispatch:

jobs:
  desktop:
    uses: ./.github/workflows/_build-desktop.yaml
    with:
      flavor: preview
      features: preview
      config: Tauri.flavor=preview.toml
      tag: ${{ github.ref_name }}
      prerelease: true
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
