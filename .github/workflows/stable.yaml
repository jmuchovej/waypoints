name: Stable

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for build-only, no release)"
        required: false
        default: ""

jobs:
  desktop:
    uses: ./.github/workflows/_build-desktop.yaml
    with:
      flavor: stable
      features: stable
      config: ""
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      prerelease: false
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  android:
    uses: ./.github/workflows/_build-android.yaml
    with:
      flavor: stable
      features: stable
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      prerelease: false
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  ios:
    uses: ./.github/workflows/_build-ios.yaml
    with:
      flavor: stable
      features: stable
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      prerelease: false
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
