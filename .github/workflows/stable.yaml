name: Stable

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build.yaml
    with:
      flavor: stable
      features: stable
      config: ""
      tag: ${{ github.ref_name }}
      prerelease: false
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
