name: Stable

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

jobs:
  desktop:
    uses: ./.github/workflows/_build-desktop.yaml
    with:
      flavor: stable
      features: stable
      config: ""
      tag: ${{ github.ref_name }}
      prerelease: false
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  android:
    uses: ./.github/workflows/_build-android.yaml
    with:
      flavor: stable
      features: stable
      tag: ${{ github.ref_name }}
      prerelease: false
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  ios:
    uses: ./.github/workflows/_build-ios.yaml
    with:
      flavor: stable
      features: stable
      tag: ${{ github.ref_name }}
      prerelease: false
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
