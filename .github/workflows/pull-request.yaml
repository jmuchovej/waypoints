# Generated from xtask::workflows::pull_request
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: Tests
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test-linux:
    name: Test Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: "0"
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system deps (Linux)
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - id: test-plan
        name: cargo xtask test-plan
        run: "cargo xtask test-plan "
      - name: Run affected tests
        run: cargo nextest run --workspace --no-fail-fast -E "${{ steps.test-plan.outputs.filterset }}"
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
