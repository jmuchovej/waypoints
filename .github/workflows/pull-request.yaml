# Generated from xtask::workflows::pull_request
# Rebuild with `cargo xtask workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: Tests
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SECRETSPEC_PROVIDER: sops
on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
permissions: {}
jobs:
  test-linux:
    name: Test Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - id: free-disk
        name: Free runner disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          android: "true"
          dotnet: "true"
          haskell: "true"
          large-packages: "true"
          docker-images: "true"
          preinstalled-runtimes: "false"
          swap-storage: "false"
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.8.6"
          cache: "true"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: linux-deps
        name: Install system deps (Linux)
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        shell: bash
      - id: test-plan
        name: cargo xtask test-plan
        run: "cargo xtask test-plan "
        shell: bash
      - id: nextest
        name: Run affected tests
        run: cargo nextest run --workspace --no-fail-fast -E "${FILTER_EXPR}"
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          FILTER_EXPR: ${{ steps.test-plan.outputs.filterset }}
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
