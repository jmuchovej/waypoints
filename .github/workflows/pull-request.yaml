# Generated from xtask::workflows::pull_request
# Rebuild with `cargo xtask generate workflows`. Do not edit this file.

# $schema: https://www.schemastore.org/github-workflow.json
name: Tests
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
permissions: {}
jobs:
  test-linux:
    name: Test Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      MISE_ENV: test
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - id: setup-mise
        name: Set up mise
        uses: $/.github/actions/setup-mise
        with:
          mise-version: 2026.10.3
          cache: "true"
          free-disk: all
          rust-cache: "true"
      - id: linux-deps
        name: Install system deps (Linux)
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        shell: bash
      - id: test-plan
        name: cargo ci-task test-plan
        run: "cargo ci-task test-plan "
        shell: bash
      - id: nextest
        name: Run affected tests
        if: steps.test-plan.outputs.filterset != ''
        run: cargo nextest run --workspace --no-fail-fast --features "${FLAVOR}" -E "${FILTER_EXPR}"
        shell: bash
        env:
          FLAVOR: ${{ steps.test-plan.outputs.flavor }}
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          FILTER_EXPR: ${{ steps.test-plan.outputs.filterset }}
  zizmor:
    name: Audit the workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: devtools
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - id: setup-mise
        name: Set up mise
        uses: $/.github/actions/setup-mise
        with:
          mise-version: 2026.10.3
      - id: zizmor
        name: Audit the workflows
        run: zizmor .github
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
  license:
    name: Check licensing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: devtools
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - id: setup-mise
        name: Set up mise
        uses: $/.github/actions/setup-mise
        with:
          mise-version: 2026.10.3
          rust-cache: "true"
      - name: cargo ci-task check licenses
        run: cargo ci-task check licenses
        shell: bash
      - id: cargo-deny-licenses
        name: Check dependency licenses
        run: cargo deny check licenses
        shell: bash
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
