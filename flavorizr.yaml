app:
  android:
    flavorDimensions: "environment"

flavors:
  development:
    app:
      name: "Tempo (Dev)"
      # TODO add Tempo's development icon
      icon: assets/app-icon-dev.png

    android:
      applicationId: "com.tempo.app.dev"

    ios:
      bundleId: "com.tempo.app.dev"

    macos:
      bundleId: "com.tempo.app.dev"
      variables:
        PRODUCT_NAME:
          value: "Tempo (Dev)"
        TARGET_NAME:
          value: "Tempo (Dev)"

  staging:
    app:
      name: "Tempo (Staging)"
      # TODO add Tempo's staging icon
      # icon:

    android:
      applicationId: "com.tempo.app.staging"

    ios:
      bundleId: "com.tempo.app.staging"

    macos:
      bundleId: "com.tempo.app.staging"
      variables:
        PRODUCT_NAME:
          value: "Tempo (Staging)"
        TARGET_NAME:
          value: "Tempo (Staging)"

  production:
    app:
      name: "Tempo"
      # TODO add Tempo's production icon
      icon: assets/app-icon.png

    android:
      applicationId: "com.tempo.app.prod"

    ios:
      bundleId: "com.tempo.app.prod"

    macos:
      bundleId: "com.tempo.app.prod"
      variables:
        PRODUCT_NAME:
          value: "Tempo"
        TARGET_NAME:
          value: "Tempo"

instructions:
  - assets:download
  - assets:extract
  - android:androidManifest
  - android:flavorizrGradle
  - android:buildGradle
  - android:dummyAssets
  - android:icons
  # TODO figure out how to allow Flavorizr to control `flavors.dart` without
  #   without borking customizations
  # - flutter:flavors
  # - flutter:app
  # - flutter:pages
  # - flutter:main
  - ios:podfile
  - ios:xcconfig
  - ios:buildTargets
  - ios:schema
  - ios:dummyAssets
  - ios:icons
  - ios:plist
  - ios:launchScreen
  - macos:podfile
  - macos:xcconfig
  - macos:configs
  - macos:buildTargets
  - macos:schema
  - macos:dummyAssets
  - macos:icons
  - macos:plist
  - google:firebase
  - huawei:agconnect
  - assets:clean
  - ide:config

ide: "vscode"
