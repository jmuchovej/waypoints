[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "waypoints-serve"
path = "src/main.rs"

# HTTP backend for the Waypoints web UI — currently a development convenience
# (run the SPA in a browser without Tauri). Not feature-gated for now; gating
# can return once browser-mode behavior actually diverges from the desktop app.
[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
cartograph = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
