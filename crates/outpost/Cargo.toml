# Must use TOML v1.0.0 because of nix's `builtins.fromTOML`
#:tombi toml-version = "v1.0.0"

[package]
  name               = "outpost"
  version            = "0.1.0"
  edition.workspace  = true
  description        = """
Outpost — the sync layer for Waypoints.
"""
  documentation      = "https://docs.waypoints.so/outpost"
  readme.workspace   = true
  homepage.workspace = true
  repository         = "https://github.com/waypoints-hq/waypoints/tree/main/crates/outpost"
  license.workspace  = true
  publish.workspace  = true

[[bin]]
  name              = "outpost"
  required-features = [ "cli" ]

[dependencies]
  outpost-fabric   = { workspace = true, optional = true }
  outpost-hold     = { workspace = true, optional = true }
  outpost-protocol = { workspace = true }

  anyhow             = { workspace = true, optional = true }
  async-trait        = { workspace = true, optional = true }
  axum               = { workspace = true, optional = true }
  clap               = { workspace = true, optional = true }
  ed25519-dalek      = { workspace = true, optional = true }
  hex                = { workspace = true, optional = true }
  rand               = { workspace = true, optional = true }
  serde              = { workspace = true, optional = true }
  serde_json         = { workspace = true, optional = true }
  thiserror          = { workspace = true, optional = true }
  tokio              = { workspace = true, features = [ "macros", "rt" ], optional = true }
  tracing            = { workspace = true, optional = true }
  tracing-subscriber = { workspace = true, features = [ "json" ], optional = true }

[dev-dependencies]
  outpost = { workspace = true, features = [ "cli", "station", "vessel" ] }

  rand     = { workspace = true }
  tempfile = { workspace = true }
  tokio    = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
  ] }

[target."cfg(unix)".dev-dependencies]
  # gated b/c `libc` doesn't provide `kill` or `pid_t` on Windows
  libc = { workspace = true }

[features]
  default = [ "vessel" ]
  # Private: the deps and shared `replica` module both roles pull in. Not a
  # public knob — enable `vessel` and/or `station`. tokio is here for the
  # live-push machinery (spawned session tasks, mpsc/broadcast channels,
  # select!); the runtime itself stays the embedder's (the cli feature adds
  # one).
  _role   = [
    "dep:async-trait",
    "dep:ed25519-dalek",
    "dep:hex",
    "dep:outpost-fabric",
    "dep:outpost-hold",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
  ]
  # The `outpost` binary (self-host CLI): both roles + a runtime, arg
  # parsing, and the probe listener (axum — a server binary, so its closure
  # is not the app's concern). Enable to build `bin/outpost`.
  cli     = [
    "dep:anyhow",
    "dep:axum",
    "dep:clap",
    "dep:rand",
    "dep:serde_json",
    "dep:tracing-subscriber",
    "station",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "tokio/time",
    "vessel",
  ]
  # The two roles. Each is pure dependency selection: enabling it compiles in
  # that role's module (and, transitively, the shared replica engine + the
  # fabric/hold deps the roles need). The app enables `vessel`; a self-host
  # binary enables both. The role modules are thin — the shared half lives in
  # the `replica` module, itself gated on either role being on.
  station = [ "_role" ]
  vessel  = [ "_role" ]

[lints]
  workspace = true
