[package]
name = "outpost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["peers"]
# The store-and-forward peer engine: wire types, fetch client, the
# EnvelopeStore seam, and the gossip pump. What an embedding app pulls in.
# Depends on domain for the frozen identity newtypes (OpID & friends) —
# the log-plane fence is "never parse checkpoints", not "no domain types".
peers = ["dep:reqwest", "dep:domain", "dep:uuid"]
# The §4 endpoints as an axum router, plus request auth.
peers-serve = ["peers", "dep:axum", "dep:sha2", "tokio/net"]
# The embedded turso envelope store (standalone outposts).
store-turso = ["peers", "dep:turso"]
# Everything the `outpost` binary needs.
binary = [
  "peers-serve",
  "store-turso",
  "dep:clap",
  "dep:tracing-subscriber",
  "tokio/macros",
  "tokio/rt-multi-thread",
  "tokio/time",
]
# Reserved for future components (PROTOCOL.md §1): `relays` (live
# forwarding) and `directory` (peer discovery). Names only — no code yet.

[[bin]]
name = "outpost"
path = "bin/outpost.rs"
required-features = ["binary"]

[[test]]
name = "e2e"
required-features = ["binary"]

[dependencies]
async-trait.workspace = true
axum = { workspace = true, optional = true }
clap = { workspace = true, features = ["env"], optional = true }
domain = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
turso = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
cartograph.workspace = true
chrono.workspace = true
domain.workspace = true
store = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
