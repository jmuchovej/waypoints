[package]
name = "outpost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "outpost"
required-features = ["cli"]

[dependencies]
# CLI-only deps (see the `cli` feature).
anyhow = { workspace = true, optional = true }
# Role deps, pulled in by the role features (see `_role`).
async-trait = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
outpost-fabric = { workspace = true, optional = true }
outpost-hold = { workspace = true, optional = true }
# Always available: the protocol vocabulary an embedding crate needs.
outpost-protocol = { workspace = true }
rand = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
outpost = { path = ".", features = ["station", "vessel"] }
rand = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = ["vessel"]
# Private: the deps and shared `replica` module both roles pull in. Not a
# public knob — enable `vessel` and/or `station`. tokio is here for the
# live-push machinery (spawned session tasks, mpsc/broadcast channels,
# select!); the runtime itself stays the embedder's (the cli feature adds
# one).
_role = [
  "dep:async-trait",
  "dep:ed25519-dalek",
  "dep:hex",
  "dep:outpost-fabric",
  "dep:outpost-hold",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing",
]
# The `outpost` binary (self-host CLI): both roles + a runtime and arg
# parsing. Enable to build `bin/outpost`.
cli = [
  "dep:anyhow",
  "dep:clap",
  "dep:rand",
  "dep:serde_json",
  "dep:tracing-subscriber",
  "station",
  "tokio/rt-multi-thread",
  "tokio/signal",
  "vessel",
]
# The two roles. Each is pure dependency selection: enabling it compiles in
# that role's module (and, transitively, the shared replica engine + the
# fabric/hold deps the roles need). The app enables `vessel`; a self-host
# binary enables both. The role modules are thin — the shared half lives in
# the `replica` module, itself gated on either role being on.
station = ["_role"]
vessel = ["_role"]

[lints]
workspace = true
