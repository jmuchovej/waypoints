[package]
  name               = "bedrock-core"
  version            = "0.1.0"
  edition.workspace  = true
  description        = """
Bedrock's core schema vocabulary.
"""
  documentation      = "https://docs.waypoints.so/bedrock"
  readme             = "README.md"
  homepage.workspace = true
  repository         = "https://dev.waypoints.so/bedrock-core"
  license.workspace  = true
  publish.workspace  = true

[dependencies]
  chrono               = { workspace = true, features = [ "alloc" ] }
  indexmap.workspace   = true
  serde.workspace      = true
  serde_json.workspace = true
  thiserror.workspace  = true
  uuid.workspace       = true

# The app's flavors, so a gate can reach this crate. Exactly one shipped
# flavor per build.
[features]
  development = []
  nightly     = []
  preview     = []
  stable      = []

[lints]
  workspace = true
