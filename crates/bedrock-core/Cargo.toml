[dependencies]
  chrono               = { workspace = true, features = [ "alloc" ] }
  indexmap.workspace   = true
  serde.workspace      = true
  serde_json.workspace = true
  thiserror.workspace  = true
  uuid.workspace       = true

[lints]
  workspace = true
