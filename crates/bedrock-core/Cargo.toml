[package]
  name                   = "bedrock-core"
  version                = "0.1.0"
  edition.workspace      = true
  rust-version.workspace = true
  description            = """
Bedrock's core schema vocabulary.
"""
  documentation          = "https://docs.waypoints.so/bedrock"
  readme                 = "README.md"
  homepage.workspace     = true
  repository             = "https://dev.waypoints.so/bedrock-core"
  license.workspace      = true
