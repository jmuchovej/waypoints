# Must use TOML v1.0.0 because of nix's `builtins.fromTOML`
#:tombi toml-version = "v1.0.0"
# SPDX-FileCopyrightText: 2026 John Muchovej
# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
  name                    = "transload"
  version                 = "0.1.1"
  edition.workspace       = true
  description             = "The Bundle format: Waypoints' legible, lossless export and ingest"
  documentation.workspace = true
  readme.workspace        = true
  homepage.workspace      = true
  repository.workspace    = true
  license.workspace       = true
  publish.workspace       = true

[dependencies]
  bedrock = { workspace = true, features = [ "engine" ], optional = true }
  domain  = { workspace = true, features = [ "syntax" ] }

  chrono.workspace     = true
  chumsky.workspace    = true
  derive_more          = { workspace = true, features = [ "display" ] }
  indexmap.workspace   = true
  indoc.workspace      = true
  jsonschema           = { workspace = true, optional = true }
  schemars             = { workspace = true, optional = true }
  serde.workspace      = true
  serde_json.workspace = true
  thiserror.workspace  = true
  toml                 = { workspace = true, optional = true }
  uuid.workspace       = true
  wasmi                = { workspace = true, optional = true }

[dev-dependencies]
  domain             = { workspace = true, features = [ "fixtures" ] }
  rand.workspace     = true
  tempfile.workspace = true
  tokio              = { workspace = true, features = [ "macros", "rt-multi-thread" ] }
  trybuild.workspace = true

[features]
  default = [ "store" ]
  # The conformance harness: native and module backends. Never in a plugin.
  harness = [ "dep:jsonschema", "dep:wasmi", "sdk" ]
  # The plugin side: the `Importer` trait, the `importer!` macro, the TOML
  # manifest loader, and the options-schema generator. What a plugin links.
  sdk     = [ "dep:schemars", "dep:toml" ]
  # Export and ingest, which open a store, and reading validation, which needs
  # the schema validator. Off, the crate is the Bundle grammar alone — what a
  # grammar-only consumer (a WebAssembly module) links.
  store   = [ "dep:bedrock", "dep:jsonschema" ]

  # The app's flavors, forwarded to every workspace dependency that declares
  # them. Exactly one shipped flavor per build.
  development = [ "bedrock?/development", "domain/development" ]
  nightly     = [ "bedrock?/nightly", "domain/nightly" ]
  preview     = [ "bedrock?/preview", "domain/preview" ]
  stable      = [ "bedrock?/stable", "domain/stable" ]

[lints]
  workspace = true
