[package]
  name                    = "transload"
  version                 = "0.1.0"
  edition.workspace       = true
  description             = "The Bundle format: Waypoints' legible, lossless export and ingest"
  documentation.workspace = true
  readme.workspace        = true
  homepage.workspace      = true
  repository.workspace    = true
  license.workspace       = true
  publish.workspace       = true

[dependencies]
  bedrock = { workspace = true, features = [ "engine" ], optional = true }
  domain  = { workspace = true, features = [ "syntax" ] }

  chrono.workspace     = true
  derive_more          = { workspace = true, features = [ "display" ] }
  indexmap.workspace   = true
  itertools.workspace  = true
  jsonschema           = { workspace = true, optional = true }
  saphyr.workspace     = true
  serde.workspace      = true
  serde_json.workspace = true
  thiserror.workspace  = true
  uuid.workspace       = true

[dev-dependencies]
  rand.workspace     = true
  tempfile.workspace = true
  tokio              = { workspace = true, features = [ "macros", "rt-multi-thread" ] }
  trybuild.workspace = true

[features]
  default = [ "store" ]
  # Export and ingest, which open a store, and reading validation, which needs
  # the schema validator. Off, the crate is the Bundle grammar alone — what a
  # grammar-only consumer (a WebAssembly module) links.
  store   = [ "dep:bedrock", "dep:jsonschema" ]

[lints]
  workspace = true
