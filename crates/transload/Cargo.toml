[package]
  name                    = "transload"
  version                 = "0.1.0"
  edition.workspace       = true
  description             = "The Bundle format: Waypoints' legible, lossless export and ingest"
  documentation.workspace = true
  readme.workspace        = true
  homepage.workspace      = true
  repository.workspace    = true
  license.workspace       = true
  publish.workspace       = true

[dependencies]
  bedrock.workspace = true
  domain            = { workspace = true, features = [ "syntax" ] }

  chrono.workspace     = true
  chumsky.workspace    = true
  derive_more          = { workspace = true, features = [ "display" ] }
  indexmap.workspace   = true
  indoc.workspace      = true
  jsonschema.workspace = true
  serde.workspace      = true
  serde_json.workspace = true
  thiserror.workspace  = true
  uuid.workspace       = true

[dev-dependencies]
  domain             = { workspace = true, features = [ "fixtures" ] }
  rand.workspace     = true
  tempfile.workspace = true
  tokio              = { workspace = true, features = [ "macros", "rt-multi-thread" ] }
  trybuild.workspace = true

# The app's flavors, forwarded to every workspace dependency that declares
# them. Exactly one shipped flavor per build.
[features]
  development = [ "bedrock/development", "domain/development" ]
  nightly     = [ "bedrock/nightly", "domain/nightly" ]
  preview     = [ "bedrock/preview", "domain/preview" ]
  stable      = [ "bedrock/stable", "domain/stable" ]

[lints]
  workspace = true
