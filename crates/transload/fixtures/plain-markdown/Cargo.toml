[package]
  name               = "plain-markdown"
  version            = "0.1.0"
  edition.workspace  = true
  description        = "The fixture importer plugin: a directory of plain markdown, one Landmark per file"
  homepage.workspace = true
  license.workspace  = true
  publish            = false

# `cdylib` is the WebAssembly module; `rlib` is what the harness drives
# natively.
[lib]
  crate-type = [ "cdylib", "rlib" ]

[dependencies]
  # The plugin side only: no store, no harness. A path dependency rather than
  # the workspace entry, whose default features a member cannot turn off.
  transload = { path = "../..", default-features = false, features = [ "sdk" ] }

  domain.workspace     = true
  schemars.workspace   = true
  serde.workspace      = true
  serde_json.workspace = true

[dev-dependencies]
  transload = { path = "../..", default-features = false, features = [ "harness" ] }

  tempfile.workspace = true

[lints]
  workspace = true
