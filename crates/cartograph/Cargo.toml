[package]
name = "cartograph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "typegen"
path = "bin/typegen.rs"
required-features = ["development"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
domain.workspace = true
fast_qr.workspace = true
hex.workspace = true
outpost = { workspace = true, features = ["vessel"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-serde.workspace = true
specta-typescript.workspace = true
store.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rstest = { workspace = true }
store = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
# Dev-only: forwards to store's demo-data seeding (importer + corpus).
development = ["store/development"]

[lints]
workspace = true
