[package]
  name                    = "domain"
  version                 = "0.1.0"
  edition.workspace       = true
  description             = "Core data structures for block-based thought tools"
  documentation.workspace = true
  readme.workspace        = true
  homepage.workspace      = true
  repository.workspace    = true
  license.workspace       = true
  publish.workspace       = true

[dependencies]
  bedrock.workspace = true

  chrono.workspace            = true
  chumsky                     = { workspace = true, optional = true }
  derive_more                 = {
    workspace = true,
    features  = [
      "as_ref",
      "debug",
      "display",
      "from_str",
      "is_variant",
      "try_unwrap",
      "unwrap",
    ]
  }
  indexmap.workspace          = true
  rand.workspace              = true
  serde.workspace             = true
  serde_json.workspace        = true
  sha2.workspace              = true
  specta.workspace            = true
  specta-typescript.workspace = true
  thiserror.workspace         = true
  typed-builder.workspace     = true
  uuid.workspace              = true
  validator.workspace         = true

[features]
  default     = []
  development = []
  preview     = []
  stable      = []
  # parsing/emitting for `Content` and `TextMarkKind`. kept as a feature so
  # dependents don't need to pay for chumsky/etc.
  syntax      = [ "dep:chumsky" ]

[lints]
  workspace = true
