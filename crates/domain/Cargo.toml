[package]
  name                    = "domain"
  version                 = "0.1.0"
  edition.workspace       = true
  description             = "Core data structures for block-based thought tools"
  documentation.workspace = true
  readme.workspace        = true
  homepage.workspace      = true
  repository.workspace    = true
  license.workspace       = true
  publish.workspace       = true

[dependencies]
  # The façade only: the vocabulary the derives resolve against. The engine is
  # a feature the crates that open databases enable for themselves.
  bedrock.workspace = true

  chrono.workspace            = true
  derive_more                 = {
    workspace = true,
    features  = [
      "as_ref",
      "debug",
      "display",
      "from_str",
      "is_variant",
      "try_unwrap",
      "unwrap",
    ]
  }
  indexmap.workspace          = true
  pulldown-cmark              = { workspace = true, optional = true }
  serde.workspace             = true
  serde_json.workspace        = true
  sha2.workspace              = true
  specta.workspace            = true
  specta-typescript.workspace = true
  thiserror.workspace         = true
  typed-builder.workspace     = true
  uuid.workspace              = true
  validator.workspace         = true

# Minting and the clock are the core's. A wasm32 build (an importer plugin)
# gets the types and none of this: no entropy, no `now`, so nothing in its
# graph can ask a host for either.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
  chrono         = { workspace = true, features = [ "now" ] }
  rand.workspace = true
  uuid           = { workspace = true, features = [ "v4" ] }

[features]
  default     = []
  development = []
  preview     = []
  stable      = []
  # The markdown dialect `Content` and `TextMarkKind` project into: one module,
  # both directions. Only `transload` needs it, so every other dependent pays
  # neither the module nor `pulldown-cmark`.
  syntax      = [ "dep:pulldown-cmark" ]

[lints]
  workspace = true
