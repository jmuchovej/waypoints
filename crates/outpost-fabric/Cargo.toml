[package]
  name                   = "outpost-fabric"
  version                = "0.1.0"
  edition.workspace      = true
  rust-version.workspace = true
  description            = """
Outpost Fabric — the network layer for Outpost.
"""
  documentation          = "https://docs.waypoints.so/outpost/fabric"
  readme.workspace       = true
  homepage.workspace     = true
  repository             = "https://github.com/waypoints-hq/waypoints/tree/main/crates/outpost-fabric"
  license.workspace      = true
  publish.workspace      = true

[dependencies]
  outpost-protocol.workspace = true

  async-trait.workspace   = true
  ed25519-dalek.workspace = true
  iroh.workspace          = true
  postcard.workspace      = true
  serde.workspace         = true
  thiserror.workspace     = true
  tokio                   = { workspace = true, features = [ "io-util", "macros" ] }
  tracing.workspace       = true

[dev-dependencies]
  outpost-hold.workspace = true

  tokio = {
    workspace = true,
    features  = [ "io-util", "macros", "rt-multi-thread", "sync" ]
  }

[lints]
  workspace = true
