[package]
name = "outpost-fabric"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
ed25519-dalek = { workspace = true }
iroh = { workspace = true }
outpost-protocol = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
# hold is a test-only dependency: it lets the session tests converge two
# real holds over a stream. Production fabric depends on protocol alone.
outpost-hold = { workspace = true }
tokio = {
  workspace = true,
  features = [
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
  ]
}

[lints]
workspace = true
