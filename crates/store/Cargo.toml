[package]
  name                    = "store"
  edition.workspace       = true
  description.workspace   = true
  documentation.workspace = true
  readme.workspace        = true
  homepage.workspace      = true
  repository.workspace    = true
  license.workspace       = true
  publish.workspace       = true

[dependencies]
  bedrock.workspace          = true
  domain.workspace           = true
  # Scoped to the sync-owned tables in `query::sync` — see that module's doc.
  outpost-protocol.workspace = true
  transload                  = { workspace = true, optional = true }

  chrono.workspace     = true
  derive_more          = {
    workspace = true,
    features  = [ "debug", "display", "error", "from" ]
  }
  serde.workspace      = true
  serde_json.workspace = true
  tempfile             = { workspace = true, optional = true }
  thiserror.workspace  = true
  tokio.workspace      = true
  tracing.workspace    = true
  turso.workspace      = true
  uuid.workspace       = true

[dev-dependencies]
  rstest.workspace   = true
  store              = { workspace = true, features = [ "development", "test-utils" ] }
  tempfile.workspace = true
  tokio              = { workspace = true, features = [ "macros", "rt-multi-thread" ] }

[features]
  default     = []
  # The app's flavors, forwarded to every workspace dependency that declares
  # them — weakly to `transload`, so a flavor does not pull it in. Exactly one
  # shipped flavor per build.
  development = [
    "bedrock/development",
    "domain/development",
    "mock",
    "outpost-protocol/development",
    "transload?/development",
  ]
  mock        = [ "dep:transload" ]
  nightly     = [
    "bedrock/nightly",
    "domain/nightly",
    "outpost-protocol/nightly",
    "transload?/nightly",
  ]
  preview     = [
    "bedrock/preview",
    "domain/preview",
    "outpost-protocol/preview",
    "transload?/preview",
  ]
  stable      = [
    "bedrock/stable",
    "domain/stable",
    "outpost-protocol/stable",
    "transload?/stable",
  ]
  test-utils  = [ "dep:tempfile" ]

[lints]
  workspace = true
