# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
impure: false

nixpkgs:
  allowUnfree: true

imports:
  - ./waypoints/src-tauri/gen/android
  - ./waypoints/src-tauri/gen/apple

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # Upstream nixpkgs for ML runtime libraries (onnxruntime): the rolling
  # devenv-nixpkgs snapshot builds onnxruntime with CUDA even on darwin
  # (unbuildable there, and uncached), while upstream is hydra-cached.
  nixpkgs-ml:
    url: github:NixOS/nixpkgs/nixos-unstable
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
