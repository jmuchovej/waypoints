# $schema: https://devenv.sh/devenv.schema.json
impure: false

nixpkgs:
  allow_unfree: true
  permitted_insecure_packages: ["pnpm-9.15.9"]

secretspec:
  enable: true
  provider: env
  profile: default

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:jmuchovej/forked-treefmt-nix/cherry-picks
    inputs:
      nixpkgs:
        follows: nixpkgs
