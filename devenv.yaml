# $schema: https://devenv.sh/devenv.schema.json
impure: false

nixpkgs:
  allowUnfree: true

imports:
  - ./waypoints/src-tauri/gen/android
  - ./waypoints/src-tauri/gen/apple

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:jmuchovej/forked-treefmt-nix/cherry-picks
    inputs:
      nixpkgs:
        follows: nixpkgs
  openspec:
    url: github:jmuchovej/forked-openspec/add-nix-overlay
    inputs:
      nixpkgs:
        url: github:NixOS/nixpkgs/9f0c42f8bc7151b8e7e5840fb3bd454ad850d8c5
    overlays:
      - default
