# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  android-nixpkgs:
    url: github:tadfisher/android-nixpkgs
    inputs:
      nixpkgs:
        follows: nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:jmuchovej/forked-treefmt-nix/cherry-picks
    inputs:
      nixpkgs:
        follows: nixpkgs
nixpkgs:
  allow_unfree: true
  permitted_insecure_packages:
    - pnpm-9.15.9
secretspec:
  enable: true
  profile: default
  provider: env
