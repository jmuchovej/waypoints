# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  android-nixpkgs:
    url: github:tadfisher/android-nixpkgs
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
nixpkgs:
  allow_unfree: true
secretspec:
  enable: true
  profile: default
  provider: env
