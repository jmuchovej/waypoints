# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  android-nixpkgs:
    url: github:tadfisher/android-nixpkgs
    inputs:
      nixpkgs:
        follows: nixpkgs
  # A release tag, not `main`: mise installs the published release of whatever
  # version this builds, and `main` can carry unreleased code under that number.
  mbx:
    url: github:jdx/mr-boxington/v1.26.0
    inputs:
      nixpkgs:
        follows: nixpkgs
  mise:
    url: github:jdx/mise/v2026.10.11
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
nixpkgs:
  allow_unfree: true
# No `provider`: devenv would export it as SECRETSPEC_PROVIDER for the whole
# shell, overriding every profile's own default. The manifest says where each
# profile resolves from — `default` from the environment, the CI-facing ones
# from 1Password — and a caller overrides per invocation.
secretspec:
  enable: true
  profile: default
