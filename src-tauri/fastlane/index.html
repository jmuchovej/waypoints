<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mobile Assets, en-US</title></head><body><h1>Mobile Assets, <code>en-US</code></h1><style>:root {
  color-scheme: dark;
  --bg: oklch(12.9% 0.042 264.7deg);
  --surface: oklch(20.8% 0.042 265.76deg);
  --raised: oklch(27.9% 0.041 260.03deg);
  --edge: oklch(44.6% 0.043 257.28deg);
  --muted: oklch(70.4% 0.04 256.79deg);
  --ink: oklch(98.4% 0.003 247.86deg);
  --todo: oklch(82.8% 0.189 84.43deg);
}
  body {
    margin: 0 auto; padding: 40px 32px 72px; max-width: 1200px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Albert Sans", system-ui, sans-serif;
  }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 4px; }
  h2 {
    font-size: 13px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
    margin: 40px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--edge);
  }
  .sheet { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { margin: 0; border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; }
  .card a { display: block; line-height: 0; }
  /* Chequerboard reads through transparency, so a stray alpha channel shows. */
  .card img {
    width: 100%; height: 260px; object-fit: contain; padding: 12px; box-sizing: border-box;
    background-color: var(--surface);
    background-image:
      linear-gradient(45deg, var(--raised) 25%, transparent 25%, transparent 75%, var(--raised) 75%),
      linear-gradient(45deg, var(--raised) 25%, transparent 25%, transparent 75%, var(--raised) 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px;
  }
  figcaption { padding: 12px 14px; border-top: 1px solid var(--edge); }
  figcaption code { font-family: "Monaspace Argon", ui-monospace, monospace; font-size: 13px; }
  figcaption .spec { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }

d/en-US/images/phoneScreenshots/03-charts.png</code><span class="spec">1080×1920 · 9:16, no alpha</span></figcaption></figure><figure class="card"><a href="metadata/android/en-US/images/phoneScreenshots/04-terrain.png"><img src="metadata/android/en-US/images/phoneScreenshots/04-terrain.png" alt="metadata/android/en-US/images/phoneScreenshots/04-terrain.png" loading="lazy"></a><figcaption><code>metadata/android/en-US/images/phoneScreenshots/04-terrain.png</code><span class="spec">1080×1920 · 9:16, no alpha</span></figcaption></figure></div><h2>App Store — iPhone 6.9"</h2><div class="sheet"><figure class="card"><a href="screenshots/en-US/01-blocks.png"><img src="screenshots/en-US/01-blocks.png" alt="screenshots/en-US/01-blocks.png" loading="lazy"></a><figcaption><code>screenshots/en-US/01-blocks.png</code><span class="spec">1320×2868 · 6.9-inch iPhone, no alpha</span></figcaption></figure><figure class="card"><a href="screenshots/en-US/02-local-first.png"><img src="screenshots/en-US/02-local-first.png" alt="screenshots/en-US/02-local-first.png" loading="lazy"></a><figcaption><code>screenshots/en-US/02-local-first.png</code><span class="spec">1320×2868 · 6.9-inch iPhone, no alpha</span></figcaption></figure><figure class="card"><a href="screenshots/en-US/03-charts.png"><img src="screenshots/en-US/03-charts.png" alt="screenshots/en-US/03-charts.png" loading="lazy"></a><figcaption><code>screenshots/en-US/03-charts.png</code><span class="spec">1320×2868 · 6.9-inch iPhone, no alpha</span></figcaption></figure><figure class="card"><a href="screenshots/en-US/04-terrain.png"><img src="screenshots/en-US/04-terrain.png" alt="screenshots/en-US/04-terrain.png" loading="lazy"></a><figcaption><code>screenshots/en-US/04-terrain.png</code><span class="spec">1320×2868 · 6.9-inch iPhone, no alpha</span></figcaption></figure></div></body></html>
