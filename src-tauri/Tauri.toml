# :schema https://schema.tauri.app/config/2
product-name = "Waypoints"
version = "0.1.0"
identifier = "so.waypoints"

[build]
before-build-command = "just app::generate"
before-dev-command = "just app::dev"
devUrl = "http://localhost:9297"
frontend-dist = "../src/dist"

[bundle]
homepage = "https://waypoints.so"
active = true
targets = "all"
icon = [
  "icons/app-icon.iconset/icon_32x32.png",
  "icons/app-icon.iconset/icon_128x128.png",
  "icons/app-icon.iconset/icon_128x128@2x.png",
  "icons/icon-mainline.icns",
  "icons/icon-mainline.ico",
]
resources = []
external-bin = []
copyright = ""
category = "DeveloperTool"
short-description = ""
long-description = ""


[plugins]

[[app.windows]]
title = "Waypoints"
width = 1366
height = 768
min-width = 375
min-height = 812
resizable = true
fullscreen = false

[app.security]
