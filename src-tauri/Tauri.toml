#:tombi toml-version = "v1.1.0"
#:schema https://schema.tauri.app/config/2

productName = "Waypoints"
identifier  = "so.waypoints"

[build]
  devUrl       = "http://localhost:9297"
  frontendDist = "../src/.output"

  [build.beforeBuildCommand]
    cwd    = ".."
    script = "just app::generate"

  [build.beforeDevCommand]
    cwd    = ".."
    script = "just app::dev"

[bundle]
  homepage               = "https://waypoints.so"
  active                 = true
  targets                = [ "app", "dmg", "nsis", "appimage", "deb", "rpm" ]
  createUpdaterArtifacts = true
  # Stable's, for builds that merge no flavor fragment (cargo check, clippy,
  # tests): `generate_context!` takes the window icon from here. Each flavor
  # fragment overrides it.
  icon                   = [
    "assets/icons/app/stable-032.png",
    "assets/icons/app/stable-128.png",
    "assets/icons/app/stable-128@2x.png",
    "assets/icons/app/stable.icns",
    "assets/icons/app/stable.ico",
  ]
  resources              = []
  externalBin            = []
  copyright              = ""
  category               = "DeveloperTool"
  shortDescription       = ""
  longDescription        = ""

  # https://tauri.app/distribute/macos-application-bundle/
  [bundle.macOS]
    minimumSystemVersion = "15"
    # entitlements = "./platforms/macos/Entitlements.plist"
    # frameworks = []

  # https://tauri.app/distribute/sign/ios/
  [bundle.iOS]
    developmentTeam      = "D6NBHNJ93R"
    minimumSystemVersion = "18.0"

    # Rust builds a staticlib, so its `#[link]` directives never reach the final
    # link — Xcode performs that, and only links what this list names. Two crates
    # in the iroh/outpost stack need SystemConfiguration:
    #   * hickory-resolver, via `system_configuration`, for DNS (SCDynamicStore*,
    #     SCPreferencesCreate) — all iOS-supported;
    #   * netdev, for interface enumeration (SCNetworkInterface*, SCNetworkService*)
    #     — those are marked API_UNAVAILABLE(ios) in the SDK headers. They are
    #     exported by the iOS .tbd so they link, but see the note below.
    #
    # Only takes effect when `tauri ios init` regenerates gen/apple/project.yml;
    # `tauri ios build` merely runs xcodegen against the existing file. The matching
    # `- sdk: SystemConfiguration.framework` entry is therefore committed there too,
    # and the two must be changed together.
    frameworks = [ "SystemConfiguration" ]

  # https://tauri.app/distribute/google-play/
  [bundle.android]
    minSdkVersion            = 28
    debugApplicationIdSuffix = ".debug"

  [bundle.linux.deb]

  [bundle.linux.appimage]
    bundleMediaFramework = true

  [bundle.linux.rpm]

  [bundle.windows]
    digestAlgorithm = "sha256"
    timestampUrl    = ""

# Pairing links: the waypoints:// scheme opens the app everywhere it is
# installed; the waypoints.so association upgrades https://waypoints.so/pair
# links on iOS/Android (requires the .well-known files the website serves).
[plugins.deep-link.desktop]
  schemes = [ "waypoints" ]

[[plugins.deep-link.mobile]]
  host       = "waypoints.so"
  pathPrefix = [ "/pair" ]

[plugins.updater]
  endpoints = [
    "https://api.waypoints.so/releases/{{target}}/{{arch}}/{{current_version}}"
  ]
  pubkey    = "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDMyREIxRDEwQTBFRTc4NzUKUldSMWVPNmdFQjNiTWwyRWxsMFdFbVR0aWFjV01vQVJPV0YxMGd0cm9tNlRUSmZXdDhtUmFUR1IK"

[[app.windows]]
  title      = "Waypoints"
  width      = 1366
  height     = 768
  minWidth   = 375
  minHeight  = 812
  resizable  = true
  fullscreen = false
  # title-bar-style = "overlay"
  # hidden-title = true

[app.security]
