name: Waypoints
options:
  bundleIdPrefix: so.waypoints
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Waypoints
      PRODUCT_BUNDLE_IDENTIFIER: so.waypoints
      DEVELOPMENT_TEAM: D6NBHNJ93R
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  Waypoints_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: Waypoints_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: Waypoints_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.5.1
        CFBundleVersion: "1.5.1"
        NSCameraUsageDescription: Waypoints uses the camera to scan setup codes when pairing a new device.
    entitlements:
      path: Waypoints_iOS/Waypoints_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        # Spelled out rather than $(TOOLCHAIN_DIR): under Xcode 26 that can
        # resolve to the separately downloaded Metal toolchain, which has no
        # Swift compatibility libraries, and the link fails on
        # swiftCompatibility56. Matches Tauri's current template.
        LIBRARY_SEARCH_PATHS[arch=arm64]: >-
          $(inherited)
            $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION)
            $(SDKROOT)/usr/lib/swift
            $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME)
            $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          set -e
          cargo tauri ios xcode-script -v \
            --platform "${PLATFORM_DISPLAY_NAME:?}" \
            --sdk-root "${SDKROOT:?}" \
            --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" \
            --header-search-paths "${HEADER_SEARCH_PATHS:?}" \
            --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" \
            --configuration "${CONFIGURATION:?}" \
            ${FORCE_COLOR} \
            "${ARCHS:?}"
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
