#:schema https://schema.tauri.app/config/2
# SPDX-FileCopyrightText: 2026 John Muchovej
# SPDX-License-Identifier: AGPL-3.0-or-later

productName = "Waypoints Development Edition"
identifier  = "so.waypoints.dev"

[plugins.updater]
  endpoints = []

# The whole table, as in stable.toml. Development shares stable's scheme:
# registration is persistent and macOS cannot register at runtime, so there is
# no way to claim a scheme only while running.
[plugins.deep-link]
  [plugins.deep-link.desktop]
    schemes = [ "waypoints" ]

  [[plugins.deep-link.mobile]]
    host       = "waypoints.so"
    pathPrefix = [ "/pair" ]

  [[plugins.deep-link.mobile]]
    scheme = [ "waypoints" ]

[bundle]
  icon = [
    "assets/icons/app/dev-032.png",
    "assets/icons/app/dev-128.png",
    "assets/icons/app/dev-128@2x.png",
    "assets/icons/app/dev.icns",
    "assets/icons/app/dev.ico",
  ]

  [bundle.windows.nsis]
    installerIcon   = "assets/icons/app/dev.ico"
    uninstallerIcon = "assets/icons/app/dev.ico"
