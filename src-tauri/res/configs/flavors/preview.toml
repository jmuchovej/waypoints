#:schema https://schema.tauri.app/config/2
# SPDX-FileCopyrightText: 2026 John Muchovej
# SPDX-License-Identifier: AGPL-3.0-or-later

productName = "Waypoints Preview"
identifier  = "so.waypoints.preview"

[plugins.updater]
  endpoints = [ "https://waypoints.so/api/v1/update/preview.json" ]

# The whole table, as in stable.toml: `mobile` replaces the base's list.
[plugins.deep-link]
  [plugins.deep-link.desktop]
    schemes = [ "waypoints-preview" ]

  [[plugins.deep-link.mobile]]
    host       = "waypoints.so"
    pathPrefix = [ "/pair" ]

  [[plugins.deep-link.mobile]]
    scheme = [ "waypoints-preview" ]

[bundle]
  icon = [
    "assets/icons/app/preview-032.png",
    "assets/icons/app/preview-128.png",
    "assets/icons/app/preview-128@2x.png",
    "assets/icons/app/preview.icns",
    "assets/icons/app/preview.ico",
  ]

  [bundle.windows.nsis]
    installerIcon   = "assets/icons/app/preview.ico"
    uninstallerIcon = "assets/icons/app/preview.ico"
