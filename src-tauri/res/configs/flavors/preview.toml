#:schema https://schema.tauri.app/config/2

productName = "Waypoints Preview"
identifier  = "so.waypoints.preview"

[plugins.updater]
  endpoints = [ "https://waypoints.so/api/v1/update/preview.json" ]

[bundle]
  icon = [
    "assets/icons/app/preview-032.png",
    "assets/icons/app/preview-128.png",
    "assets/icons/app/preview-128@2x.png",
    "assets/icons/app/preview.icns",
    "assets/icons/app/preview.ico",
  ]

  [bundle.windows.nsis]
    installerIcon   = "assets/icons/app/preview.ico"
    uninstallerIcon = "assets/icons/app/preview.ico"
