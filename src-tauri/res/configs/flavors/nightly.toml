productName = "Waypoints Nightly"
identifier  = "so.waypoints.nightly"

[plugins.updater]
  endpoints = [ "https://waypoints.so/api/v1/update/nightly.json" ]

[bundle]
  icon = [
    "assets/icons/app/nightly-032.png",
    "assets/icons/app/nightly-128.png",
    "assets/icons/app/nightly-128@2x.png",
    "assets/icons/app/nightly.icns",
    "assets/icons/app/nightly.ico",
  ]

  [bundle.windows.nsis]
    installerIcon   = "assets/icons/app/nightly.ico"
    uninstallerIcon = "assets/icons/app/nightly.ico"
