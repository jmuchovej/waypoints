#:schema https://schema.tauri.app/config/2

productName = "Waypoints (Nightly)"
identifier  = "so.waypoints.nightly"

[plugins.updater]
  pubkey    = "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDMyREIxRDEwQTBFRTc4NzUKUldSMWVPNmdFQjNiTWwyRWxsMFdFbVR0aWFjV01vQVJPV0YxMGd0cm9tNlRUSmZXdDhtUmFUR1IK"
  endpoints = [ "https://waypoints.so/api/v1/update/nightly.json" ]

[bundle]
  icon = [
    "icons/nightly/32x32.png",
    "icons/nightly/128x128.png",
    "icons/nightly/128x128@2x.png",
    "icons/nightly/icon.icns",
    "icons/nightly/icon.ico",
  ]

  # iOS carries the flavor label as the display name instead of in productName:
  # Tauri makes productName the executable name there, and App Store Connect
  # rejects executables containing parentheses (`xtauri build ios` overrides it).
  [bundle.iOS]
    infoPlist = "configs/flavors/ios/nightly.plist"
