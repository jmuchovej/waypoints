# :schema https://schema.tauri.app/config/2
product-name = "Waypoints"
version = "0.1.0"
identifier = "so.waypoints"

[build]
before-build-command = "just generate"
before-dev-command = "just dev"
devUrl = "http://localhost:9297"
frontend-dist = "../dist"

[bundle]
homepage = "https://waypoints.so"
active = true
targets = ["app", "dmg", "nsis", "appimage", "deb"]
createUpdaterArtifacts = true
icon = [
  "icons/generated/32x32.png",
  "icons/generated/128x128.png",
  "icons/generated/128x128@2x.png",
  "icons/generated/icon.icns",
  "icons/generated/icon.ico",
]
resources = []
external-bin = []
copyright = ""
category = "DeveloperTool"
short-description = ""
long-description = ""

[plugins.updater]
endpoints = [
  "https://api.waypoints.so/releases/{{target}}/{{arch}}/{{current_version}}",
]
