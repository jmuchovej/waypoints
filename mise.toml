[tools]
"aqua:astral-sh/ruff" = "0.11.2"
"aqua:numtide/treefmt" = "2.1.1"
cargo = "0.86.0"
# Can't use 3.32 b/c of https://github.com/flutter/flutter/issues/169204
# Supposedly https://github.com/flutter/flutter/pull/169583 resolves it...
flutter = "3.29.3-stable"
java = "24.0.0"
rust = "1.85.1"
yamlfmt = "0.16.0"
colima = "0.8.1"
act = "0.2.75"
aapt2 = "8.9.1-12782657"
"aqua:gradle/gradle-distributions" = "8.13.0"
swiftformat = "0.55.5"
swift = "6.0.3"
yq = "4.45.1"
android-sdk = "latest"
ruby = "3.4.2"
"gem:cocoapods" = "1.16.2"
"ubi:CQLabs/homebrew-dcm" = { version = "latest", exe = "dcm", matching = "dcm" }

# [hooks]
# preinstall = "mise install android-sdk@19.0"

[alias]
# android-sdk = "https://github.com/mise-plugins/mise-android-sdk.git"

[env]
DATABASE_URL = "sqlite://{{ config_root }}/tempo-flux.db?mode=rwc"
ANDROID_HOME = "{{ env.HOME }}/Library/Android/sdk"

[tasks.builder]
usage = '''
arg "mode" "choose between `build` or `watch`"
'''
run = '''
dart run build_runner {{ arg(name="mode") }} $usage_mode
'''
description = "task to support forwarding args to `build_runner`"
dir = "{{ config_root }}"

[tasks.build]
run = "mise run builder build"

[tasks.watch]
run = "mise run builder watch --dev"

[tasks.flavorizr]
run = "dart run flutter_flavorizr"

[tasks.update-deps-flutter]
run = "flutter pub upgrade"

[tasks.update-deps-macos]
run = "pod repo update"
dir = "{{ config_root }}/macos"

[tasks.update-deps-ios]
run = "pod repo update"
dir = "{{ config_root }}/ios"

[tasks.update-deps]
wait_for = ["update-deps-flutter"]
depends = ["update-deps-macos", "update-deps-ios"]

[tasks.flutter-clean]
run = "flutter clean"

# [tasks.de]
