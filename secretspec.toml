[project]
name = "waypoints"
revision = "1.0"

[providers]
sops = "sops://secrets.sops.yaml"
env = "env://"

[profiles.default]
GH_TOKEN = { description = "GitHub Token", required = false, provider = ["env"] }

[profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
# DATABASE_URL = { default = "sqlite:///dev.db" }
#
# New secrets
# REDIS_URL = { description = "Redis connection URL for caching", required = false, default = "redis://localhost:6379" }

[profiles.release.defaults]
providers = ["sops"]

[profiles.release.APPLE_API_KEY_PATH]
description = "Apple Notarization [Private] Key"
ref = { item = "apple-notary-key" }
providers = ["sops"]
as_path = true

[profiles.release.APPLE_API_KEY]
description = "Apple Notarization [Public] Key"
ref = { item = "apple-notary-key-id" }
providers = ["sops"]

[profiles.release.APPLE_API_ISSUER]
description = "Apple Notarization Issuer ID"
ref = { item = "apple-notary-issuer-id" }
providers = ["sops"]

[profiles.release.APPLE_CERTIFICATE]
description = "Apple Certificate"
ref = { item = "apple-certificate" }
providers = ["sops"]

[profiles.release.APPLE_CERTIFICATE_PASSWORD]
description = "Apple Certificate Password"
ref = { item = "apple-certificate-password" }
providers = ["sops"]

[profiles.release.TAURI_SIGNING_PRIVATE_KEY]
description = "Private Key for Tauri Signing"
ref = { item = "updater-private-key" }
providers = ["sops"]

[profiles.release.TAURI_SIGNING_PRIVATE_KEY_PASSWORD]
description = "Password for Tauri Signing Private Key"
ref = { item = "updater-password" }
providers = ["sops"]

[profiles.release.APPLE_DISTRIBUTION_CERTIFICATE]
description = "Apple Distribution Certificate (.p12)"
ref = { item = "apple-distribution-certificate" }
providers = ["sops"]
encoding = "base64"
as_path = true

[profiles.release.APPLE_DISTRIBUTION_PASSWORD]
description = "Apple Distribution Certificate Password"
ref = { item = "apple-distribution-password" }
providers = ["sops"]

[profiles.release.APPLE_DISTRIBUTION_PROFILE]
description = "Apple Distribution Provisioning Profile"
ref = { item = "apple-distribution-profile" }
providers = ["sops"]
encoding = "base64"
as_path = true

[profiles.release.ANDROID_KEYSTORE]
description = "Base64 encoding of the Android Keystore"
ref = { item = "android-keystore" }
providers = ["sops"]
encoding = "base64"
as_path = true

[profiles.release.ANDROID_KEYSTORE_ALIAS]
description = "Android Keystore Alias"
ref = { item = "android-keystore-alias" }
providers = ["sops"]

[profiles.release.ANDROID_KEYSTORE_PASSWORD]
description = "Android Keystore Password"
ref = { item = "android-keystore-password" }
providers = ["sops"]

[profiles.release.ANDROID_KEYSTORE_PATH]
description = "Android Keystore `.properties` path"
as_path = true
composed = """
storeFile=${ANDROID_KEYSTORE}
keyAlias=${ANDROID_KEYSTORE_ALIAS}
password=${ANDROID_KEYSTORE_PASSWORD}
"""

[profiles.release.GOOGLE_PLAY_JSON_KEY_PATH]
description = "Google Play JSON Key (Base64)"
ref = { item = "google-play-store-json-key" }
providers = ["sops"]
encoding = "base64"
as_path = true

[scopes.macos]
secrets = [
  # All three are needed together. With the path absent, tauri-bundler falls
  # back to searching ./private_keys and ~/.appstoreconnect/private_keys for
  # `AuthKey_<APPLE_API_KEY>.p8`, finds nothing, and *warns* rather than fails —
  # yielding a signed but un-notarized bundle that Gatekeeper rejects. The
  # filename is irrelevant when the path is set; it is used verbatim.
  "APPLE_API_KEY",
  "APPLE_API_KEY_PATH",
  "APPLE_API_ISSUER",
  "APPLE_CERTIFICATE",
  "APPLE_CERTIFICATE_PASSWORD",
  "TAURI_SIGNING_PRIVATE_KEY",
  "TAURI_SIGNING_PRIVATE_KEY_PASSWORD",
]

[scopes.linux]
secrets = ["TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"]

[scopes.windows]
secrets = ["TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"]

[scopes.android]
secrets = [
  "ANDROID_KEYSTORE",
  "ANDROID_KEYSTORE_ALIAS",
  "ANDROID_KEYSTORE_PASSWORD",
  "ANDROID_KEYSTORE_PATH",
  "GOOGLE_PLAY_JSON_KEY_PATH",
]

[scopes.ios]
# These three are the whole of iOS signing. `tauri ios build` reads them
# (mobile/ios/build.rs: auth_credentials_from_env) and hands them to Xcode,
# which fetches or creates the certificate and provisioning profile itself — no
# keychain to populate, no profile to install. Supplying IOS_CERTIFICATE /
# IOS_CERTIFICATE_PASSWORD / IOS_MOBILE_PROVISION instead would switch tauri to
# manual signing; those are the only names it recognises for that, so adding
# signing material under any other name has no effect on the build.
#
# All three or none: a partial set is a hard error, not a fallback.
secrets = [
  "APPLE_API_KEY",
  "APPLE_API_KEY_PATH",
  "APPLE_API_ISSUER",
]
