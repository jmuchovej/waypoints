#:tombi toml-version = "v1.1.0"

[project]
name = "waypoints"
revision = "1.0"

[providers]
sops = "sops://secrets.sops.yaml"
env = "env://"

[profiles.default]
GH_TOKEN = { description = "GitHub Token", provider = ["env"] }
WP_BOTSWAIN_APP_ID = { description = "wp-botswain GitHub App ID" }
WP_BOTSWAIN_PRIVATE_KEY = { description = "wp-botswain GitHub App Private Key" }
APPLE_API_KEY_PATH = { description = "Apple Notarization [Private] Key", as_path = true }
APPLE_API_KEY = { description = "Apple Notarization [Public] Key" }
APPLE_API_ISSUER = { description = "Apple Notarization Issuer ID" }
APPLE_CERTIFICATE = { description = "Apple Certificate" }
APPLE_CERTIFICATE_PASSWORD = { description = "Apple Certificate Password" }
TAURI_SIGNING_PRIVATE_KEY = { description = "Private Key for Tauri Signing" }
TAURI_SIGNING_PRIVATE_KEY_PASSWORD = { description = "Password for Tauri Signing Private Key" }
APPLE_DISTRIBUTION_CERTIFICATE = { description = "Apple Distribution Certificate (.p12)", encoding = "base64", as_path = true }
APPLE_DISTRIBUTION_PASSWORD = { description = "Apple Distribution Certificate Password" }
APPLE_DISTRIBUTION_PROFILE = { description = "Apple Distribution Provisioning Profile", encoding = "base64", as_path = true }
ANDROID_KEYSTORE = { description = "Base64 encoding of the Android Keystore", encoding = "base64", as_path = true }
ANDROID_KEYSTORE_ALIAS = { description = "Android Keystore Alias" }
ANDROID_KEYSTORE_PASSWORD = { description = "Android Keystore Password" }
ANDROID_KEYSTORE_PATH = { description = "Android Keystore `.properties` path", as_path = true }
GOOGLE_PLAY_JSON_KEY_PATH = { description = "Google Play JSON Key (Base64)", encoding = "base64", as_path = true }

[profiles.default.defaults]
required = false

[profiles.development]

[profiles.release]
APPLE_API_KEY_PATH = { ref = { item = "apple-notary-key" } }
APPLE_API_KEY = { ref = { item = "apple-notary-key-id" } }
APPLE_API_ISSUER = { ref = { item = "apple-notary-issuer-id" } }
APPLE_CERTIFICATE = { ref = { item = "apple-certificate" } }
APPLE_CERTIFICATE_PASSWORD = { ref = { item = "apple-certificate-password" } }
TAURI_SIGNING_PRIVATE_KEY = { ref = { item = "updater-private-key" } }
TAURI_SIGNING_PRIVATE_KEY_PASSWORD = { ref = { item = "updater-password" } }
APPLE_DISTRIBUTION_CERTIFICATE = { ref = { item = "apple-distribution-certificate" } }
APPLE_DISTRIBUTION_PASSWORD = { ref = { item = "apple-distribution-password" } }
APPLE_DISTRIBUTION_PROFILE = { ref = { item = "apple-distribution-profile" } }
ANDROID_KEYSTORE = { ref = { item = "android-keystore" } }
ANDROID_KEYSTORE_ALIAS = { ref = { item = "android-keystore-alias" } }
ANDROID_KEYSTORE_PASSWORD = { ref = { item = "android-keystore-password" } }
ANDROID_KEYSTORE_PATH = {
  composed = """
storeFile=${ANDROID_KEYSTORE}
keyAlias=${ANDROID_KEYSTORE_ALIAS}
password=${ANDROID_KEYSTORE_PASSWORD}
"""
}
GOOGLE_PLAY_JSON_KEY_PATH = { ref = { item = "google-play-store-json-key" } }

[profiles.release.defaults]
providers = ["sops"]
required = true

# Credentials CI authenticates as, kept apart from the release profile so a run
# that only needs to mint a token does not resolve the whole signing set.
[profiles.automation]
WP_BOTSWAIN_APP_ID = { ref = { item = "botswain-app-id" } }
WP_BOTSWAIN_PRIVATE_KEY = { ref = { item = "botswain-private-key" } }

[profiles.automation.defaults]
providers = ["sops"]
required = true

[scopes.macos]
secrets = [
  "APPLE_API_KEY",
  "APPLE_API_KEY_PATH",
  "APPLE_API_ISSUER",
  "TAURI_SIGNING_PRIVATE_KEY",
  "TAURI_SIGNING_PRIVATE_KEY_PASSWORD",
]

[scopes.linux]
secrets = ["TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"]

[scopes.windows]
secrets = ["TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"]

[scopes.android]
secrets = [
  "ANDROID_KEYSTORE",
  "ANDROID_KEYSTORE_ALIAS",
  "ANDROID_KEYSTORE_PASSWORD",
  "ANDROID_KEYSTORE_PATH",
  "GOOGLE_PLAY_JSON_KEY_PATH",
]

[scopes.ios]
secrets = ["APPLE_API_KEY", "APPLE_API_KEY_PATH", "APPLE_API_ISSUER"]
