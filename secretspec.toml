#:tombi toml-version = "v1.1.0"

[project]
  name     = "waypoints"
  revision = "1.0"

# `op` and `op-web` are what CI reads. `sops` and `sops-web` address the same
# declarations in a local, gitignored file encrypted to your own age key, for
# development without vault access: `SECRETSPEC_PROVIDER=sops`.
[providers]
  env      = "env://"
  op       = "onepassword+token://wp-prod"
  op-web   = "onepassword+token://wp-web"
  sops     = "sops://secrets.sops.yaml"
  sops-web = "sops://website/secrets.sops.yaml"

[profiles.default]
  GH_TOKEN                           = { description = "GitHub Token" }
  WP_BOTSWAIN_APP_ID                 = { description = "wp-botswain GitHub App ID" }
  WP_BOTSWAIN_PRIVATE_KEY            = {
    description = "wp-botswain GitHub App Private Key"
  }
  APPLE_API_KEY_PATH                 = {
    description = "Apple Notarization [Private] Key",
    encoding    = "base64",
    as_path     = true
  }
  APPLE_API_KEY                      = {
    description = "Apple Notarization [Public] Key"
  }
  APPLE_API_ISSUER                   = { description = "Apple Notarization Issuer ID" }
  # Tauri decodes these itself, so they travel as base64 text, not as files.
  APPLE_CERTIFICATE                  = {
    description = "Developer ID Application certificate (.p12, base64) — signs macOS bundles"
  }
  APPLE_CERTIFICATE_PASSWORD         = {
    description = "Password of the Developer ID Application .p12"
  }
  IOS_CERTIFICATE                    = {
    description = "Apple Distribution certificate (.p12, base64) — signs iOS archives"
  }
  IOS_CERTIFICATE_PASSWORD           = {
    description = "Password of the Apple Distribution .p12"
  }
  # One App Store profile per bundle identifier. Tauri reads a single
  # IOS_MOBILE_PROVISION; `xtauri build ios` exports it from whichever of these
  # matches the flavor.
  IOS_MOBILE_PROVISION_STABLE        = {
    description = "App Store provisioning profile for so.waypoints (.mobileprovision, base64)"
  }
  IOS_MOBILE_PROVISION_PREVIEW       = {
    description = "App Store provisioning profile for so.waypoints.preview (.mobileprovision, base64)"
  }
  IOS_MOBILE_PROVISION_NIGHTLY       = {
    description = "App Store provisioning profile for so.waypoints.nightly (.mobileprovision, base64)"
  }
  TAURI_SIGNING_PRIVATE_KEY          = { description = "Private Key for Tauri Signing" }
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD = {
    description = "Password for Tauri Signing Private Key"
  }
  ANDROID_KEYSTORE                   = {
    description = "Base64 encoding of the Android Keystore",
    encoding    = "base64",
    as_path     = true
  }
  ANDROID_KEYSTORE_ALIAS             = { description = "Android Keystore Alias" }
  ANDROID_KEYSTORE_PASSWORD          = { description = "Android Keystore Password" }
  ANDROID_KEYSTORE_PATH              = {
    description = "Android Keystore `.properties` path",
    as_path     = true
  }
  GOOGLE_PLAY_JSON_KEY_PATH          = {
    description = "Google Play JSON Key",
    encoding    = "base64",
    as_path     = true
  }

  # Day-to-day values come from the caller's environment; nothing here is
  # read from a vault.
  [profiles.default.defaults]
    providers = [ "env" ]
    required  = false

# What `xtauri dev` resolves: the same optional declarations as `default`,
# from the environment. Stated rather than inherited because a profile without
# its own `defaults` makes every inherited secret required.
[profiles.development]
  [profiles.development.defaults]
    providers = [ "env" ]
    required  = false

[profiles.release]
  APPLE_API_KEY_PATH                 = {
    refs = {
      op   = { item = "Apple Notary", field = "base64" },
      sops = { item = "apple-notary-key" }
    }
  }
  APPLE_API_KEY                      = {
    refs = {
      op   = { item = "Apple Notary", field = "key-id" },
      sops = { item = "apple-notary-key-id" }
    }
  }
  APPLE_API_ISSUER                   = {
    refs = {
      op   = { item = "Apple Notary", field = "issuer-id" },
      sops = { item = "apple-notary-issuer-id" }
    }
  }
  APPLE_CERTIFICATE                  = {
    refs = {
      op   = { item = "Apple Developer ID Application Certificate", field = "base64" },
      sops = { item = "apple-certificate" }
    }
  }
  APPLE_CERTIFICATE_PASSWORD         = {
    refs = {
      op   = { item = "Apple Developer ID Application Certificate", field = "password" },
      sops = { item = "apple-certificate-password" }
    }
  }
  IOS_CERTIFICATE                    = {
    refs = {
      op   = { item = "Apple Distribution Certificate", field = "base64" },
      sops = { item = "apple-distribution-certificate" }
    }
  }
  IOS_CERTIFICATE_PASSWORD           = {
    refs = {
      op   = { item = "Apple Distribution Certificate", field = "password" },
      sops = { item = "apple-distribution-password" }
    }
  }
  IOS_MOBILE_PROVISION_STABLE        = {
    refs = {
      op   = { item = "iOS Distribution Profiles", field = "stable" },
      sops = { item = "apple-distribution-profile-stable" }
    }
  }
  IOS_MOBILE_PROVISION_PREVIEW       = {
    refs = {
      op   = { item = "iOS Distribution Profiles", field = "preview" },
      sops = { item = "apple-distribution-profile-preview" }
    }
  }
  IOS_MOBILE_PROVISION_NIGHTLY       = {
    refs = {
      op   = { item = "iOS Distribution Profiles", field = "nightly" },
      sops = { item = "apple-distribution-profile-nightly" }
    }
  }
  TAURI_SIGNING_PRIVATE_KEY          = {
    refs = {
      op   = { item = "Tauri Updater", field = "private-key" },
      sops = { item = "updater-private-key" }
    }
  }
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD = {
    refs = {
      op   = { item = "Tauri Updater", field = "password" },
      sops = { item = "updater-password" }
    }
  }
  ANDROID_KEYSTORE                   = {
    refs = {
      op   = { item = "Android Keystore", field = "base64" },
      sops = { item = "android-keystore" }
    }
  }
  ANDROID_KEYSTORE_ALIAS             = {
    refs = {
      op   = { item = "Android Keystore", field = "alias" },
      sops = { item = "android-keystore-alias" }
    }
  }
  ANDROID_KEYSTORE_PASSWORD          = {
    refs = {
      op   = { item = "Android Keystore", field = "password" },
      sops = { item = "android-keystore-password" }
    }
  }
  ANDROID_KEYSTORE_PATH              = {
    composed = """
storeFile=${ANDROID_KEYSTORE}
keyAlias=${ANDROID_KEYSTORE_ALIAS}
password=${ANDROID_KEYSTORE_PASSWORD}
"""
  }
  GOOGLE_PLAY_JSON_KEY_PATH          = {
    refs = {
      op   = { item = "Google Play Store", field = "base64" },
      sops = { item = "google-play-store-json-key" }
    }
  }

  [profiles.release.defaults]
    providers = [ "op" ]
    required  = true

# Credentials CI authenticates as, kept apart from the release profile so a run
# that only needs to mint a token does not resolve the whole signing set.
# Standalone (`inherit = false`): with `required = true`, inheriting `default`
# would make every signing secret required here too.
[profiles.automation]
  WP_BOTSWAIN_APP_ID      = {
    description = "wp-botswain GitHub App ID",
    refs        = {
      op   = { item = "botswain", field = "app-id" },
      sops = { item = "botswain-app-id" }
    }
  }
  WP_BOTSWAIN_PRIVATE_KEY = {
    description = "wp-botswain GitHub App Private Key",
    refs        = {
      op   = { item = "botswain", field = "private key" },
      sops = { item = "botswain-private-key" }
    }
  }

  [profiles.automation.defaults]
    inherit   = false
    providers = [ "op" ]
    required  = true

# What the website Worker reads at runtime. Rendered into `.dev.vars` locally
# and pushed to Cloudflare by the `website/justfile` recipes; no CI consumer.
[profiles.website]
  NUXT_GITHUB_TOKEN              = {
    description = "GitHub PAT for the prerendered update routes",
    refs        = {
      op-web   = { item = "GitHub PAT", field = "token" },
      sops-web = { item = "NUXT_GITHUB_TOKEN" }
    }
  }
  NUXT_GITHUB_APP_ID             = {
    description = "GitHub OAuth App ID",
    refs        = {
      op-web   = { item = "GitHub OAuth App", field = "app-id" },
      sops-web = { item = "NUXT_GITHUB_APP_ID" }
    }
  }
  NUXT_GITHUB_CLIENT_ID          = {
    description = "GitHub OAuth Client ID",
    refs        = {
      op-web   = { item = "GitHub OAuth App", field = "client-id" },
      sops-web = { item = "NUXT_GITHUB_CLIENT_ID" }
    }
  }
  NUXT_GITHUB_CLIENT_SECRET      = {
    description = "GitHub OAuth Client Secret",
    refs        = {
      op-web   = { item = "GitHub OAuth App", field = "client-secret" },
      sops-web = { item = "NUXT_GITHUB_CLIENT_SECRET" }
    }
  }
  NUXT_OG_IMAGE_SECRET_KEY       = {
    description = "nuxt-og-image signing key",
    refs        = {
      op-web   = { item = "Nuxt OG Image", field = "password" },
      sops-web = { item = "NUXT_OG_IMAGE_SECRET_KEY" }
    }
  }
  NUXT_BETTER_AUTH_SECRET        = {
    description = "Better Auth secret",
    refs        = {
      op-web   = { item = "Better Auth", field = "password" },
      sops-web = { item = "NUXT_BETTER_AUTH_SECRET" }
    }
  }
  NUXT_TURSO_DATABASE_URL        = {
    description = "Turso database URL",
    refs        = {
      op-web   = { item = "Turso Database", field = "URL" },
      sops-web = { item = "NUXT_TURSO_DATABASE_URL" }
    }
  }
  NUXT_TURSO_AUTH_TOKEN          = {
    description = "Turso auth token",
    refs        = {
      op-web   = { item = "Turso Database", field = "password" },
      sops-web = { item = "NUXT_TURSO_AUTH_TOKEN" }
    }
  }
  NUXT_PUBLIC_TURNSTILE_SITE_KEY = {
    description = "Cloudflare Turnstile site key",
    refs        = {
      op-web   = { item = "Cloudflare Turnstile", field = "site-key" },
      sops-web = { item = "NUXT_PUBLIC_TURNSTILE_SITE_KEY" }
    }
  }
  NUXT_TURNSTILE_SECRET_KEY      = {
    description = "Cloudflare Turnstile secret key",
    refs        = {
      op-web   = { item = "Cloudflare Turnstile", field = "secret-key" },
      sops-web = { item = "NUXT_TURNSTILE_SECRET_KEY" }
    }
  }

  [profiles.website.defaults]
    inherit   = false
    providers = [ "op-web" ]
    required  = true

[scopes.macos]
  secrets = [
    "APPLE_API_KEY",
    "APPLE_API_KEY_PATH",
    "APPLE_API_ISSUER",
    "APPLE_CERTIFICATE",
    "APPLE_CERTIFICATE_PASSWORD",
    "TAURI_SIGNING_PRIVATE_KEY",
    "TAURI_SIGNING_PRIVATE_KEY_PASSWORD",
  ]

[scopes.linux]
  secrets = [ "TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]

[scopes.windows]
  secrets = [ "TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]

[scopes.android]
  secrets = [
    "ANDROID_KEYSTORE",
    "ANDROID_KEYSTORE_ALIAS",
    "ANDROID_KEYSTORE_PASSWORD",
    "ANDROID_KEYSTORE_PATH",
    "GOOGLE_PLAY_JSON_KEY_PATH",
  ]

[scopes.ios]
  secrets = [
    "APPLE_API_KEY",
    "APPLE_API_KEY_PATH",
    "APPLE_API_ISSUER",
    "IOS_CERTIFICATE",
    "IOS_CERTIFICATE_PASSWORD",
    "IOS_MOBILE_PROVISION_STABLE",
    "IOS_MOBILE_PROVISION_PREVIEW",
    "IOS_MOBILE_PROVISION_NIGHTLY",
  ]
