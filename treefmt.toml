# One CLI to format the code tree - https://github.com/numtide/treefmt

# Do not exit with error if a configured formatter is missing
# Env $TREEFMT_ALLOW_MISSING_FORMATTER
allow-missing-formatter = true

# The file into which a cpu profile will be written
# Env $TREEFMT_CPU_PROFILE
# cpu-profile = ./cpu.pprof

# Exclude files or directories matching the specified globs
# Env $TREEFMT_EXCLUDES
excludes = ["*.png", "*.gif"]

# Exit with error if any changes were made during execution
# Useful for CI
# Env $TREEFMT_FAIL_ON_CHANGE
# fail-on-change = true

# A list of formatters to apply
# Defaults to all configured formatters
# Env $TREEFMT_FORMATTERS
# formatters = ["gofmt", "prettier"]

# Log paths that did not match any formatters at the specified log level
# Possible values are <debug|info|warn|error|fatal>
# Env $TREEFMT_ON_UNMATCHED
on-unmatched = "info"

# The root directory from which treefmt will start walking the filesystem
# Defaults to the directory containing the config file
# Env $TREEFMT_TREE_ROOT
# tree-root = "/tmp/foo"

# File to search for to find the tree root (if tree-root is not set)
# Env $TREEFMT_TREE_ROOT_FILE
# tree-root-file = ".git/config"

# Set the verbosity of logs
# 0 = warn, 1 = info, 2 = debug
# Env $TREEFMT_VERBOSE
verbose = 1

# The method used to traverse the files within the tree root
# Currently, we support 'auto', 'git' or 'filesystem'
# Env $TREEFMT_WALK
walk = "auto"

# https://github.com/numtide/treefmt-nix/blob/main/examples/formatter-dart-format.toml
[formatter.dart-format]
command = "dart"
options = ["format"]
includes = ["*.dart"]
excludes = []
priority = 0

# https://github.com/numtide/treefmt-nix/blob/main/examples/formatter-ruff-format.toml
[formatter.ruff-format]
command = "ruff"
options = ["format"]
excludes = []
includes = ["*.py", "*.pyi"]
priority = 0

# https://github.com/numtide/treefmt-nix/blob/main/examples/formatter-ruff-check.toml
[formatter.ruff-check]
command = "ruff"
options = ["check", "--fix"]
excludes = []
includes = ["*.py", "*.pyi"]
priority = 1

# https://github.com/numtide/treefmt-nix/blob/main/examples/formatter-yamlfmt.toml
[formatter.yamlfmt]
command = "yamlfmt"
options = []
excludes = []
includes = ["*.yaml", "*.yml"]

# https://github.com/numtide/treefmt-nix/blob/main/examples/formatter-jsonfmt.toml
# NOTE Look into using https://github.com/google/json5format
[formatter.jsonfmt]
command = "jsonfmt"
options = ["-w"]
includes = ["*.json"]
excludes = ["**/tsconfig.json"]

#! NOTE this requires either `brew install ...` 👎 or doing a `java -jar ...` 🥲
#! https://github.com/facebook/ktfmt?tab=readme-ov-file#installation
# https://github.com/numtide/treefmt-nix/blob/main/examples/formatter-ktfmt.toml
# [formatter.ktfmt]
# command = "ktfmt"
# options = []
# excludes = []
# includes = ["*.kt", "*.kts"]

# https://github.com/numtide/treefmt-nix/blob/main/examples/formatter-swift-format.toml
[formatter.swift-format]
command = "swift"
options = ["format", "-i"]
excludes = []
includes = ["*.swift"]

