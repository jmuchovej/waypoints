# The shape of the two key Secrets — an example, deliberately not listed in
# kustomization.yaml. Never apply this file: create the real Secrets from
# files `outpost keygen` wrote, so the keys exist before the first start and
# never pass through the manifests:
#
#   outpost keygen --out station.key
#   kubectl create secret generic outpost-station-key --from-file=station.key
#   outpost keygen --out fleet.key
#   kubectl create secret generic outpost-fleet-key --from-file=fleet.key
#
# Both files are 32 raw bytes, an Ed25519 seed. The station key is this
# Station's identity: Vessels pin it, so a new one is a new Station. The
# fleet key is the Fleet's ordering authority: a Station handed it
# countersigns every ACL record; lose it and nothing can order for the
# Fleet's Territories again, leak it and anyone can.
apiVersion: v1
kind: Secret
metadata:
  name: outpost-station-key
type: Opaque
data:
  station.key: <base64 of the 32-byte file>
---
apiVersion: v1
kind: Secret
metadata:
  name: outpost-fleet-key
type: Opaque
data:
  fleet.key: <base64 of the 32-byte file>
