patchedDependencies:
  # Five independent fixes; recheck all of them on each docus bump:
  # 1. nuxt.config.ts type-check fixes — it references config keys
  #    (content/mdc/icon/ogImage/robots) whose NuxtConfig augmentations aren't
  #    loaded when consumed as a layer. Type-only — no runtime change. Upstream
  #    fixed the modules/config.ts half in 5.12.x; the rest is still needed.
  # 2. content.config.ts landing_* collection removal — the website owns its
  #    landing page (index.vue + pages_* collections) and @nuxt/content has no
  #    hook to delete a layer-merged collection. Pairs with website/modules/
  #    routing.ts, which confines docus's catch-all to /docs.
  # 3. app/composables/useSeo.ts — the local `links`/`scripts` arrays were typed
  #    loosely enough to match no member of unhead's Link/Script unions. Narrowed
  #    to the variants actually pushed. Type-only.
  # 4. app/plugins/i18n.ts + modules/assistant/.../useAssistant.ts — both read
  #    `public.i18n.defaultLocale`, but @nuxtjs/i18n is not enabled here so the
  #    module contributes no runtime-config augmentation and the key widens to
  #    `{}`. Both call sites already guard with `?.`; this only states the type.
  #    Drop these two if @nuxtjs/i18n is ever switched on in website/nuxt.config.
  # 5. app/plugins/i18n.ts middleware — dropped an explicit RouteLocationNormalized
  #    annotation so `to` is typed contextually. The annotation pulled the type
  #    from docus' own vue-router instance, which is a second copy of 5.2.0 and
  #    so never matched the app's. Type-only; see also the `h3` catalog pin.
  docus@5.12.3: tooling/patches/docus@5.12.3.patch
  # Upstream bug, not a local workaround: plugins/devtools-connection.client.ts
  # reads `client.host.*` off the value passed to onConnected, but the layer
  # hands that callback its guarded DevtoolsHost adapter instead of the raw
  # devtools-kit client. Every read resolved to undefined, so base/path/query
  # silently fell back to '/'. Rewritten against the adapter. Drop on any bump
  # that fixes it upstream.
  nuxtseo-layer-devtools@5.3.12: tooling/patches/nuxtseo-layer-devtools@5.3.12.patch
