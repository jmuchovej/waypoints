catalogs:
  # Storybook addons are coupled to the core major — they load through its
  # runtime, so a major mismatch fails at boot.
  # FIXME: core is 9.x while the addons and the eslint plugin are 10.x. This
  # skew predates the catalog and is left as-is deliberately; resolve it as its
  # own change (either core -> ^10 or addons -> ^9), not as a drive-by edit.
  storybook:
    "@nuxtjs/storybook": "^9.0.1"
    "@storybook/addon-a11y": "^10.3.5"
    "@storybook/addon-docs": "^10.3.5"
    eslint-plugin-storybook: "^10.3.5"
    storybook: "^10.5.8"

  # Must track the `tauri` Rust crate in Cargo.toml — a JS/Rust version skew
  # here surfaces as a runtime IPC failure, not a build error. Bump together.
  tauri:
    "@tauri-apps/api": "^2.10.1"
    "@tauri-apps/cli": "^2.10.1"
    "@tauri-apps/plugin-barcode-scanner": "^2.4.5"
    "@tauri-apps/plugin-deep-link": "^2.4.9"
    "@tauri-apps/plugin-dialog": "^2.7.0"
    "@tauri-apps/plugin-fs": "^2.5.0"
    "@tauri-apps/plugin-notification": "^2.3.3"
    "@tauri-apps/plugin-os": "^2.3.2"
    "@tauri-apps/plugin-shell": "^2.3.5"
    "@tauri-apps/plugin-store": "^2.4.2"

  # Tiptap ships all 23 packages from one release; mixing minors breaks the
  # ProseMirror schema they share. Every entry moves in lockstep.
  tiptap:
    "@tiptap/core": "^3.30.1"
    "@tiptap/extension-blockquote": "^3.30.1"
    "@tiptap/extension-bold": "^3.30.1"
    "@tiptap/extension-code": "^3.30.1"
    "@tiptap/extension-code-block": "^3.30.1"
    "@tiptap/extension-document": "^3.30.1"
    "@tiptap/extension-emoji": "^3.30.1"
    "@tiptap/extension-hard-break": "^3.30.1"
    "@tiptap/extension-heading": "^3.30.1"
    "@tiptap/extension-horizontal-rule": "^3.30.1"
    "@tiptap/extension-italic": "^3.30.1"
    "@tiptap/extension-link": "^3.30.1"
    "@tiptap/extension-list": "^3.30.1"
    "@tiptap/extension-paragraph": "^3.30.1"
    "@tiptap/extension-placeholder": "^3.30.1"
    "@tiptap/extension-strike": "^3.30.1"
    "@tiptap/extension-subscript": "^3.30.1"
    "@tiptap/extension-superscript": "^3.30.1"
    "@tiptap/extension-text": "^3.30.1"
    "@tiptap/extension-underline": "^3.30.1"
    "@tiptap/extensions": "^3.30.1"
    "@tiptap/pm": "^3.30.1"
    "@tiptap/vue-3": "^3.30.1"

# pnpm 10 blocks dependency build scripts unless allow-listed here. Carried
# over from bun's `trustedDependencies`, plus the native packages bun built
# implicitly. Run `pnpm install` and check the "Ignored build scripts" warning
# before adding more.
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@tailwindcss/oxide"
  - better-sqlite3
  - esbuild
  - sharp
  - unrs-resolver
  - vue-demi

overrides:
  "@internationalized/date": 3.12.1
  "@tiptap/vue-3": 3.22.4

patchedDependencies:
  # Five independent fixes; recheck all of them on each docus bump:
  # 1. nuxt.config.ts type-check fixes — it references config keys
  #    (content/mdc/icon/ogImage/robots) whose NuxtConfig augmentations aren't
  #    loaded when consumed as a layer. Type-only — no runtime change. Upstream
  #    fixed the modules/config.ts half in 5.12.x; the rest is still needed.
  # 2. content.config.ts landing_* collection removal — the website owns its
  #    landing page (index.vue + pages_* collections) and @nuxt/content has no
  #    hook to delete a layer-merged collection. Pairs with website/modules/
  #    routing.ts, which confines docus's catch-all to /docs.
  # 3. app/composables/useSeo.ts — the local `links`/`scripts` arrays were typed
  #    loosely enough to match no member of unhead's Link/Script unions. Narrowed
  #    to the variants actually pushed. Type-only.
  # 4. app/plugins/i18n.ts + modules/assistant/.../useAssistant.ts — both read
  #    `public.i18n.defaultLocale`, but @nuxtjs/i18n is not enabled here so the
  #    module contributes no runtime-config augmentation and the key widens to
  #    `{}`. Both call sites already guard with `?.`; this only states the type.
  #    Drop these two if @nuxtjs/i18n is ever switched on in website/nuxt.config.
  # 5. app/plugins/i18n.ts middleware — dropped an explicit RouteLocationNormalized
  #    annotation so `to` is typed contextually. The annotation pulled the type
  #    from docus' own vue-router instance, which is a second copy of 5.2.0 and
  #    so never matched the app's. Type-only; see also the `h3` catalog pin.
  docus@5.12.3: patches/docus@5.12.3.patch
  # Upstream bug, not a local workaround: plugins/devtools-connection.client.ts
  # reads `client.host.*` off the value passed to onConnected, but the layer
  # hands that callback its guarded DevtoolsHost adapter instead of the raw
  # devtools-kit client. Every read resolved to undefined, so base/path/query
  # silently fell back to '/'. Rewritten against the adapter. Drop on any bump
  # that fixes it upstream.
  nuxtseo-layer-devtools@5.3.12: patches/nuxtseo-layer-devtools@5.3.12.patch
